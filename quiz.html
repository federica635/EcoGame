<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>EcoQuiz 🌍</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dcedc8, #e8f5e9);
            margin: 0;
            text-align: center;
            color: #173b22;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 30px;
        }

        header h1 {
            font-size: 42px;
            margin: 10px;
        }

        .quiz {
            background: white;
            width: 85%;
            max-width: 700px;
            margin: 40px auto;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        #numero {
            color: #388e3c;
            font-weight: bold;
            font-size: 20px;
        }

        #domanda {
            font-size: 25px;
            margin: 25px;
        }

        button {
            display: block;
            width: 90%;
            max-width: 550px;
            margin: 12px auto;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #43a047;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        #risultato {
            font-size: 22px;
            font-weight: bold;
            margin: 25px;
        }

        #spiegazione {
            background: #f1f8e9;
            border-left: 5px solid #43a047;
            padding: 15px;
            margin: 20px auto;
            max-width: 600px;
            text-align: left;
            display: none;
        }

        #prossima {
            background: #1565c0;
        }

        #prossima:hover {
            background: #0d47a1;
        }

        #finale {
            display: none;
        }

        #punteggioFinale {
            font-size: 32px;
            color: #2e7d32;
            font-weight: bold;
        }

    </style>

</head>


<body>


<header>

    <h1>🌍 EcoQuiz</h1>

    <p>Ecologia e ambiente - livello liceale</p>

</header>


<div class="quiz" id="quiz">

    <div id="numero"></div>

    <h2 id="domanda"></h2>

    <div id="risposte"></div>

    <div id="risultato"></div>

    <div id="spiegazione"></div>

    <button id="prossima"
            onclick="prossimaDomanda()"
            style="display:none;">

        ➡️ Prossima domanda

    </button>

</div>


<div class="quiz" id="finale">

    <h2>🎉 Quiz completato!</h2>

    <p>Hai completato tutte le 20 domande.</p>

    <p id="punteggioFinale"></p>

    <p id="messaggioFinale"></p>

    <button onclick="ricomincia()">
        🔄 Ricomincia
    </button>

</div>


<script>


const domande = [

    {
        domanda: "🌡️ Perché l'aumento della CO₂ atmosferica può contribuire al riscaldamento globale?",
        risposte: [
            "Perché aumenta direttamente l'ossigeno",
            "Perché assorbe parte della radiazione infrarossa terrestre",
            "Perché blocca tutta la luce solare",
            "Perché trasforma l'azoto in ossigeno"
        ],
        corretta: 1,
        spiegazione: "La CO₂ è un gas serra e assorbe parte della radiazione infrarossa emessa dalla superficie terrestre, modificando il bilancio energetico del sistema climatico."
    },

    {
        domanda: "🌳 Cosa può succedere se diminuisce drasticamente una popolazione di predatori apicali?",
        risposte: [
            "Le popolazioni delle prede possono aumentare e modificare altri livelli trofici",
            "L'ecosistema diventa automaticamente più stabile",
            "La fotosintesi scompare",
            "I decompositori scompaiono"
        ],
        corretta: 0,
        spiegazione: "La diminuzione dei predatori può provocare una cascata trofica: aumentando, le prede possono esercitare una maggiore pressione sulle loro risorse."
    },

    {
        domanda: "💧 Perché un eccesso di nitrati e fosfati può provocare eutrofizzazione?",
        risposte: [
            "Elimina immediatamente tutti i microrganismi",
            "Favorisce la crescita algale e può portare a una diminuzione dell'ossigeno",
            "Trasforma l'acqua dolce in acqua salata",
            "Blocca completamente la fotosintesi"
        ],
        corretta: 1,
        spiegazione: "L'eccesso di nutrienti può favorire la proliferazione delle alghe. La decomposizione della biomassa può poi consumare molto ossigeno nell'acqua."
    },

    {
        domanda: "🌊 Che cosa indica l'acidificazione degli oceani?",
        risposte: [
            "Un aumento della temperatura degli oceani",
            "Una diminuzione del pH dell'acqua marina legata anche all'assorbimento di CO₂",
            "La trasformazione dell'acqua marina in acqua dolce",
            "La scomparsa del sale"
        ],
        corretta: 1,
        spiegazione: "L'assorbimento di CO₂ da parte degli oceani modifica gli equilibri chimici del sistema carbonato e contribuisce alla diminuzione del pH."
    },

    {
        domanda: "♻️ Qual è un principio dell'economia circolare?",
        risposte: [
            "Aumentare il consumo di risorse vergini",
            "Mantenere prodotti e materiali in uso il più a lungo possibile",
            "Sostituire sempre gli oggetti invece di ripararli",
            "Aumentare la produzione di rifiuti"
        ],
        corretta: 1,
        spiegazione: "L'economia circolare mira a ridurre sprechi e consumo di risorse attraverso prevenzione, riuso, riparazione, riciclo e altre strategie."
    },

    {
        domanda: "🧪 Nel ciclo dell'azoto, quale processo rende l'azoto atmosferico disponibile in forme utilizzabili dagli organismi?",
        risposte: [
            "Fissazione dell'azoto",
            "Respirazione",
            "Fermentazione",
            "Combustione"
        ],
        corretta: 0,
        spiegazione: "La fissazione dell'azoto converte l'azoto molecolare atmosferico in composti azotati che possono entrare nel ciclo biologico."
    },

    {
        domanda: "🌱 Perché la biodiversità può aumentare la resilienza di un ecosistema?",
        risposte: [
            "Perché elimina ogni competizione",
            "Perché specie diverse possono svolgere funzioni differenti e rispondere diversamente alle perturbazioni",
            "Perché impedisce ogni cambiamento",
            "Perché tutte le specie svolgono la stessa funzione"
        ],
        corretta: 1,
        spiegazione: "Una maggiore diversità può fornire una varietà di funzioni ecologiche e aumentare la capacità dell'ecosistema di reagire a determinate perturbazioni."
    },

    {
        domanda: "☀️ Qual è una differenza fondamentale tra energia solare e combustibili fossili?",
        risposte: [
            "La solare sfrutta un flusso rinnovabile, mentre i combustibili fossili utilizzano riserve finite",
            "I combustibili fossili non producono emissioni",
            "L'energia solare richiede sempre combustione",
            "Sono equivalenti nel ciclo del carbonio"
        ],
        corretta: 0,
        spiegazione: "L'energia solare deriva da un flusso rinnovabile. I combustibili fossili contengono carbonio immagazzinato geologicamente che viene liberato durante la combustione."
    },

    {
        domanda: "🐝 Perché la perdita degli impollinatori può influenzare l'agricoltura?",
        risposte: [
            "Perché producono direttamente il suolo",
            "Perché molte piante dipendono dall'impollinazione animale",
            "Perché controllano la temperatura globale",
            "Perché eliminano tutti i parassiti"
        ],
        corretta: 1,
        spiegazione: "Molte piante, comprese alcune colture, dipendono in parte dagli animali impollinatori per la riproduzione."
    },

    {
        domanda: "🏭 Quale rappresenta una fonte antropogenica di inquinamento atmosferico?",
        risposte: [
            "Un'eruzione vulcanica",
            "Le emissioni derivanti dalla combustione di carburanti nelle attività umane",
            "La fotosintesi",
            "L'evaporazione naturale dell'acqua"
        ],
        corretta: 1,
        spiegazione: "Trasporti, industrie e altri processi umani possono emettere diversi inquinanti atmosferici."
    },

    {
        domanda: "🌍 Qual è la differenza principale tra clima e tempo meteorologico?",
        risposte: [
            "Sono la stessa cosa",
            "Il tempo riguarda condizioni a breve termine, il clima riguarda caratteristiche statistiche su periodi più lunghi",
            "Il clima cambia ogni ora",
            "Il tempo riguarda solo la temperatura"
        ],
        corretta: 1,
        spiegazione: "Il tempo meteorologico descrive condizioni atmosferiche in un determinato momento o breve periodo. Il clima riguarda statistiche e caratteristiche su periodi più lunghi."
    },

    {
        domanda: "🌲 Che cos'è un pozzo di carbonio?",
        risposte: [
            "Un sistema che assorbe più carbonio di quanto ne rilasci nel periodo considerato",
            "Una fonte che emette sempre più CO₂ di quanta ne assorba",
            "Solo un deposito artificiale",
            "Un fenomeno esclusivamente oceanico"
        ],
        corretta: 0,
        spiegazione: "Un pozzo di carbonio è un sistema che, nel bilancio considerato, assorbe più carbonio di quanto ne rilasci."
    },

    {
        domanda: "🐟 Perché la diminuzione di una specie alla base di una rete trofica può influenzare i predatori?",
        risposte: [
            "Perché gli organismi sono collegati attraverso il trasferimento di materia ed energia",
            "Perché tutte le specie hanno lo stesso ruolo",
            "Perché l'energia aumenta salendo nella rete trofica",
            "Perché i predatori producono la biomassa vegetale"
        ],
        corretta: 0,
        spiegazione: "Gli organismi sono collegati attraverso relazioni alimentari. Una variazione alla base della rete può quindi propagarsi verso livelli trofici superiori."
    },

    {
        domanda: "⚡ Perché l'efficienza energetica è importante per la sostenibilità?",
        risposte: [
            "Permette di ottenere lo stesso servizio usando meno energia",
            "Aumenta sempre il consumo",
            "Elimina automaticamente tutte le emissioni",
            "Rende inutili le fonti rinnovabili"
        ],
        corretta: 0,
        spiegazione: "L'efficienza energetica permette di fornire un determinato servizio con un minore consumo di energia."
    },

    {
        domanda: "🌾 Quale conseguenza può avere l'erosione del suolo?",
        risposte: [
            "Aumento permanente della fertilità",
            "Perdita dello strato superficiale e della sostanza organica",
            "Produzione automatica di nuovo suolo fertile",
            "Eliminazione del ciclo dell'acqua"
        ],
        corretta: 1,
        spiegazione: "L'erosione può rimuovere lo strato superficiale del suolo, spesso ricco di sostanza organica e nutrienti."
    },

    {
        domanda: "🧬 Perché una popolazione con bassa variabilità genetica può essere più vulnerabile ai cambiamenti ambientali?",
        risposte: [
            "Perché presenta meno differenze genetiche su cui può agire la selezione naturale",
            "Perché tutti gli individui diventano più forti",
            "Perché la selezione naturale scompare",
            "Perché la popolazione non può riprodursi"
        ],
        corretta: 0,
        spiegazione: "La variabilità genetica aumenta la possibilità che alcuni individui possiedano caratteristiche favorevoli quando l'ambiente cambia."
    },

    {
        domanda: "📊 Due città hanno la stessa popolazione, ma una consuma il doppio dell'energia pro capite. Cosa possiamo concludere?",
        risposte: [
            "Ha necessariamente il doppio delle emissioni",
            "Ha un consumo pro capite maggiore, ma le emissioni dipendono anche dalle fonti energetiche e da altri fattori",
            "Le emissioni sono necessariamente uguali",
            "La seconda non produce emissioni"
        ],
        corretta: 1,
        spiegazione: "Il consumo energetico è importante, ma le emissioni dipendono anche dal mix energetico, dalle tecnologie utilizzate e da altri fattori."
    },

    {
        domanda: "🌊 Perché la perdita di habitat può ridurre la biodiversità?",
        risposte: [
            "Perché riduce o frammenta gli spazi e le risorse disponibili",
            "Perché aumenta sempre il numero di habitat",
            "Perché rende tutte le specie identiche",
            "Perché elimina ogni interazione tra organismi"
        ],
        corretta: 0,
        spiegazione: "La perdita e la frammentazione degli habitat possono ridurre spazio, risorse e possibilità di movimento delle popolazioni."
    },

    {
        domanda: "🌡️ Quale affermazione descrive meglio il rapporto tra effetto serra naturale e cambiamento climatico antropogenico?",
        risposte: [
            "L'effetto serra naturale contribuisce a mantenere la Terra abitabile, mentre l'aumento antropogenico dei gas serra altera il bilancio energetico",
            "L'effetto serra naturale è sempre dannoso",
            "I gas serra non influenzano il bilancio energetico",
            "Il cambiamento climatico dipende esclusivamente dai vulcani"
        ],
        corretta: 0,
        spiegazione: "L'effetto serra naturale è fondamentale per la temperatura della Terra. L'aumento antropogenico dei gas serra modifica ulteriormente il bilancio energetico del sistema climatico."
    },

    {
        domanda: "🌍 Quale idea è più coerente con il concetto di sviluppo sostenibile?",
        risposte: [
            "Soddisfare i bisogni presenti ignorando il futuro",
            "Considerare aspetti ambientali, sociali ed economici nel lungo periodo",
            "Bloccare qualsiasi attività economica",
            "Usare tutte le risorse il più velocemente possibile"
        ],
        corretta: 1,
        spiegazione: "Lo sviluppo sostenibile cerca di integrare dimensioni ambientali, sociali ed economiche considerando anche gli effetti sulle generazioni future."
    }

];


let domandaAttuale = 0;

let punteggio = 0;

let rispostaData = false;


function mostraDomanda() {

    rispostaData = false;

    document.getElementById("risultato").innerText = "";

    document.getElementById("spiegazione").style.display = "none";

    document.getElementById("prossima").style.display = "none";


    const domanda = domande[domandaAttuale];


    document.getElementById("numero").innerText =
        "Domanda " + (domandaAttuale + 1) +
        " di " + domande.length;


    document.getElementById("domanda").innerText =
        domanda.domanda;


    const contenitore =
        document.getElementById("risposte");


    contenitore.innerHTML = "";


    domanda.risposte.forEach(function(risposta, indice) {

        const bottone = document.createElement("button");

        bottone.innerText = risposta;

        bottone.onclick = function() {
            controllaRisposta(indice);
        };

        contenitore.appendChild(bottone);

    });

}


function controllaRisposta(indice) {

    if (rispostaData) {
        return;
    }

    rispostaData = true;

    const domanda = domande[domandaAttuale];


    if (indice === domanda.corretta) {

        punteggio += 10;

        document.getElementById("risultato").innerText =
            "✅ Risposta corretta! +10 punti";

    } else {

        document.getElementById("risultato").innerText =
            "❌ Risposta sbagliata!";

    }


    document.getElementById("spiegazione").innerText =
        "📚 Spiegazione: " + domanda.spiegazione;

    document.getElementById("spiegazione").style.display =
        "block";


    document.getElementById("prossima").style.display =
        "block";

}


function prossimaDomanda() {

    domandaAttuale++;


    if (domandaAttuale < domande.length) {

        mostraDomanda();

    } else {

        mostraRisultatoFinale();

    }

}


function mostraRisultatoFinale() {

    document.getElementById("quiz").style.display =
        "none";

    document.getElementById("finale").style.display =
        "block";


    document.getElementById("punteggioFinale").innerText =
        punteggio + " / 200 punti";


    let messaggio;


    if (punteggio >= 180) {

        messaggio =
            "🌟 Eccellente! Hai una preparazione molto solida.";

    } else if (punteggio >= 140) {

        messaggio =
            "🌱 Molto bene! Hai una buona preparazione.";

    } else if (punteggio >= 100) {

        messaggio =
            "👍 Buon lavoro! Puoi approfondire alcuni argomenti.";

    } else {

        messaggio =
            "📚 Continua a studiare: hai molti concetti da scoprire!";

    }


    document.getElementById("messaggioFinale").innerText =
        messaggio;

}


function ricomincia() {

    domandaAttuale = 0;

    punteggio = 0;


    document.getElementById("finale").style.display =
        "none";

    document.getElementById("quiz").style.display =
        "block";


    mostraDomanda();

}


mostraDomanda();


</script>

</body>

</html>
