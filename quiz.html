// Legge la lingua scelta nella index.html
let lingua = localStorage.getItem("linguaEcoGame") || "it";

let domandaAttuale = 0;

let punteggio = 0;

let rispostaData = false;


/* =========================================================
   CAMBIO LINGUA
   ========================================================= */

function cambiaLingua(nuovaLingua) {

    // Salva anche la nuova lingua scelta direttamente nel quiz
    localStorage.setItem("linguaEcoGame", nuovaLingua);

    lingua = nuovaLingua;

    document.documentElement.lang = lingua;

    document.getElementById("sottotitolo").innerText =
        traduzioni[lingua].sottotitolo;

    document.getElementById("prossima").innerText =
        traduzioni[lingua].prossima;

    document.getElementById("titoloFinale").innerText =
        traduzioni[lingua].finale;

    document.getElementById("testoFinale").innerText =
        traduzioni[lingua].testoFinale;

    document.getElementById("ricomincia").innerText =
        traduzioni[lingua].ricomincia;

    mostraDomanda();

}


/* =========================================================
   MOSTRA DOMANDA
   ========================================================= */

function mostraDomanda() {

    rispostaData = false;

    document.getElementById("risultato").innerText = "";

    document.getElementById("spiegazione").style.display = "none";

    document.getElementById("prossima").style.display = "none";


    const domanda = domande[lingua][domandaAttuale];


    document.getElementById("numero").innerText =
        traduzioni[lingua].domanda + " " +
        (domandaAttuale + 1) + " " +
        traduzioni[lingua].di + " " +
        domande[lingua].length;


    document.getElementById("domanda").innerText =
        domanda.domanda;


    const contenitore =
        document.getElementById("risposte");


    contenitore.innerHTML = "";


    domanda.risposte.forEach(function(risposta, indice) {

        const bottone = document.createElement("button");

        bottone.className = "risposta";

        bottone.innerText = risposta;

        bottone.onclick = function() {
            controllaRisposta(indice);
        };

        contenitore.appendChild(bottone);

    });

}


/* =========================================================
   CONTROLLA RISPOSTA
   ========================================================= */

function controllaRisposta(indice) {

    if (rispostaData) {
        return;
    }

    rispostaData = true;

    const domanda = domande[lingua][domandaAttuale];


    if (indice === domanda.corretta) {

        punteggio += 10;

        document.getElementById("risultato").innerText =
            traduzioni[lingua].corretta;

    } else {

        document.getElementById("risultato").innerText =
            traduzioni[lingua].sbagliata;

    }


    document.getElementById("spiegazione").innerText =
        traduzioni[lingua].spiegazione + domanda.spiegazione;

    document.getElementById("spiegazione").style.display =
        "block";


    document.getElementById("prossima").style.display =
        "block";

}


/* =========================================================
   PROSSIMA DOMANDA
   ========================================================= */

function prossimaDomanda() {

    domandaAttuale++;


    if (domandaAttuale < domande[lingua].length) {

        mostraDomanda();

    } else {

        mostraRisultatoFinale();

    }

}


/* =========================================================
   RISULTATO FINALE
   ========================================================= */

function mostraRisultatoFinale() {

    document.getElementById("quiz").style.display =
        "none";

    document.getElementById("finale").style.display =
        "block";


    document.getElementById("punteggioFinale").innerText =
        punteggio + " / 200 punti";


    let messaggio;


    if (punteggio >= 180) {

        messaggio =
            traduzioni[lingua].eccellente;

    } else if (punteggio >= 140) {

        messaggio =
            traduzioni[lingua].moltoBene;

    } else if (punteggio >= 100) {

        messaggio =
            traduzioni[lingua].buonLavoro;

    } else {

        messaggio =
            traduzioni[lingua].continua;

    }


    document.getElementById("messaggioFinale").innerText =
        messaggio;

}


/* =========================================================
   RICOMINCIA
   ========================================================= */

function ricomincia() {

    domandaAttuale = 0;

    punteggio = 0;

    document.getElementById("finale").style.display =
        "none";

    document.getElementById("quiz").style.display =
        "block";

    mostraDomanda();

}
