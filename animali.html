    <title>🐾 Species Rescue - EcoGame</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101914;
            color: #edf5ef;
        }

        header {
            background: #17271d;
            border-bottom: 1px solid #3d5544;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #a5d6a7;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            color: #c0cec3;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu:hover {
            color: #a5d6a7;
        }

        .container {
            width: 94%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .title {
            text-align: center;
        }

        .title h1 {
            color: #a5d6a7;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .title p {
            color: #becbc1;
            line-height: 1.6;
        }

        .progress {
            height: 8px;
            background: #26382c;
            border-radius: 10px;
            overflow: hidden;
            margin: 25px 0;
        }

        .progress-bar {
            width: 10%;
            height: 100%;
            background: #66bb6a;
            transition: 0.4s;
        }

        .card {
            background: #17271d;
            border: 1px solid #405746;
            border-radius: 18px;
            overflow: hidden;
        }

        .animal-image {
            width: 100%;
            height: 380px;
            object-fit: cover;
            display: block;
            background: #26382c;
        }

        .content {
            padding: 28px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #354b3a;
            color: #c8e6c9;
            font-size: 13px;
            margin-bottom: 10px;
        }

        h2 {
            color: #c8e6c9;
            font-size: 28px;
            margin: 8px 0;
        }

        .info {
            color: #c1cec4;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .mission {
            background: #203328;
            border-left: 4px solid #66bb6a;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 16px;

            background: #203328;
            color: white;

            border: 2px solid #405746;
            border-radius: 11px;

            text-align: left;
            font-size: 16px;

            cursor: pointer;
            transition: 0.15s;
        }

        .option:hover {
            background: #294333;
            border-color: #81c784;
        }

        .option.correct {
            background: #285236;
            border-color: #66bb6a;
        }

        .option.wrong {
            background: #542d2d;
            border-color: #ef7777;
        }

        .feedback {
            display: none;

            margin-top: 20px;
            padding: 17px;

            background: #203328;
            border-radius: 10px;

            line-height: 1.6;
        }

        .next {
            display: none;

            margin: 20px auto 0;

            padding: 13px 25px;

            border: none;
            border-radius: 10px;

            background: #43a047;
            color: white;

            font-size: 16px;
            cursor: pointer;

            transition: 0.2s;
        }

        .next:hover {
            background: #388e3c;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 18px 0;
            color: #b9c8bc;
            flex-wrap: wrap;
        }

        .stats span {
            color: #a5d6a7;
            font-weight: bold;
        }

        .result {
            padding: 40px;
            text-align: center;
        }

        .result-icon {
            font-size: 75px;
        }

        .result h2 {
            color: #a5d6a7;
            font-size: 32px;
        }

        .final-score {
            font-size: 50px;
            color: #ffd54f;
            font-weight: bold;
            margin: 15px;
        }

        .restart,
        .back {
            padding: 13px 22px;
            margin: 8px;

            border: none;
            border-radius: 10px;

            cursor: pointer;
            font-size: 16px;
        }

        .restart {
            background: #43a047;
            color: white;
        }

        .restart:hover {
            background: #388e3c;
        }

        .back {
            background: #455a64;
            color: white;
        }

        .back:hover {
            background: #37474f;
        }

        .hidden {
            display: none;
        }

        @media(max-width: 650px) {

            header {
                padding: 16px 20px;
            }

            .logo {
                font-size: 20px;
            }

            .animal-image {
                height: 240px;
            }

            .content {
                padding: 20px;
            }

            .title h1 {
                font-size: 32px;
            }

            .stats {
                gap: 15px;
                font-size: 14px;
            }

            .option {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


<header>

            </div>

            </div>


            <button

        </div>

    </div>


    <div

            <h2 id="resultTitle">

            <p id="resultObtained">

            <button

/* =========================================================
   VARIABILI DEL GIOCO
   ========================================================= */


let current = 0;

let score = 0;

let saved = 0;

let answered = false;


/* =========================================================
   APPLICA LA LINGUA
   ========================================================= */


function applyLanguage() {

    document.documentElement.lang =
        language;

    document.title =
        t.pageTitle;

    document.getElementById("gamesMenu").innerText =
        t.games;

    document.getElementById("gameTitle").innerText =
        t.title;

    document.getElementById("gameDescription").innerText =
        t.description;

    document.getElementById("savedLabel").innerText =
        t.saved;

    document.getElementById("scoreLabel").innerText =
        t.points;

    document.getElementById("missionLabel").innerText =
        t.mission;

    document.getElementById("next").innerText =
        t.next;

    document.getElementById("resultTitle").innerText =
        t.completed;

    document.getElementById("resultObtained").innerText =
        t.obtained;

    document.getElementById("restartButton").innerText =
        t.retry;

    document.getElementById("backButton").innerText =
        t.back;

}


/* =========================================================
   CARICA MISSIONE
   ========================================================= */


function loadMission() {

    answered = false;

    const mission =
        missions[current];


    document.getElementById("animalImage").src =
        mission.image;


    document.getElementById("animalImage").alt =
        mission.alt;


    document.getElementById("status").innerText =
        mission.status[language];


    document.getElementById("animalName").innerText =
        mission.name[language];


    document.getElementById("info").innerText =
        mission.info[language];


    document.getElementById("mission").innerText =
        mission.mission[language];


    document.getElementById("number").innerText =
        (current + 1) +
        "/" +
        missions.length;


    document.getElementById("progress").style.width =
        (
            ((current + 1) / missions.length) *
            100
        ) +
        "%";


    document.getElementById("feedback").style.display =
        "none";


    document.getElementById("next").style.display =
        "none";


    document.getElementById("next").innerText =
        current === missions.length - 1
            ? t.final
            : t.next;


    const options =
        document.getElementById("options");


    options.innerHTML =
        "";


    mission.options[language].forEach(
        function(option, index) {

            const button =
                document.createElement("button");


            button.className =
                "option";


            button.innerText =
                option;


            button.onclick =
                function() {

                    checkAnswer(
                        button,
                        index
                    );

                };


            options.appendChild(button);

        }
    );

}


/* =========================================================
   CONTROLLO RISPOSTA
   ========================================================= */


function checkAnswer(
    selected,
    index
) {

    if (answered) {
        return;
    }


    answered = true;


    const mission =
        missions[current];


    const all =
        document.querySelectorAll(".option");


    if (
        index === mission.correct
    ) {

        selected.classList.add(
            "correct"
        );


        score +=
            mission.points;


        saved++;


        document.getElementById("feedback").innerHTML =

            t.success +
            " +" +
            mission.points +
            " " +
            t.points.toLowerCase() +
            "<br><br>" +
            mission.explanation[language];

    }


    else {

        selected.classList.add(
            "wrong"
        );


        all[
            mission.correct
        ].classList.add(
            "correct"
        );


        score += 2;


        document.getElementById("feedback").innerHTML =

            t.wrong +
            "<br><br>" +

            t.correctAnswer +
            " <strong>" +

            mission.options[language][
                mission.correct
            ] +

            "</strong>" +

            "<br><br>" +

            mission.explanation[language];

    }


    document.getElementById("score").innerText =
        score;


    document.getElementById("saved").innerText =
        saved;


    document.getElementById("feedback").style.display =
        "block";


    document.getElementById("next").style.display =
        "block";

}


/* =========================================================
   PROSSIMA MISSIONE
   ========================================================= */


function nextMission() {

    current++;


    if (
        current <
        missions.length
    ) {

        loadMission();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

    else {

        showResult();

    }

}


/* =========================================================
   RISULTATO
   ========================================================= */


function showResult() {

    document.getElementById("gameCard")
        .classList.add("hidden");


    document.getElementById("resultCard")
        .classList.remove("hidden");


    document.getElementById("finalScore").innerText =
        score +
        " / 100";


    let message;


    if (score >= 90) {

        message =
            t.excellent;

    }

    else if (score >= 70) {

        message =
            t.veryGood;

    }

    else if (score >= 50) {

        message =
            t.good;

    }

    else {

        message =
            t.tryAgain;

    }


    document.getElementById("message").innerText =
        message;

}


/* =========================================================
   RICOMINCIA
   ========================================================= */


function restartGame() {

    current = 0;

    score = 0;

    saved = 0;

    answered = false;


    document.getElementById("score").innerText =
        "0";


    document.getElementById("saved").innerText =
        "0";


    document.getElementById("gameCard")
        .classList.remove("hidden");


    document.getElementById("resultCard")
        .classList.add("hidden");


    loadMission();

}


/* =========================================================
   TORNA ALLA PAGINA GIOCHI
   ========================================================= */


function goBack() {

    window.location.href =
        "giochi.html";

}


/* =========================================================

   ========================================================= */


applyLanguage();

loadMission();
