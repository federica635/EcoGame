<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>🐾 Species Rescue - EcoGame</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101914;
            color: #edf5ef;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        header {
            background: #17271d;
            border-bottom: 1px solid #3d5544;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            color: #a5d6a7;
            font-size: 24px;
            font-weight: bold;
        }


        .menu {
            color: #c0cec3;
            cursor: pointer;
            transition: color 0.2s ease;
        }


        .menu:hover {
            color: #a5d6a7;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .container {
            width: 94%;
            max-width: 1000px;
            margin: 30px auto;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .title {
            text-align: center;
        }


        .title h1 {
            color: #a5d6a7;
            font-size: 40px;
            margin: 0 0 8px;
        }


        .title p {
            color: #becbc1;
            line-height: 1.6;
            margin: 0;
        }


        /* =====================================================
           STATS
        ===================================================== */

        .stats {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;

            margin: 18px 0;

            color: #b9c8bc;

            flex-wrap: wrap;
        }


        .stats span {
            color: #a5d6a7;
            font-weight: bold;
        }


        /* =====================================================
           PROGRESS BAR
        ===================================================== */

        .progress {
            height: 8px;

            background: #26382c;

            border-radius: 10px;

            overflow: hidden;

            margin: 25px 0;
        }


        .progress-bar {
            width: 10%;
            height: 100%;

            background: #66bb6a;

            transition: width 0.4s ease;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .card {
            background: #17271d;

            border: 1px solid #405746;

            border-radius: 18px;

            overflow: hidden;
        }


        /* =====================================================
           ANIMAL IMAGE
        ===================================================== */

        .animal-image {
            width: 100%;
            height: 320px;

            object-fit: cover;

            display: block;

            background: #26382c;
        }


        /* =====================================================
           CONTENT
        ===================================================== */

        .content {
            padding: 28px;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            display: inline-block;

            padding: 7px 12px;

            border-radius: 20px;

            background: #354b3a;

            color: #c8e6c9;

            font-size: 13px;

            margin-bottom: 10px;
        }


        /* =====================================================
           ANIMAL NAME
        ===================================================== */

        h2 {
            color: #c8e6c9;

            font-size: 28px;

            margin: 8px 0;
        }


        /* =====================================================
           ANIMAL INFO
        ===================================================== */

        .info {
            color: #c1cec4;

            line-height: 1.7;

            margin-bottom: 20px;
        }


        /* =====================================================
           MISSION
        ===================================================== */

        .mission {
            background: #203328;

            border-left: 4px solid #66bb6a;

            padding: 16px;

            border-radius: 8px;

            line-height: 1.6;

            margin-bottom: 20px;
        }


        /* =====================================================
           OPTIONS
        ===================================================== */

        .options {
            display: grid;

            gap: 12px;
        }


        .option {
            padding: 16px;

            background: #203328;

            color: white;

            border: 2px solid #405746;

            border-radius: 11px;

            text-align: left;

            font-size: 16px;

            cursor: pointer;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.15s ease;
        }


        .option:hover:not(:disabled) {
            background: #294333;

            border-color: #81c784;

            transform: translateY(-2px);
        }


        .option:disabled {
            cursor: default;
        }


        .option.correct {
            background: #285236;

            border-color: #66bb6a;
        }


        .option.wrong {
            background: #542d2d;

            border-color: #ef7777;
        }


        /* =====================================================
           FEEDBACK
        ===================================================== */

        .feedback {
            display: none;

            margin-top: 20px;

            padding: 17px;

            background: #203328;

            border-radius: 10px;

            line-height: 1.6;
        }


        /* =====================================================
           NEXT BUTTON
        ===================================================== */

        .next {
            display: none;

            margin: 20px auto 0;

            padding: 13px 25px;

            border: none;

            border-radius: 10px;

            background: #43a047;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: background 0.2s ease;
        }


        .next:hover {
            background: #2e7d32;
        }


        /* =====================================================
           RESULT
        ===================================================== */

        .result {
            padding: 40px;

            text-align: center;
        }


        .result-icon {
            font-size: 75px;
        }


        .result h2 {
            color: #a5d6a7;

            font-size: 32px;
        }


        .final-score {
            font-size: 50px;

            color: #ffd54f;

            font-weight: bold;

            margin: 15px;
        }


        #message {
            color: #c8d8cb;

            line-height: 1.6;
        }


        /* =====================================================
           RESULT BUTTONS
        ===================================================== */

        .restart,
        .back {
            padding: 13px 22px;

            margin: 8px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;
        }


        .restart {
            background: #43a047;

            color: white;
        }


        .restart:hover {
            background: #2e7d32;
        }


        .back {
            background: #455a64;

            color: white;
        }


        .back:hover {
            background: #263238;
        }


        /* =====================================================
           HIDDEN
        ===================================================== */

        .hidden {
            display: none;
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            text-align: center;

            padding: 25px;

            color: #81a889;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 650px) {

            header {
                padding: 16px 18px;
            }


            .logo {
                font-size: 20px;
            }


            .title h1 {
                font-size: 32px;
            }


            .animal-image {
                height: 220px;
            }


            .content {
                padding: 20px;
            }


            .stats {
                gap: 12px;

                font-size: 14px;
            }


            .result {
                padding: 25px 18px;
            }


            .final-score {
                font-size: 42px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <header>

        <div class="logo">
            🌍 EcoGame
        </div>


        <div
            class="menu"
            id="menu"
            onclick="location.href='giochi.html'"
        >
            🎮 Giochi
        </div>

    </header>


    <!-- =====================================================
         MAIN CONTAINER
    ===================================================== -->

    <main class="container">


        <!-- =================================================
             TITLE
        ================================================= -->

        <section class="title">

            <h1 id="pageTitle">
                🐾 Species Rescue
            </h1>

            <p id="intro"></p>

        </section>


        <!-- =================================================
             STATS
        ================================================= -->

        <section class="stats">

            <div>

                🐾

                <span id="savedLabel">
                    Specie salvate
                </span>

                :

                <span id="saved">
                    0
                </span>

            </div>


            <div>

                ⭐

                <span id="scoreLabel">
                    Punti
                </span>

                :

                <span id="score">
                    0
                </span>

            </div>


            <div>

                🧩

                <span id="missionLabel">
                    Missione
                </span>

                :

                <span id="number">
                    1/10
                </span>

            </div>

        </section>


        <!-- =================================================
             PROGRESS
        ================================================= -->

        <div class="progress">

            <div
                class="progress-bar"
                id="progress"
            ></div>

        </div>


        <!-- =================================================
             GAME CARD
        ================================================= -->

        <section
            class="card"
            id="gameCard"
        >


            <!-- =============================================
                 IMAGE
            ============================================== -->

            <img
                class="animal-image"
                id="animalImage"
                src=""
                alt="Animale"
            >


            <!-- =============================================
                 GAME CONTENT
            ============================================== -->

            <div class="content">


                <!-- STATUS -->

                <div
                    class="status"
                    id="status"
                ></div>


                <!-- NAME -->

                <h2 id="animalName"></h2>


                <!-- INFORMATION -->

                <div
                    class="info"
                    id="info"
                ></div>


                <!-- MISSION -->

                <div
                    class="mission"
                    id="mission"
                ></div>


                <!-- ANSWER OPTIONS -->

                <div
                    class="options"
                    id="options"
                ></div>


                <!-- FEEDBACK -->

                <div
                    class="feedback"
                    id="feedback"
                ></div>


                <!-- NEXT BUTTON -->

                <button
                    class="next"
                    id="next"
                    type="button"
                ></button>

            </div>

        </section>


        <!-- =================================================
             FINAL RESULT CARD
        ================================================= -->

        <section
            class="card hidden"
            id="resultCard"
        >

            <div class="result">


                <div class="result-icon">
                    🐾
                </div>


                <h2 id="resultTitle">
                    Programma completato!
                </h2>


                <p id="resultDescription">
                    Hai completato tutte le 10 missioni.
                </p>


                <div
                    class="final-score"
                    id="finalScore"
                >
                    0 / 100
                </div>


                <p id="message"></p>


                <!-- RESTART -->

                <button
                    class="restart"
                    id="restartButton"
                    type="button"
                >
                    🔄 Riprova
                </button>


                <!-- BACK -->

                <button
                    class="back"
                    id="backButton"
                    type="button"
                >
                    🎮 Torna ai giochi
                </button>

            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ===================================================== -->

    <footer id="footer"></footer>


    <!-- =====================================================
         JAVASCRIPT
         
         Tutta la logica del gioco viene caricata da:
         animali.js

         Il file animali.js si occuperà di:
         - missioni
         - risposte
         - punteggio
         - lingue
         - risultato finale
         - Green Points
         - collegamento a Supabase
    ===================================================== -->

    <script
        type="module"
        src="animali.js"
    ></script>


</body>

</html>
