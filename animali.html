<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🐾 Species Rescue - EcoGame</title>

         SUPABASE
         Deve essere caricato PRIMA di ecogame.js
    ====================================================== -->

         SISTEMA COMUNE ECOGAME
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101914;
            color: #edf5ef;
        }

        header {
            background: #17271d;
            border-bottom: 1px solid #3d5544;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 15px;
        }

        .logo {
            color: #a5d6a7;
            font-size: 24px;
            font-weight: bold;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu,
        .language-button {
            color: #c0cec3;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 8px;
            transition: .2s;
            border: 1px solid transparent;
            background: transparent;
            font-size: 14px;
        }

        .menu:hover,
        .language-button:hover {
            background: #26382c;
            color: #a5d6a7;
        }

        .language-button {
            border: 1px solid #405746;
        }

        .language-button.active {
            background: #294333;
            color: #a5d6a7;
            border-color: #66bb6a;
        }

        .container {
            width: 94%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .title {
            text-align: center;
        }

        .title h1 {
            color: #a5d6a7;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .title p {
            color: #becbc1;
            line-height: 1.6;
        }

        .progress {
            height: 8px;
            background: #26382c;
            border-radius: 10px;
            overflow: hidden;
            margin: 25px 0;
        }

        .progress-bar {
            width: 10%;
            height: 100%;
            background: #66bb6a;
            transition: .4s;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 18px 0;
            color: #b9c8bc;
            flex-wrap: wrap;
        }

        .stats span {
            color: #a5d6a7;
            font-weight: bold;
        }

        .card {
            background: #17271d;
            border: 1px solid #405746;
            border-radius: 18px;
            overflow: hidden;
        }

        .animal-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            background: #26382c;
        }

        .content {
            padding: 28px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #354b3a;
            color: #c8e6c9;
            font-size: 13px;
            margin-bottom: 10px;
        }

        h2 {
            color: #c8e6c9;
            font-size: 28px;
            margin: 8px 0;
        }

        .info {
            color: #c1cec4;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .mission {
            background: #203328;
            border-left: 4px solid #66bb6a;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 16px;
            background: #203328;
            color: white;
            border: 2px solid #405746;
            border-radius: 11px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: .15s;
        }

        .option:hover:not(:disabled) {
            background: #294333;
            border-color: #81c784;
        }

        .option:disabled {
            cursor: default;
        }

        .option.correct {
            background: #285236;
            border-color: #66bb6a;
        }

        .option.wrong {
            background: #542d2d;
            border-color: #ef7777;
        }

        .feedback {
            display: none;
            margin-top: 20px;
            padding: 17px;
            background: #203328;
            border-radius: 10px;
            line-height: 1.6;
        }

        .next {
            display: none;
            margin: 20px auto 0;
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #43a047;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .next:hover {
            background: #4caf50;
        }

        .result {
            padding: 40px;
            text-align: center;
        }

        .result-icon {
            font-size: 75px;
        }

        .result h2 {
            color: #a5d6a7;
            font-size: 32px;
        }

        .final-score {
            font-size: 50px;
            color: #ffd54f;
            font-weight: bold;
            margin: 15px;
        }

        .green-points-result {
            margin: 20px auto;
            padding: 15px 20px;
            max-width: 420px;
            background: #203328;
            border: 1px solid #405746;
            border-radius: 12px;
            color: #c8e6c9;
        }

        .green-points-result strong {
            color: #ffd54f;
        }

        .restart,
        .back {
            padding: 13px 22px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .restart {
            background: #43a047;
            color: white;
        }

        .restart:hover {
            background: #4caf50;
        }

        .back {
            background: #455a64;
            color: white;
        }

        .back:hover {
            background: #546e7a;
        }

        .hidden {
            display: none;
        }

        .language-note {
            text-align: center;
            color: #819488;
            font-size: 13px;
            margin-top: 15px;
        }

        @media(max-width: 650px) {

            header {
                padding: 15px 18px;
            }

            .logo {
                font-size: 20px;
            }

            .header-right {
                gap: 4px;
            }

            .menu,
            .language-button {
                padding: 7px 8px;
                font-size: 12px;
            }

            .container {
                margin: 20px auto;
            }

            .title h1 {
                font-size: 32px;
            }

            .animal-image {
                height: 220px;
            }

            .content {
                padding: 20px;
            }

            .stats {
                gap: 12px;
                font-size: 14px;
            }

            .option {
                font-size: 15px;
            }

            .result {
                padding: 30px 20px;
            }

            .final-score {
                font-size: 42px;
            }
        }

    </style>

</head>

<header>

    <div class="logo">
        🌍 EcoGame

            🇬🇧 EN

            🇫🇮 FI

</header>


<div class="container">

    <div class="title">

        <h1 id="gameTitle">
            🐾 Species Rescue

        </p>

    </div>


    <div class="stats">

        <div>
            🐾 <span id="savedLabel">Specie salvate:</span>
            <span id="saved">0</span>
        </div>

        <div>
            ⭐ <span id="scoreLabel">Punti:</span>
            <span id="score">0</span>
        </div>

        <div>
            🧩 <span id="missionLabel">Missione:</span>
            <span id="number">1/10</span>
        </div>

    </div>


    <div class="progress">

        <div
            class="progress-bar"
            id="progress">
        </div>

    </div>


    <!-- =====================================================
         GIOCO
    ====================================================== -->

    <div
        class="card"
        id="gameCard">

        <img
            class="animal-image"
            id="animalImage"
            alt="Animale">

        <div class="content">

            <div
                class="status"
                id="status">
            </div>

            <h2 id="animalName"></h2>

            <div
                class="info"
                id="info">
            </div>

            <div
                class="mission"
                id="mission">
            </div>

            <div
                class="options"
                id="options">
            </div>

            <div
                class="feedback"
                id="feedback">
            </div>

            <button
                class="next"
                id="next"
                onclick="nextMission()">
            </button>

        </div>

    </div>


    <!-- =====================================================
         RISULTATO
    ====================================================== -->

    <div
        class="card hidden"
        id="resultCard">

        <div class="result">

            <div class="result-icon">
                🐾
            </div>

            <h2 id="resultTitle">
                Programma completato!
            </h2>

            <p id="resultObtained">
                Hai ottenuto:
            </p>

            <div
                class="final-score"
                id="finalScore">
            </div>

            <div
                class="green-points-result"
                id="greenPointsResult">
            </div>

            <p id="message"></p>

            <button
                class="restart"
                onclick="restartGame()"
                id="restartButton">
                🔄 Riprova
            </button>

            <button
                class="back"
                onclick="goToGames()"
                id="backButton">
                🎮 Torna ai giochi
            </button>

        </div>

    </div>


    <div
        class="language-note"
        id="languageNote">
    </div>

</div>

========================================================= */

let current = 0;

let score = 0;

let saved = 0;

let answered = false;

/* =========================================================
   APPLICA TRADUZIONI
========================================================= */

function applyTranslations() {

    const t = getTranslations();


    /*
        Aggiorna lingua HTML
    */

    document.documentElement.lang =
        language;


    /*
        Titolo
    */

    document.getElementById("gameTitle").innerText =
        t.title;


    document.getElementById("gameSubtitle").innerText =
        t.subtitle;


    /*
        Statistiche
    */

    document.getElementById("savedLabel").innerText =
        t.saved;


    document.getElementById("scoreLabel").innerText =
        t.points;


    document.getElementById("missionLabel").innerText =
        t.mission;


    /*
        Pulsanti
    */

    document.getElementById("restartButton").innerText =
        t.retry;


    document.getElementById("backButton").innerText =
        t.back;


    document.getElementById("gamesMenu").innerText =
        t.back;


    /*
        Nota lingua
    */

    document.getElementById("languageNote").innerText =
        t.languageNote;


    /*
        Aggiorna pulsante lingua attivo
    */

    document.querySelectorAll(".language-button")
        .forEach(function(button) {

            button.classList.remove("active");

        });


    if (language === "it") {

        document
            .getElementById("langIt")
            .classList.add("active");

    }

    else if (language === "en") {

        document
            .getElementById("langEn")
            .classList.add("active");

    }

    else if (language === "fi") {

        document
            .getElementById("langFi")
            .classList.add("active");

    }


    /*
        Se il risultato è già visibile,
        aggiorniamo anche quello.
    */

    if (
        !document
            .getElementById("resultCard")
            .classList.contains("hidden")
    ) {

        updateResultLanguage();

    }


    /*
        Se siamo dentro una missione,
        aggiorniamo immediatamente tutta la missione.
    */

    if (
        current >= 0 &&
        current < missions.length
    ) {

        updateCurrentMissionLanguage();

    }

}


/* =========================================================
   CAMBIO LINGUA
========================================================= */

function changeLanguage(newLanguage) {

    if (
        ![
            "it",
            "en",
            "fi"
        ].includes(newLanguage)
    ) {

        newLanguage = "it";

    }


    language =
        newLanguage;


    /*
        Usa il sistema comune EcoGame.

        Questo salva:

            ecoGameLingua

        e manda anche l'evento:

            ecoGameLinguaCambiata
    */

    if (
        typeof cambiaLinguaComune === "function"
    ) {

        cambiaLinguaComune(
            newLanguage
        );

    }

    else {

        localStorage.setItem(
            "ecoGameLingua",
            newLanguage
        );

        document.documentElement.lang =
            newLanguage;

    }


    /*
        Aggiorna immediatamente
        la schermata senza ricominciare il gioco.
    */

    applyTranslations();

}


/* =========================================================
   AGGIORNAMENTO MISSIONE SENZA RESET
========================================================= */

function updateCurrentMissionLanguage() {

    if (
        current < 0 ||
        current >= missions.length
    ) {

        return;

    }


    const mission =
        missions[current];


    const image =
        document.getElementById("animalImage");


    image.alt =
        getTranslations().imageAlt +
        " " +
        mission.name[language];


    document.getElementById("status").innerText =
        mission.status[language];


    document.getElementById("animalName").innerText =
        mission.name[language];


    document.getElementById("info").innerText =
        mission.info[language];


    document.getElementById("mission").innerText =
        mission.mission[language];


    /*
        Aggiorna numero missione
    */

    document.getElementById("number").innerText =
        (current + 1) +
        "/" +
        missions.length;


    /*
        Se la domanda non è ancora stata risposta,
        ricrea le opzioni nella nuova lingua.
    */

    if (!answered) {

        renderOptions();

    }

    else {

        /*
            Se è già stata data una risposta,
            manteniamo il feedback ma lo traduciamo.
        */

        renderAnsweredMission();

    }


    /*
        Pulsante successivo
    */

    document.getElementById("next").innerText =
        current === missions.length - 1
            ? getTranslations().final
            : getTranslations().next;

}


/* =========================================================
   CARICA MISSIONE
========================================================= */

function loadMission() {

    answered = false;


    const mission =
        missions[current];


    /*
        Immagine

        Manteniamo i percorsi originali,
        compresi:

            gorilla.jpg
            orso-polare.jpg
            tilacino.jpg
    */

    const image =
        document.getElementById("animalImage");


    image.src =
        mission.image;


    image.alt =
        getTranslations().imageAlt +
        " " +
        mission.name[language];


    /*
        Testi
    */

    document.getElementById("status").innerText =
        mission.status[language];


    document.getElementById("animalName").innerText =
        mission.name[language];


    document.getElementById("info").innerText =
        mission.info[language];


    document.getElementById("mission").innerText =
        mission.mission[language];


    /*
        Numero missione
    */

    document.getElementById("number").innerText =
        (current + 1) +
        "/" +
        missions.length;


    /*
        Progress bar
    */

    document.getElementById("progress").style.width =
        (
            ((current + 1) / missions.length) *
            100
        ) +
        "%";


    /*
        Nascondi feedback
    */

    document.getElementById("feedback").style.display =
        "none";


    /*
        Nascondi next
    */

    document.getElementById("next").style.display =
        "none";


    /*
        Testo next
    */

    document.getElementById("next").innerText =
        current === missions.length - 1
            ? getTranslations().final
            : getTranslations().next;


    /*
        Crea risposte
    */

    renderOptions();

}


/* =========================================================
   RENDER RISPOSTE
========================================================= */

function renderOptions() {

    const mission =
        missions[current];


    const options =
        document.getElementById("options");


    options.innerHTML = "";


    mission.options[language]
        .forEach(
            function(option, index) {

                const button =
                    document.createElement("button");


                button.type =
                    "button";


                button.className =
                    "option";


                button.innerText =
                    option;


                button.onclick =
                    function() {

                        checkAnswer(
                            button,
                            index
                        );

                    };


                options.appendChild(button);

            }
        );

}


/* =========================================================
   RENDER MISSIONE GIÀ RISPOSTA
========================================================= */

function renderAnsweredMission() {

    const mission =
        missions[current];


    const feedback =
        document.getElementById("feedback");


    /*
        Ricrea le opzioni nella nuova lingua
    */

    const options =
        document.getElementById("options");


    options.innerHTML = "";


    mission.options[language]
        .forEach(
            function(option, index) {

                const button =
                    document.createElement("button");


                button.type =
                    "button";


                button.className =
                    "option";


                button.innerText =
                    option;


                button.disabled =
                    true;


                /*
                    Non conosciamo direttamente
                    la risposta scelta dopo un cambio lingua,
                    quindi usiamo lo stato salvato.
                */

                if (
                    lastAnswerIndex === index
                ) {

                    if (
                        lastAnswerCorrect
                    ) {

                        button.classList.add(
                            "correct"
                        );

                    }

                    else {

                        button.classList.add(
                            "wrong"
                        );

                    }

                }


                if (
                    index === mission.correct
                ) {

                    button.classList.add(
                        "correct"
                    );

                }


                options.appendChild(button);

            }
        );


    /*
        Ricrea il feedback
    */

    if (lastAnswerCorrect) {

        feedback.innerHTML =
            getTranslations().success +
            " <strong>+" +
            mission.points +
            " " +
            getTranslations().points.toLowerCase() +
            "</strong><br><br>" +
            mission.explanation[language];

    }

    else {

        feedback.innerHTML =
            getTranslations().wrong +
            "<br><br>" +
            getTranslations().correctAnswer +
            " <strong>" +
            mission.options[language][mission.correct] +
            "</strong><br><br>" +
            mission.explanation[language];

    }


    feedback.style.display =
        "block";


    /*
        Next
    */

    document.getElementById("next").innerText =
        current === missions.length - 1
            ? getTranslations().final
            : getTranslations().next;


    document.getElementById("next").style.display =
        "block";

}

========================================================= */

let lastAnswerIndex = -1;

let lastAnswerCorrect = false;


/* =========================================================
   CONTROLLO RISPOSTA
========================================================= */

function checkAnswer(
    selected,
    index
) {

    if (answered) {

        return;

    }


    answered = true;


    lastAnswerIndex =
        index;


    const mission =
        missions[current];


    const all =
        document.querySelectorAll(".option");


    /*
        DISABILITA TUTTE LE RISPOSTE
    */

    all.forEach(
        function(button) {

            button.disabled =
                true;

        }
    );


    /*
        RISPOSTA CORRETTA
    */

    if (
        index === mission.correct
    ) {

        lastAnswerCorrect =
            true;


        selected.classList.add(
            "correct"
        );


        score +=
            mission.points;


        saved++;


        document.getElementById("feedback")
            .innerHTML =
                getTranslations().success +
                " <strong>+" +
                mission.points +
                " " +
                getTranslations().points.toLowerCase() +
                "</strong><br><br>" +
                mission.explanation[language];

    }


    /*
        RISPOSTA SBAGLIATA
    */

    else {

        lastAnswerCorrect =
            false;


        selected.classList.add(
            "wrong"
        );


        all[mission.correct]
            .classList.add(
                "correct"
            );


        /*
            Una risposta sbagliata dà 2 punti,
            come nel gioco originale.
        */

        score +=
            2;


        document.getElementById("feedback")
            .innerHTML =
                getTranslations().wrong +
                "<br><br>" +
                getTranslations().correctAnswer +
                " <strong>" +
                mission.options[language][mission.correct] +
                "</strong><br><br>" +
                mission.explanation[language];

    }


    /*
        Aggiorna statistiche
    */

    document.getElementById("score")
        .innerText =
        score;


    document.getElementById("saved")
        .innerText =
        saved;


    /*
        Mostra feedback
    */

    document.getElementById("feedback")
        .style.display =
        "block";


    /*
        Mostra prossimo
    */

    document.getElementById("next")
        .style.display =
        "block";


    document.getElementById("next")
        .innerText =
        current === missions.length - 1
            ? getTranslations().final
            : getTranslations().next;

}


/* =========================================================
   MISSIONE SUCCESSIVA
========================================================= */

function nextMission() {

    current++;


    if (
        current < missions.length
    ) {

        /*
            Reset stato risposta
        */

        lastAnswerIndex =
            -1;

        lastAnswerCorrect =
            false;


        loadMission();


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }

    else {

        showResult();

    }

}


/* =========================================================
   GREEN POINTS
========================================================= */

async function accreditaGreenPointsFinali() {

    /*
        Il gioco vale massimo 100 punti.

        Usiamo il punteggio ottenuto come
        Green Points da accreditare.

        Esempio:

            100/100 -> +100 GP
            80/100  -> +80 GP
            52/100  -> +52 GP
    */

    const puntiDaAccreditare =
        Math.max(
            0,
            Math.min(
                MAX_SCORE,
                Math.floor(score)
            )
        );


    /*
        Usiamo il sistema comune EcoGame.

        addGamePoints()
        -> assegnaGreenPointsGioco()
        -> accreditaGreenPointsUnaVolta()
    */

    try {

        if (
            typeof ecoGame !== "undefined" &&
            typeof ecoGame.addGamePoints === "function"
        ) {

            greenPointsResult =
                await ecoGame.addGamePoints(
                    GAME_ID,
                    puntiDaAccreditare
                );

        }

        else if (
            typeof accreditaGreenPointsUnaVolta === "function"
        ) {

            greenPointsResult =
                await accreditaGreenPointsUnaVolta(
                    GAME_ID,
                    puntiDaAccreditare
                );

        }

        else {

            greenPointsResult = {

                success: false,

                pointsAdded: 0,

                error:
                    "Sistema Green Points non disponibile."

            };

        }

    }

    catch (errore) {

        console.error(
            "EcoGame Species Rescue: errore Green Points:",
            errore
        );


        greenPointsResult = {

            success: false,

            pointsAdded: 0,

            error:
                errore

        };

    }


    renderGreenPointsResult();

}


/* =========================================================
   MOSTRA GREEN POINTS
========================================================= */

function renderGreenPointsResult() {

    const box =
        document.getElementById(
            "greenPointsResult"
        );


    const t =
        getTranslations();


    if (
        !greenPointsResult
    ) {

        box.innerText =
            t.greenPointsError;

        return;

    }


    /*
        Green Points accreditati
    */

    if (
        greenPointsResult.success
    ) {

        box.innerHTML =
            t.greenPointsEarned +
            " <strong>+" +
            greenPointsResult.pointsAdded +
            " GP</strong>";

        return;

    }


    /*
        Punti già accreditati
    */

    if (
        greenPointsResult.alreadyAdded
    ) {

        box.innerText =
            t.greenPointsAlready;

        return;

    }


    /*
        Errore
    */

    box.innerText =
        t.greenPointsError;

}


/* =========================================================
   RISULTATO FINALE
========================================================= */

async function showResult() {

    document.getElementById("gameCard")
        .classList.add("hidden");


    document.getElementById("resultCard")
        .classList.remove("hidden");


    /*
        Massimo 100.
    */

    document.getElementById("finalScore")
        .innerText =
        score + " / " + MAX_SCORE;


    updateResultLanguage();


    /*
        Accredita i Green Points.

        IMPORTANTE:
        la funzione comune impedisce il doppio accredito
        durante la stessa sessione.
    */

    await accreditaGreenPointsFinali();

}


/* =========================================================
   AGGIORNA RISULTATO NELLA LINGUA CORRENTE
========================================================= */

function updateResultLanguage() {

    const t =
        getTranslations();


    document.getElementById("resultTitle")
        .innerText =
        t.completed;


    document.getElementById("resultObtained")
        .innerText =
        t.obtained;


    document.getElementById("finalScore")
        .innerText =
        score + " / " + MAX_SCORE;


    let message;


    if (
        score >= 90
    ) {

        message =
            t.excellent;

    }

    else if (
        score >= 70
    ) {

        message =
            t.veryGood;

    }

    else if (
        score >= 50
    ) {

        message =
            t.good;

    }

    else {

        message =
            t.discover;

    }


    document.getElementById("message")
        .innerText =
        message;


    /*
        Se i Green Points sono già stati elaborati,
        aggiorna anche il loro testo nella nuova lingua.
    */

    if (
        greenPointsResult
    ) {

        renderGreenPointsResult();

    }

}


/* =========================================================
   RIAVVIA GIOCO
========================================================= */

function restartGame() {

    current =
        0;


    score =
        0;


    saved =
        0;


    answered =
        false;


    lastAnswerIndex =
        -1;


    lastAnswerCorrect =
        false;


    greenPointsResult =
        null;


    document.getElementById("score")
        .innerText =
        "0";


    document.getElementById("saved")
        .innerText =
        "0";


    document.getElementById("gameCard")
        .classList.remove("hidden");


    document.getElementById("resultCard")
        .classList.add("hidden");


    loadMission();


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


/* =========================================================
   TORNA A GIOCHI
========================================================= */

function goToGames() {

    location.href =
        "giochi.html";

}


/* =========================================================
   CAMBIO LINGUA DA UN ALTRO COMPONENTE ECOGAME
========================================================= */

/*
    Se giochi.html o un altro gioco cambia la lingua
    usando il sistema comune, questo gioco riceve l'evento.

    In questo modo la lingua resta sincronizzata.
*/

window.addEventListener(
    "ecoGameLinguaCambiata",
    function(event) {

        const nuovaLingua =
            event &&
            event.detail &&
            event.detail.lingua;


        if (
            ![
                "it",
                "en",
                "fi"
            ].includes(nuovaLingua)
        ) {

            return;

        }


        language =
            nuovaLingua;


        applyTranslations();

    }
);


/* =========================================================
   AVVIO
========================================================= */

function initSpeciesRescue() {

    /*
        Leggiamo nuovamente la lingua dal sistema comune.

        Questo è utile se ecogame.js è stato inizializzato
        prima dello script del gioco.
    */

    if (
        typeof getLingua === "function"
    ) {

        const linguaSalvata =
            getLingua();


        if (
            [
                "it",
                "en",
                "fi"
            ].includes(linguaSalvata)
        ) {

            language =
                linguaSalvata;

        }

    }


    /*
        Applica lingua
    */

    applyTranslations();


    /*
        Carica prima missione
    */

    loadMission();


    /*
        Carica i Green Points dell'account,
        se disponibili.
    */

    if (
        typeof caricaGreenPointsAccount === "function"
    ) {

        caricaGreenPointsAccount();

    }

}


/*
    Avvio quando il DOM è pronto.
*/

if (
    document.readyState === "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initSpeciesRescue
    );

}

else {

    initSpeciesRescue();

}

</script>
