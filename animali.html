<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🐾 Species Rescue - EcoGame</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101914;
            color: #edf5ef;
        }

        header {
            background: #17271d;
            border-bottom: 1px solid #3d5544;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #a5d6a7;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            color: #c0cec3;
            cursor: pointer;
        }

        .menu:hover {
            color: #a5d6a7;
        }

        .container {
            width: 94%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .title {
            text-align: center;
        }

        .title h1 {
            color: #a5d6a7;
            font-size: 40px;
            margin-bottom: 8px;
        }

        .title p {
            color: #becbc1;
            line-height: 1.6;
        }

        .progress {
            height: 8px;
            background: #26382c;
            border-radius: 10px;
            overflow: hidden;
            margin: 25px 0;
        }

        .progress-bar {
            width: 10%;
            height: 100%;
            background: #66bb6a;
            transition: width 0.4s ease;
        }

        .card {
            background: #17271d;
            border: 1px solid #405746;
            border-radius: 18px;
            overflow: hidden;
        }

        .animal-image {
            width: 100%;
            height: 320px;
            object-fit: cover;
            display: block;
            background: #26382c;
        }

        .content {
            padding: 28px;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            background: #354b3a;
            color: #c8e6c9;
            font-size: 13px;
            margin-bottom: 10px;
        }

        h2 {
            color: #c8e6c9;
            font-size: 28px;
            margin: 8px 0;
        }

        .info {
            color: #c1cec4;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .mission {
            background: #203328;
            border-left: 4px solid #66bb6a;
            padding: 16px;
            border-radius: 8px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            padding: 16px;
            background: #203328;
            color: white;
            border: 2px solid #405746;
            border-radius: 11px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
        }

        .option:hover:not(:disabled) {
            background: #294333;
            border-color: #81c784;
            transform: translateY(-2px);
        }

        .option:disabled {
            cursor: default;
        }

        .option.correct {
            background: #285236;
            border-color: #66bb6a;
        }

        .option.wrong {
            background: #542d2d;
            border-color: #ef7777;
        }

        .feedback {
            display: none;
            margin-top: 20px;
            padding: 17px;
            background: #203328;
            border-radius: 10px;
            line-height: 1.6;
        }

        .next {
            display: none;
            margin: 20px auto 0;
            padding: 13px 25px;
            border: none;
            border-radius: 10px;
            background: #43a047;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .next:hover {
            background: #2e7d32;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 18px 0;
            color: #b9c8bc;
            flex-wrap: wrap;
        }

        .stats span {
            color: #a5d6a7;
            font-weight: bold;
        }

        .result {
            padding: 40px;
            text-align: center;
        }

        .result-icon {
            font-size: 75px;
        }

        .result h2 {
            color: #a5d6a7;
            font-size: 32px;
        }

        .final-score {
            font-size: 50px;
            color: #ffd54f;
            font-weight: bold;
            margin: 15px;
        }

        #message {
            color: #c8d8cb;
            line-height: 1.6;
        }

        .restart,
        .back {
            padding: 13px 22px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .restart {
            background: #43a047;
            color: white;
        }

        .restart:hover {
            background: #2e7d32;
        }

        .back {
            background: #455a64;
            color: white;
        }

        .back:hover {
            background: #263238;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #81a889;
        }

        @media(max-width: 650px) {

            header {
                padding: 16px 18px;
            }

            .logo {
                font-size: 20px;
            }

            .title h1 {
                font-size: 32px;
            }

            .animal-image {
                height: 220px;
            }

            .content {
                padding: 20px;
            }

            .stats {
                gap: 12px;
                font-size: 14px;
            }

            .result {
                padding: 25px 18px;
            }

            .final-score {
                font-size: 42px;
            }

        }

    </style>

</head>

    <div

        <div class="content">

            <div

            </div>

            </div>

            <div

            </div>

            <div
                class="feedback"
                id="feedback">
            </div>

            <button
                class="next"
                id="next"
                onclick="nextMission()">
            </button>

        </div>

    </div>


    <!-- RISULTATO FINALE -->

    <div
        class="card hidden"
        id="resultCard">

        <div class="result">

            <div class="result-icon">
                🐾
            </div>

            <h2 id="resultTitle">
                Programma completato!
            </h2>

            <p id="resultDescription">
                Hai completato tutte le 10 missioni.
            </p>

            <div

                id="finalScore">
            </div>

            <p id="message"></p>


            <button
                class="restart"
                id="restartButton"
                onclick="restartGame()">
            </button>


            <button
                class="back"
                id="backButton"
                onclick="location.href='giochi.html'">

        </div>

    </div>

</div>

/* =====================================================
   STATO DEL GIOCO
   ===================================================== */

let current = 0;
let score = 0;
let saved = 0;
let answered = false;


/* =====================================================
   APPLICA TESTI GENERALI
   ===================================================== */

function applicaLingua() {

    const t =
        testiLingua();

    document.documentElement.lang =
        lingua;

    document.title =
        "🐾 Species Rescue - EcoGame";

    document.querySelector(".title h1").innerText =
        t.titolo;

    document.getElementById("intro").innerText =
        t.intro;

    document.getElementById("menu").innerText =
        t.menu;

    document.getElementById("savedLabel").innerText =
        t.specieSalvate;

    document.getElementById("scoreLabel").innerText =
        t.punti;

    document.getElementById("missionLabel").innerText =
        t.missione;

    document.getElementById("resultTitle").innerText =
        t.programmaCompletato;

    document.getElementById("resultDescription").innerText =
        t.descrizioneFinale;

    document.getElementById("restartButton").innerText =
        t.riprova;

    document.getElementById("backButton").innerText =
        t.torna;

    document.getElementById("footer").innerText =
        t.footer;

    document.getElementById("animalImage").alt =
        t.alt;

}


/* =====================================================
   RECUPERA LINGUA
   ===================================================== */

function testiLingua() {

    if (testi[lingua]) {
        return testi[lingua];
    }

    return testi.it;

}


/* =====================================================
   CARICA MISSIONE
   ===================================================== */

function loadMission() {

    answered = false;

    const mission =
        missions[current][lingua] || missions[current].it;

    const t =
        testiLingua();


    document.getElementById("animalImage").src =
        missions[current].image;


    document.getElementById("status").innerText =
        mission.status;


    document.getElementById("animalName").innerText =
        mission.name;


    document.getElementById("info").innerText =
        mission.info;


    document.getElementById("mission").innerText =
        mission.mission;


    document.getElementById("number").innerText =
        (current + 1) + "/10";


    document.getElementById("progress").style.width =
        ((current + 1) / missions.length * 100) + "%";


    document.getElementById("feedback").style.display =
        "none";


    document.getElementById("next").style.display =
        "none";


    document.getElementById("next").innerText =
        current === missions.length - 1
            ? t.risultato
            : t.prossima;


    const options =
        document.getElementById("options");

    options.innerHTML = "";


    mission.options.forEach(
        function(option, index) {

            const button =
                document.createElement("button");

            button.className =
                "option";

            button.innerText =
                option;

            button.onclick =
                function() {

                    checkAnswer(button, index);

                };

            options.appendChild(button);

        }
    );

}


/* =====================================================
   CONTROLLO RISPOSTA
   ===================================================== */

function checkAnswer(selected, index) {

    if (answered) {
        return;
    }

    answered = true;


    const mission =
        missions[current][lingua] || missions[current].it;


    const all =
        document.querySelectorAll(".option");


    all.forEach(function(button) {

        button.disabled = true;

    });


    const correctIndex =
        mission.correct !== undefined
            ? mission.correct
            : missions[current].it.correct;


    if (index === correctIndex) {

        selected.classList.add("correct");

        score += 10;

        saved++;


        document.getElementById("feedback").innerHTML =
            testiLingua().riuscita +
            mission.explanation;

    } else {

        selected.classList.add("wrong");

        all[correctIndex].classList.add("correct");


        document.getElementById("feedback").innerHTML =
            testiLingua().errata +
            testiLingua().rispostaCorretta +
            " <strong>" +
            mission.options[correctIndex] +
            "</strong><br><br>" +
            mission.explanation;

    }


    document.getElementById("score").innerText =
        score;

    document.getElementById("saved").innerText =
        saved;


    document.getElementById("feedback").style.display =
        "block";

    document.getElementById("next").style.display =
        "block";

}


/* =====================================================
   PROSSIMA MISSIONE
   ===================================================== */

function nextMission() {

    current++;


    if (current < missions.length) {

        loadMission();

    } else {

        showResult();

    }

}


/* =====================================================
   RISULTATO FINALE
   ===================================================== */

function showResult() {

    document.getElementById("gameCard")
        .classList.add("hidden");

    document.getElementById("resultCard")
        .classList.remove("hidden");


    document.getElementById("finalScore").innerText =
        score + " / 100";


    let message;


    if (score === 100) {

        message =
            testiLingua().messaggio100;

    } else if (score >= 70) {

        message =
            testiLingua().messaggio70;

    } else if (score >= 50) {

        message =
            testiLingua().messaggio50;

    } else {

        message =
            testiLingua().messaggio0;

    }


    document.getElementById("message").innerText =
        message;

}


/* =====================================================
   RIAVVIA
   ===================================================== */

function restartGame() {

    current = 0;
    score = 0;
    saved = 0;
    answered = false;


    document.getElementById("score").innerText =
        "0";

    document.getElementById("saved").innerText =
        "0";


    document.getElementById("gameCard")
        .classList.remove("hidden");

    document.getElementById("resultCard")
        .classList.add("hidden");


    loadMission();

}


/* =====================================================
   AVVIO
   ===================================================== */

applicaLingua();

loadMission();

</script>
