<!DOCTYPE html>

<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌊 Ocean Rescue - EcoGame</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071923;
    color: #edf7fa;
}

header {
    background: #0d2633;
    border-bottom: 1px solid #31515e;
    padding: 18px 30px;

    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    color: #81d4fa;
    font-size: 24px;
    font-weight: bold;
}

.destra {
    display: flex;
    align-items: center;
    gap: 12px;
}

.lingua {
    padding: 9px 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    cursor: pointer;
}

.menu {
    color: #b7cbd2;
    cursor: pointer;
}

.container {
    width: 94%;
    max-width: 1050px;
    margin: 30px auto;
}

.title {
    text-align: center;
}

.title h1 {
    color: #4fc3f7;
    font-size: 40px;
    margin-bottom: 8px;
}

.title p {
    color: #b7cbd2;
    line-height: 1.6;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 25px 0;
}

.stat {
    background: #102b38;
    border: 1px solid #31515e;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.stat-icon {
    font-size: 27px;
}

.stat-name {
    color: #a9c1c9;
    font-size: 13px;
    margin-top: 5px;
}

.stat-value {
    font-size: 24px;
    font-weight: bold;
    color: #81d4fa;
    margin-top: 5px;
}

.progress {
    height: 8px;
    background: #1b3540;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
}

.progress-bar {
    height: 100%;
    width: 20%;
    background: #29b6f6;
    transition: width 0.4s;
}

.card {
    background: #102833;
    border: 1px solid #36535e;
    border-radius: 18px;
    padding: 30px;
}

.turn {
    color: #4fc3f7;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.event {
    font-size: 27px;
    margin: 12px 0;
}

.description {
    color: #c2d1d6;
    line-height: 1.7;
    margin-bottom: 25px;
}

.options {
    display: grid;
    gap: 13px;
}

.option {
    background: #17333f;
    color: white;
    border: 2px solid #36535e;
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    transition: 0.15s;
}

.option:hover {
    border-color: #4fc3f7;
    background: #204351;
}

.option:disabled {
    cursor: default;
    opacity: 0.85;
}

.feedback {
    margin-top: 22px;
    background: #17333f;
    border-radius: 12px;
    padding: 18px;
    line-height: 1.6;
    display: none;
}

.next {
    display: block;
    margin: 20px auto 0;
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #0288d1;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.next:hover {
    background: #03a9f4;
}

.result {
    text-align: center;
    padding: 30px;
}

.result-icon {
    font-size: 75px;
}

.result h2 {
    color: #4fc3f7;
    font-size: 32px;
}

.final-score {
    font-size: 45px;
    color: #ffd54f;
    font-weight: bold;
    margin: 15px;
}

.restart,
.back {
    padding: 13px 22px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.restart {
    background: #0288d1;
    color: white;
}

.back {
    background: #37474f;
    color: white;
}

.hidden {
    display: none;
}

@media(max-width: 750px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .card {
        padding: 20px;
    }

    .title h1 {
        font-size: 32px;
    }

    .event {
        font-size: 23px;
    }

}

@media(max-width: 450px) {

    header {
        padding: 16px 18px;
    }

    .logo {
        font-size: 20px;
    }

    .menu {
        font-size: 14px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }

    .stat {
        padding: 12px 8px;
    }

    .destra {
        gap: 7px;
    }

    .lingua {
        font-size: 12px;
        padding: 8px;
    }

}

</style>

</head>

/* =====================================================
   VARIABILI DEL GIOCO
===================================================== */

let currentTurn = 0;
let chosen = false;

let stats = {

    biodiversity: 70,
    health: 70,
    water: 70,
    activity: 70

};


/* =====================================================
   LINGUA CORRENTE
===================================================== */

let linguaCorrente =
    localStorage.getItem("linguaEcoGame") || "it";


/* =====================================================
   CAMBIO LINGUA
===================================================== */

function cambiaLingua() {

    const selettore =
        document.getElementById("lingua");

    linguaCorrente =
        selettore.value;

    if (
        !Object.prototype.hasOwnProperty.call(
            traduzioni,
            linguaCorrente
        )
    ) {

        linguaCorrente = "it";

    }

    localStorage.setItem(
        "linguaEcoGame",
        linguaCorrente
    );

    document.documentElement.lang =
        linguaCorrente;

    applicaLingua();

}


/* =====================================================
   APPLICA LA LINGUA
===================================================== */

function applicaLingua() {

    const testi =
        traduzioni[linguaCorrente];

    document.getElementById("lingua").value =
        linguaCorrente;

    document.getElementById("menuText").innerText =
        testi.menu;

    document.getElementById("gameTitle").innerText =
        testi.gameTitle;

    document.getElementById("intro").innerText =
        testi.intro;

    document.getElementById("biodiversityName").innerText =
        testi.biodiversity;

    document.getElementById("healthName").innerText =
        testi.health;

    document.getElementById("waterName").innerText =
        testi.water;

    document.getElementById("activityName").innerText =
        testi.activity;

    document.getElementById("resultTitle").innerText =
        testi.resultTitle;

    document.getElementById("resultDescription").innerText =
        testi.resultDescription;

    document.getElementById("restartButton").innerText =
        testi.restart;

    document.getElementById("backButton").innerText =
        testi.back;

    loadTurn();

}


/* =====================================================
   AGGIORNA LE STATISTICHE
===================================================== */

function updateStats() {

    document.getElementById("biodiversity").innerText =
        stats.biodiversity;

    document.getElementById("health").innerText =
        stats.health;

    document.getElementById("water").innerText =
        stats.water;

    document.getElementById("activity").innerText =
        stats.activity;

}


/* =====================================================
   LIMITA I VALORI 0-100
===================================================== */

function limit(value) {

    return Math.max(
        0,
        Math.min(
            100,
            value
        )
    );

}


/* =====================================================
   CARICA TURNO
===================================================== */

function loadTurn() {

    chosen = false;

    const testi =
        traduzioni[linguaCorrente];

    const event =
        testi.events[currentTurn];


    document.getElementById("turn").innerText =
        testi.turn +
        " " +
        (currentTurn + 1) +
        " / " +
        testi.events.length;


    document.getElementById("event").innerText =
        event.title;


    document.getElementById("description").innerText =
        event.description;


    document.getElementById("progress").style.width =
        (
            ((currentTurn + 1) / testi.events.length) *
            100
        ) + "%";


    const options =
        document.getElementById("options");


    options.innerHTML = "";


    document.getElementById("feedback").style.display =
        "none";


    document.getElementById("next").style.display =
        "none";


    document.getElementById("next").innerText =
        currentTurn === testi.events.length - 1
            ? testi.resultButton
            : testi.continue;


    event.options.forEach(
        function(option) {

            const button =
                document.createElement("button");


            button.className =
                "option";


            button.innerText =
                option.text;


            button.onclick =
                function() {

                    chooseOption(
                        option,
                        button
                    );

                };


            options.appendChild(button);

        }
    );

}


/* =====================================================
   SCELTA DEL GIOCATORE
===================================================== */

function chooseOption(option, selectedButton) {

    if (chosen) {
        return;
    }

    chosen = true;


    stats.biodiversity =
        limit(
            stats.biodiversity +
            option.effects.biodiversity
        );


    stats.health =
        limit(
            stats.health +
            option.effects.health
        );


    stats.water =
        limit(
            stats.water +
            option.effects.water
        );


    stats.activity =
        limit(
            stats.activity +
            option.effects.activity
        );


    updateStats();


    const allButtons =
        document.querySelectorAll(".option");


    allButtons.forEach(
        function(button) {

            button.disabled = true;

        }
    );


    selectedButton.style.borderColor =
        "#4fc3f7";


    selectedButton.style.background =
        "#204b5c";


    const testi =
        traduzioni[linguaCorrente];


    document.getElementById("feedback").innerHTML =
        testi.consequence +
        "<br><br>" +
        option.explanation;


    document.getElementById("feedback").style.display =
        "block";


    document.getElementById("next").style.display =
        "block";

}


/* =====================================================
   TURNO SUCCESSIVO
===================================================== */

function nextTurn() {

    currentTurn++;


    if (
        currentTurn <
        traduzioni[linguaCorrente].events.length
    ) {

        loadTurn();

    }

    else {

        showResult();

    }

}


/* =====================================================
   RISULTATO FINALE
===================================================== */

function showResult() {

    document.getElementById("gameCard")
        .classList.add("hidden");


    document.getElementById("resultCard")
        .classList.remove("hidden");


    document.getElementById("progress")
        .style.width = "100%";


    const average =
        (
            stats.biodiversity +
            stats.health +
            stats.water
        ) / 3;


    document.getElementById("finalScore").innerText =
        Math.round(average) +
        " / 100";


    const testi =
        traduzioni[linguaCorrente];


    let message;


    if (average >= 85) {

        message =
            testi.messages.excellent;

    }

    else if (average >= 70) {

        message =
            testi.messages.good;

    }

    else if (average >= 50) {

        message =
            testi.messages.medium;

    }

    else {

        message =
            testi.messages.low;

    }


    document.getElementById("message").innerText =
        message;

}


/* =====================================================
   RICOMINCIA
===================================================== */

function restartGame() {

    currentTurn = 0;

    chosen = false;


    stats = {

        biodiversity: 70,

        health: 70,

        water: 70,

        activity: 70

    };


    updateStats();


    document.getElementById("resultCard")
        .classList.add("hidden");


    document.getElementById("gameCard")
        .classList.remove("hidden");


    loadTurn();

}


/* =====================================================
   AVVIO DEL GIOCO
===================================================== */

const selettoreLingua =
    document.getElementById("lingua");


if (
    Object.prototype.hasOwnProperty.call(
        traduzioni,
        linguaCorrente
    )
) {

    selettoreLingua.value =
        linguaCorrente;

}

else {

    linguaCorrente =
        "it";

    selettoreLingua.value =
        "it";

}


document.documentElement.lang =
    linguaCorrente;


updateStats();

applicaLingua();

</script>
