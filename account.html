/* =========================
   MESSAGGI TRADOTTI
========================= */

function messaggioTradotto(
    italiano,
    inglese,
    finlandese
) {

    const lingua =
        localStorage.getItem("ecoGameLingua") || "it";

    if (lingua === "en") {
        return inglese;
    }

    if (lingua === "fi") {
        return finlandese;
    }

    return italiano;
}


/* =========================
   REGISTRAZIONE
========================= */

async function registrati() {

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!username || !email || !password) {

        mostraMessaggio(
            messaggioTradotto(
                "⚠️ Compila tutti i campi.",
                "⚠️ Please fill in all fields.",
                "⚠️ Täytä kaikki kentät."
            )
        );

        return;
    }


    if (password.length < 6) {

        mostraMessaggio(
            messaggioTradotto(
                "⚠️ La password deve contenere almeno 6 caratteri.",
                "⚠️ Password must contain at least 6 characters.",
                "⚠️ Salasanassa täytyy olla vähintään 6 merkkiä."
            )
        );

        return;
    }


    mostraMessaggio(
        messaggioTradotto(
            "🌱 Creazione account...",
            "🌱 Creating account...",
            "🌱 Tiliä luodaan..."
        )
    );


    const bottone =
        document.getElementById("bottoneRegistrati");

    bottone.disabled = true;


    try {

        const { data, error } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    emailRedirectTo:
                        "https://federica635.github.io/EcoGame/account.html",

                    data: {
                        username: username
                    }

                }

            });


        if (error) {

            console.error(error);

            mostraMessaggio(
                "❌ " + error.message
            );

            bottone.disabled = false;

            return;
        }


        if (!data.session) {

            mostraMessaggio(
                messaggioTradotto(
                    "✅ Account creato! Controlla la tua email e clicca sul link di conferma.",
                    "✅ Account created! Check your email and click the confirmation link.",
                    "✅ Tili luotu! Tarkista sähköpostisi ja napsauta vahvistuslinkkiä."
                )
            );

        } else {

            mostraMessaggio(
                messaggioTradotto(
                    "✅ Account creato e accesso effettuato!",
                    "✅ Account created and logged in!",
                    "✅ Tili luotu ja kirjautuminen onnistui!"
                )
            );

            await mostraProfilo();
        }


    } catch (errore) {

        console.error(errore);

        mostraMessaggio(
            messaggioTradotto(
                "❌ Si è verificato un errore durante la registrazione.",
                "❌ An error occurred during registration.",
                "❌ Rekisteröinnissä tapahtui virhe."
            )
        );
    }


    bottone.disabled = false;
}


/* =========================
   LOGIN
========================= */

async function accedi() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!email || !password) {

        mostraMessaggio(
            messaggioTradotto(
                "⚠️ Inserisci email e password.",
                "⚠️ Enter your email and password.",
                "⚠️ Syötä sähköpostiosoitteesi ja salasanasi."
            )
        );

        return;
    }


    mostraMessaggio(
        messaggioTradotto(
            "🔐 Accesso...",
            "🔐 Logging in...",
            "🔐 Kirjaudutaan..."
        )
    );


    const bottone =
        document.getElementById("bottoneAccedi");

    bottone.disabled = true;


    try {

        const { error } =
            await supabaseClient.auth.signInWithPassword({

                email: email,
                password: password

            });


        if (error) {

            console.error(error);

            mostraMessaggio(
                "❌ " + error.message
            );

            bottone.disabled = false;

            return;
        }


        mostraMessaggio(
            messaggioTradotto(
                "✅ Accesso effettuato!",
                "✅ Login successful!",
                "✅ Kirjautuminen onnistui!"
            )
        );


        await mostraProfilo();


    } catch (errore) {

        console.error(errore);

        mostraMessaggio(
            messaggioTradotto(
                "❌ Errore durante l'accesso.",
                "❌ Login error.",
                "❌ Kirjautumisessa tapahtui virhe."
            )
        );
    }


    bottone.disabled = false;
}


/* =========================
   PROFILO
========================= */

async function mostraProfilo() {

    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();


    if (userError || !user) {
        return;
    }


    const {
        data: profilo,
        error
    } = await supabaseClient
        .from("profiles")
        .select("username, green_points, level")
        .eq("id", user.id)
        .single();


    if (error) {

        console.error(error);

        mostraMessaggio(
            messaggioTradotto(
                "❌ Impossibile caricare il profilo.",
                "❌ Unable to load profile.",
                "❌ Profiilia ei voitu ladata."
            )
        );

        return;
    }


    document.getElementById("registrazione")
        .style.display = "none";

    document.getElementById("login")
        .style.display = "none";

    document.getElementById("profilo")
        .style.display = "block";


    const nome =
        profilo.username || user.email;


    document.getElementById("benvenuto")
        .textContent =
        benvenutoTradotto(nome);


    document.getElementById("greenPoints")
        .textContent =
        profilo.green_points ?? 0;


    document.getElementById("livello")
        .textContent =
        profilo.level ?? 1;
}


/* =========================
   BENVENUTO
========================= */

function benvenutoTradotto(nome) {

    const lingua =
        localStorage.getItem("ecoGameLingua") || "it";


    if (lingua === "en") {
        return "Welcome, @" + nome + "!";
    }


    if (lingua === "fi") {
        return "Tervetuloa, @" + nome + "!";
    }


    return "Benvenuto, @" + nome + "!";
}


/* =========================
   LOGOUT
========================= */

async function logout() {

    const { error } =
        await supabaseClient.auth.signOut();


    if (error) {

        console.error(error);

        mostraMessaggio(
            messaggioTradotto(
                "❌ Errore durante il logout.",
                "❌ Logout error.",
                "❌ Uloskirjautumisessa tapahtui virhe."
            )
        );

        return;
    }


    document.getElementById("profilo")
        .style.display = "none";

    document.getElementById("registrazione")
        .style.display = "block";


    mostraMessaggio(
        messaggioTradotto(
            "🚪 Logout effettuato.",
            "🚪 Logged out.",
            "🚪 Uloskirjautuminen onnistui."
        )
    );
}


/* =========================
   MOSTRA LOGIN
========================= */

function mostraLogin() {

    document.getElementById("registrazione")
        .style.display = "none";

    document.getElementById("login")
        .style.display = "block";

    document.getElementById("profilo")
        .style.display = "none";

    document.getElementById("messaggio")
        .textContent = "";
}


/* =========================
   MOSTRA REGISTRAZIONE
========================= */

function mostraRegistrazione() {

    document.getElementById("login")
        .style.display = "none";

    document.getElementById("registrazione")
        .style.display = "block";

    document.getElementById("profilo")
        .style.display = "none";

    document.getElementById("messaggio")
        .textContent = "";
}


/* =========================
   MESSAGGIO
========================= */

function mostraMessaggio(testo) {

    document.getElementById("messaggio")
        .textContent = testo;
}


/* =========================
   CONTROLLO SESSIONE
========================= */

async function controllaSessione() {

    const {
        data: { session },
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(error);
        return;
    }


    if (session) {
        await mostraProfilo();
    }
}


/* =========================
   AVVIO
========================= */

window.onload = async function() {

    const lingua =
        localStorage.getItem("ecoGameLingua") || "it";

    cambiaLingua(lingua);

    await controllaSessione();
};
