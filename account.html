    function messaggioTradotto(
        italiano,
        inglese,
        finlandese
    ) {

            localStorage.getItem("ecoGameLingua") || "it";

        if (lingua === "en") {

    /* =========================

    async function registrati() {

        const username =
            document.getElementById("username")
                .value
                .trim();

        const email =
            document.getElementById("email")
                .value
                .trim()
                .toLowerCase();

        const password =
            document.getElementById("password")
                .value;


        if (!username || !email || !password) {

            mostraMessaggio(
                messaggioTradotto(
                    "⚠️ Compila tutti i campi.",
                    "⚠️ Please fill in all fields.",
                    "⚠️ Täytä kaikki kentät."
                ),
                false
            );

            return;
        }


        if (username.length < 3) {

            mostraMessaggio(
                messaggioTradotto(
                    "⚠️ Lo username deve contenere almeno 3 caratteri.",
                    "⚠️ Username must contain at least 3 characters.",
                    "⚠️ Käyttäjänimessä täytyy olla vähintään 3 merkkiä."
                ),
                false
            );

            return;
        }


        if (password.length < 6) {

            mostraMessaggio(
                messaggioTradotto(
                    "⚠️ La password deve contenere almeno 6 caratteri.",
                    "⚠️ Password must contain at least 6 characters.",
                    "⚠️ Salasanassa täytyy olla vähintään 6 merkkiä."
                ),
                false
            );

            return;
        }


        const bottone =
            document.getElementById("bottoneRegistrati");

        bottone.disabled = true;


        mostraMessaggio(
            messaggioTradotto(
                "🌱 Creazione account...",
                "🌱 Creating account...",
                "🌱 Tiliä luodaan..."
            ),
            true
        );


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password,

                    options: {

                        emailRedirectTo:
                            "https://federica635.github.io/EcoGame/account.html",

                        data: {
                            username: username
                        }
                    }
                });


            if (error) {

                console.error(
                    "Errore registrazione:",
                    error
                );

                mostraMessaggio(
                    messaggioErroreSupabase(error),
                    false
                );

                bottone.disabled = false;

                return;
            }


            /*
             * Se la conferma email è attiva,
             * Supabase normalmente non crea subito
             * una sessione.
             */

            if (!data.session) {

                mostraMessaggio(
                    messaggioTradotto(
                        "✅ Account creato! Controlla la tua email e clicca sul link di conferma.",
                        "✅ Account created! Check your email and click the confirmation link.",
                        "✅ Tili luotu! Tarkista sähköpostisi ja napsauta vahvistuslinkkiä."
                    ),
                    true
                );

            } else {

                /*
                 * Se la conferma email non è richiesta,
                 * l'utente viene autenticato subito.
                 */

                mostraMessaggio(
                    messaggioTradotto(
                        "✅ Account creato e accesso effettuato!",
                        "✅ Account created and logged in!",
                        "✅ Tili luotu ja kirjautuminen onnistui!"
                    ),
                    true
                );

                await creaProfiloSeNecessario(
                    data.user,
                    username
                );

                await mostraProfilo();
            }


        } catch (errore) {

            console.error(
                "Errore inatteso:",
                errore
            );

            mostraMessaggio(
                messaggioTradotto(
                    "❌ Si è verificato un errore durante la registrazione.",
                    "❌ An error occurred during registration.",
                    "❌ Rekisteröinnissä tapahtui virhe."
                ),
                false
            );
        }


        bottone.disabled = false;
    }


    /* =========================
       CREAZIONE PROFILO
    ========================== */

    async function creaProfiloSeNecessario(
        user,
        username
    ) {

        if (!user) {
            return;
        }


        const {
            data: profiloEsistente,
            error: erroreRicerca
        } =
            await supabaseClient
                .from("profiles")
                .select("id")
                .eq("id", user.id)
                .maybeSingle();


        if (erroreRicerca) {

            console.error(
                "Errore ricerca profilo:",
                erroreRicerca
            );

            return;
        }


        if (profiloEsistente) {
            return;
        }


        const {
            error: erroreCreazione
        } =
            await supabaseClient
                .from("profiles")
                .insert({

                    id: user.id,

                    username:
                        username ||
                        user.user_metadata?.username ||
                        "EcoPlayer",

                    green_points: 0,

                    level: 1
                });


        if (erroreCreazione) {

            console.error(
                "Errore creazione profilo:",
                erroreCreazione
            );
        }
    }


    /* =========================
       LOGIN
    ========================== */

    async function accedi() {

        const email =
            document.getElementById("loginEmail")
                .value
                .trim()
                .toLowerCase();

        const password =
            document.getElementById("loginPassword")
                .value;


        if (!email || !password) {

            mostraMessaggio(
                messaggioTradotto(
                    "⚠️ Inserisci email e password.",
                    "⚠️ Enter your email and password.",
                    "⚠️ Syötä sähköpostiosoitteesi ja salasanasi."
                ),
                false
            );

            return;
        }


        const bottone =
            document.getElementById("bottoneAccedi");

        bottone.disabled = true;


        mostraMessaggio(
            messaggioTradotto(
                "🔐 Accesso...",
                "🔐 Logging in...",
                "🔐 Kirjaudutaan..."
            ),
            true
        );


        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password
                });


            if (error) {

                console.error(
                    "Errore login:",
                    error
                );

                mostraMessaggio(
                    messaggioErroreSupabase(error),
                    false
                );

                bottone.disabled = false;

                return;
            }


            mostraMessaggio(
                messaggioTradotto(
                    "✅ Accesso effettuato!",
                    "✅ Login successful!",
                    "✅ Kirjautuminen onnistui!"
                ),
                true
            );


            /*
             * Se per qualche motivo il profilo non esiste,
             * proviamo a crearlo usando lo username salvato
             * nei metadata dell'utente.
             */

            if (data.user) {

                const username =
                    data.user.user_metadata?.username ||
                    data.user.email?.split("@")[0] ||
                    "EcoPlayer";

                await creaProfiloSeNecessario(
                    data.user,
                    username
                );
            }


            await mostraProfilo();


        } catch (errore) {

            console.error(
                "Errore inatteso:",
                errore
            );

            mostraMessaggio(
                messaggioTradotto(
                    "❌ Errore durante l'accesso.",
                    "❌ Login error.",
                    "❌ Kirjautumisessa tapahtui virhe."
                ),
                false
            );
        }


        bottone.disabled = false;
    }


    /* =========================
       PROFILO
    ========================== */

    async function mostraProfilo() {

        const {
            data: {
                user
            },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            console.error(
                "Utente non trovato:",
                userError
            );

            return;
        }


        /*
         * Recuperiamo il profilo.
         */

        let {
            data: profilo,
            error
        } =
            await supabaseClient
                .from("profiles")
                .select(
                    "username, green_points, level"
                )
                .eq("id", user.id)
                .maybeSingle();


        /*
         * Se il profilo non esiste,
         * lo creiamo automaticamente.
         */

        if (!profilo && !error) {

            const username =
                user.user_metadata?.username ||
                user.email?.split("@")[0] ||
                "EcoPlayer";


            await creaProfiloSeNecessario(
                user,
                username
            );


            const risultato =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "username, green_points, level"
                    )
                    .eq("id", user.id)
                    .maybeSingle();


            profilo =
                risultato.data;

            error =
                risultato.error;
        }


        if (error) {

            console.error(
                "Errore caricamento profilo:",
                error
            );

            mostraMessaggio(
                messaggioTradotto(
                    "❌ Impossibile caricare il profilo. Controlla la tabella profiles su Supabase.",
                    "❌ Unable to load the profile. Check the profiles table in Supabase.",
                    "❌ Profiilia ei voitu ladata. Tarkista Supabasen profiles-taulu."
                ),
                false
            );

            return;
        }


        document.getElementById("registrazione")
            .style.display = "none";

        document.getElementById("login")
            .style.display = "none";

        document.getElementById("profilo")
            .style.display = "block";


        const nome =
            profilo?.username ||
            user.user_metadata?.username ||
            user.email ||
            "EcoPlayer";


        document.getElementById("benvenuto")
            .textContent =
            benvenutoTradotto(nome);


        document.getElementById("greenPoints")
            .textContent =
            profilo?.green_points ?? 0;


        document.getElementById("livello")
            .textContent =
            profilo?.level ?? 1;
    }


    /* =========================
       BENVENUTO
    ========================== */

    function benvenutoTradotto(nome) {

        const lingua =
            localStorage.getItem("ecoGameLingua") || "it";


        if (lingua === "en") {
            return "Welcome, @" + nome + "!";
        }


        if (lingua === "fi") {
            return "Tervetuloa, @" + nome + "!";
        }


        return "Benvenuto, @" + nome + "!";
    }


    /* =========================
       LOGOUT
    ========================== */

    async function logout() {

        try {

            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                console.error(
                    "Errore logout:",
                    error
                );

                mostraMessaggio(
                    messaggioTradotto(
                        "❌ Errore durante il logout.",
                        "❌ Logout error.",
                        "❌ Uloskirjautumisessa tapahtui virhe."
                    ),
                    false
                );

                return;
            }


            document.getElementById("profilo")
                .style.display = "none";

            document.getElementById("login")
                .style.display = "none";

            document.getElementById("registrazione")
                .style.display = "block";


            document.getElementById("loginEmail")
                .value = "";

            document.getElementById("loginPassword")
                .value = "";


            mostraMessaggio(
                messaggioTradotto(
                    "🚪 Logout effettuato.",
                    "🚪 Logged out.",
                    "🚪 Uloskirjautuminen onnistui."
                ),
                true
            );


        } catch (errore) {

            console.error(
                "Errore logout:",
                errore
            );
        }
    }


    /* =========================
       MOSTRA LOGIN
    ========================== */

    function mostraLogin() {

        document.getElementById("registrazione")
            .style.display = "none";

        document.getElementById("login")
            .style.display = "block";

        document.getElementById("profilo")
            .style.display = "none";

        document.getElementById("messaggio")
            .textContent = "";

        document.getElementById("loginEmail")
            .focus();
    }


    /* =========================
       MOSTRA REGISTRAZIONE
    ========================== */

    function mostraRegistrazione() {

        document.getElementById("login")
            .style.display = "none";

        document.getElementById("registrazione")
            .style.display = "block";

        document.getElementById("profilo")
            .style.display = "none";

        document.getElementById("messaggio")
            .textContent = "";

        document.getElementById("username")
            .focus();
    }


    /* =========================
       MESSAGGIO
    ========================== */

    function mostraMessaggio(
        testo,
        successo = false
    ) {

        const elemento =
            document.getElementById("messaggio");


        elemento.textContent = testo;


        elemento.className =
            successo
                ? "successo"
                : "errore";
    }


    /* =========================
       ERRORI SUPABASE
    ========================== */

    function messaggioErroreSupabase(
        error
    ) {

        const messaggio =
            (error?.message || "")
                .toLowerCase();


        if (
            messaggio.includes(
                "user already registered"
            )
        ) {

            return messaggioTradotto(
                "❌ Questa email è già registrata. Prova ad accedere.",
                "❌ This email is already registered. Try logging in.",
                "❌ Tämä sähköpostiosoite on jo rekisteröity. Yritä kirjautua."
            );
        }


        if (
            messaggio.includes(
                "invalid login credentials"
            )
        ) {

            return messaggioTradotto(
                "❌ Email o password non corretti.",
                "❌ Incorrect email or password.",
                "❌ Virheellinen sähköposti tai salasana."
            );
        }


        if (
            messaggio.includes(
                "email not confirmed"
            )
        ) {

            return messaggioTradotto(
                "❌ Devi prima confermare la tua email.",
                "❌ You must confirm your email first.",
                "❌ Sinun täytyy vahvistaa sähköpostiosoitteesi ensin."
            );
        }


        if (
            messaggio.includes(
                "password should be at least"
            )
        ) {

            return messaggioTradotto(
                "❌ La password è troppo corta.",
                "❌ The password is too short.",
                "❌ Salasana on liian lyhyt."
            );
        }


        return "❌ " + (
            error?.message ||
            "Errore sconosciuto."
        );
    }


    /* =========================
       CONTROLLO SESSIONE
    ========================== */

    async function controllaSessione() {

        try {

            const {
                data: {
                    session
                },
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {

                console.error(
                    "Errore sessione:",
                    error
                );

                return;
            }


            if (session) {

                await mostraProfilo();

            } else {

                document.getElementById("registrazione")
                    .style.display = "block";

                document.getElementById("login")
                    .style.display = "none";

                document.getElementById("profilo")
                    .style.display = "none";
            }


        } catch (errore) {

            console.error(
                "Errore controllo sessione:",
                errore
            );
        }
    }


    /* =========================
       CAMBIO SESSIONE SUPABASE
    ========================== */

    supabaseClient.auth.onAuthStateChange(
        async function(event, session) {

            console.log(
                "Auth event:",
                event
            );


            if (
                event === "SIGNED_IN" &&
                session
            ) {

                /*
                 * Evitiamo di eseguire troppo codice
                 * durante il caricamento iniziale.
                 */

                setTimeout(
                    async function() {
                        await mostraProfilo();
                    },
                    0
                );
            }


            if (
                event === "SIGNED_OUT"
            ) {

                document.getElementById("profilo")
                    .style.display = "none";

                document.getElementById("login")
                    .style.display = "none";

                document.getElementById("registrazione")
                    .style.display = "block";
            }
        }
    );


    /* =========================
       AVVIO
    ========================== */

    window.addEventListener(
        "load",
        async function() {

            const lingua =
                localStorage.getItem(
                    "ecoGameLingua"
                ) || "it";


            cambiaLingua(lingua);


            await controllaSessione();
        }
    );

</script>
