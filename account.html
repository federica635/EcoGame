"; document.getElementById("bottoneAccedi").textContent = "🔐 Kirjaudu"; document.getElementById("nonAccount").textContent = "Eikö sinulla ole vielä tiliä?"; document.getElementById("vaiRegistrazione").textContent = "Rekisteröidy"; document.getElementById("titoloProfilo").textContent = "👤 Oma profiili"; document.getElementById("testoGreenPoints").textContent = "Green Points"; document.getElementById("testoLivello").textContent = "Taso"; document.getElementById("bottoneLogout").textContent = "🚪 Kirjaudu ulos"; document.getElementById("home").textContent = "🏠 Takaisin EcoGameen"; document.getElementById("footer").textContent = "🌱 EcoGame — Opi ekologiasta pelaamalla"; } } /* REGISTRAZIONE */ async function registrati() { const username = document.getElementById("username").value.trim(); const email = document.getElementById("email").value.trim(); const password = document.getElementById("password").value; if (!username || !email || !password) { mostraMessaggio( "⚠️ Compila tutti i campi." ); return; } if (password.length < 6) { mostraMessaggio( "⚠️ La password deve contenere almeno 6 caratteri." ); return; } mostraMessaggio( "🌱 Creazione account..." ); const { data, error } = await supabaseClient.auth.signUp({ email: email, password: password, options: { emailRedirectTo: "https://federica635.github.io/EcoGame/account.html", data: { username: username } } }); if (error) { mostraMessaggio( "❌ " + error.message ); return; } if (data.user) { mostraMessaggio( "✅ Account creato! Controlla la tua email per confermare l'account." ); } } /* LOGIN */ async function accedi() { const email = document.getElementById("loginEmail").value.trim(); const password = document.getElementById("loginPassword").value; if (!email || !password) { mostraMessaggio( "⚠️ Inserisci email e password." ); return; } mostraMessaggio( "🔐 Accesso..." ); const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password }); if (error) { mostraMessaggio( "❌ " + error.message ); return; } mostraMessaggio( "✅ Accesso effettuato!" ); await mostraProfilo(); } /* MOSTRA PROFILO */ async function mostraProfilo() { const { data: { user } } = await supabaseClient.auth.getUser(); if (!user) { return; } const { data: profilo, error } = await supabaseClient .from("profiles") .select("username, green_points, level") .eq("id", user.id) .single(); if (error) { console.error(error); mostraMessaggio( "❌ Impossibile caricare il profilo." ); return; } document.getElementById("registrazione").style.display = "none"; document.getElementById("login").style.display = "none"; document.getElementById("profilo").style.display = "block"; document.getElementById("benvenuto").textContent = "Benvenuto, @" + profilo.username + "!"; document.getElementById("greenPoints").textContent = profilo.green_points; document.getElementById("livello").textContent = profilo.level; } /* LOGOUT */ async function logout() { await supabaseClient.auth.signOut(); document.getElementById("profilo").style.display = "none"; document.getElementById("registrazione").style.display = "block"; mostraMessaggio( "🚪 Logout effettuato." ); } /* CAMBIO FORM */ function mostraLogin() { document.getElementById("registrazione").style.display = "none"; document.getElementById("login").style.display = "block"; document.getElementById("messaggio").textContent = ""; } function mostraRegistrazione() { document.getElementById("login").style.display = "none"; document.getElementById("registrazione").style.display = "block"; document.getElementById("messaggio").textContent = ""; } /* MESSAGGI */ function mostraMessaggio(testo) { document.getElementById("messaggio").textContent = testo; } /* CONTROLLO SESSIONE */ async function controllaSessione() { const { data: { session } } = await supabaseClient.auth.getSession(); if (session) { await mostraProfilo(); } } /* AVVIO */ window.onload = async function() { const lingua = localStorage.getItem("ecoGameLingua") || "it"; cambiaLingua(lingua); await controllaS
