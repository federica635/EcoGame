<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EcoGame - Account 🌱</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dcedc8, #e8f5e9);
    color: #173b22;
    min-height: 100vh;
}

header {
    background: #2e7d32;
    color: white;
    text-align: center;
    padding: 25px 20px;
}

header h1 {
    margin: 0;
    font-size: 42px;
}

.lingue {
    margin-bottom: 20px;
}

.lingue button {
    background: white;
    color: #173b22;
    border: 2px solid #43a047;
    margin: 4px;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
}

.contenitore {
    width: 90%;
    max-width: 500px;
    margin: 40px auto;
}

.account-box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

.account-box h2 {
    text-align: center;
    color: #2e7d32;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin: 8px 0 15px;
    border: 1px solid #bdbdbd;
    border-radius: 10px;
    font-size: 16px;
}

button.azione {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: none;
    border-radius: 12px;
    background: #43a047;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button.azione:hover {
    background: #1b5e20;
}

.secondario {
    background: #e8f5e9 !important;
    color: #1b5e20 !important;
}

.switch {
    text-align: center;
    margin-top: 20px;
}

.switch button {
    border: none;
    background: none;
    color: #2e7d32;
    font-weight: bold;
    cursor: pointer;
}

.messaggio {
    text-align: center;
    margin-top: 15px;
    font-weight: bold;
}

.profilo {
    display: none;
    text-align: center;
}

.punteggio {
    font-size: 25px;
    color: #2e7d32;
    margin: 20px 0;
}

.home {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #1b5e20;
    text-decoration: none;
    font-weight: bold;
}

footer {
    margin-top: 50px;
    background: #1b5e20;
    color: white;
    text-align: center;
    padding: 20px;
}

</style>

</head>

<body>

<header>

<div class="lingue">

<button onclick="cambiaLingua('it')">🇮🇹 Italiano</button>
<button onclick="cambiaLingua('en')">🇬🇧 English</button>
<button onclick="cambiaLingua('fi')">🇫🇮 Suomi</button>

</div>

<h1>🌍 EcoGame</h1>

</header>


<div class="contenitore">

<div class="account-box" id="accountBox">

<h2 id="titolo">👤 Crea il tuo account</h2>


<div id="registrazione">

<label id="labelUsername">
Username
</label>

<input
    type="text"
    id="username"
    placeholder="Il tuo username"
>


<label id="labelEmail">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="La tua email"
>


<label id="labelPassword">
Password
</label>

<input
    type="password"
    id="password"
    placeholder="La tua password"
>


<button
    class="azione"
    onclick="registrati()"
    id="bottoneRegistrati"
>
    🌱 Crea account
</button>


<div class="switch">

<span id="testoGiaAccount">
Hai già un account?
</span>

<button
    onclick="mostraLogin()"
    id="bottoneLogin"
>
    Accedi
</button>

</div>

</div>


<div id="login" style="display:none;">

<h2 id="titoloLogin">
🔐 Accedi
</h2>

<label id="labelLoginEmail">
Email
</label>

<input
    type="email"
    id="loginEmail"
    placeholder="La tua email"
>

<label id="labelLoginPassword">
Password
</label>

<input
    type="password"
    id="loginPassword"
    placeholder="La tua password"
>

<button
    class="azione"
    onclick="accedi()"
    id="bottoneAccedi"
>
    🔐 Accedi
</button>

<div class="switch">

<span id="testoNoAccount">
Non hai ancora un account?
</span>

<button
    onclick="mostraRegistrazione()"
    id="bottoneRegistratiLogin"
>
    Registrati
</button>

</div>

</div>


<div
    class="profilo"
    id="profilo"
>

<h2 id="titoloProfilo">
👤 Il mio profilo
</h2>

<p id="testoBenvenuto">
Benvenuto!
</p>

<div class="punteggio">

🌱 <span id="greenPoints">0</span>

<br>

🏆 <span id="level">1</span>

</div>

<button
    class="azione"
    onclick="logout()"
    id="bottoneLogout"
>
    🚪 Esci
</button>

</div>


<div
    class="messaggio"
    id="messaggio"
></div>


<a
    href="index.html"
    class="home"
    id="tornaHome"
>
    🏠 Torna a EcoGame
</a>

</div>

</div>


<footer>

🌱 EcoGame — Imparare l'ecologia giocando

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
    "https://zrxssuigzisgpcdesjvc.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_PXJEogyOyTRmaVIlW8ey_g_WhJHnNKw";


const { createClient } =
    supabase;

const client =
    createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   LINGUA
   ===================================================== */

function cambiaLingua(lingua) {

    localStorage.setItem(
        "ecoGameLingua",
        lingua
    );


    if (lingua === "it") {

        document.documentElement.lang = "it";

        document.getElementById("titolo").textContent =
            "👤 Crea il tuo account";

        document.getElementById("labelUsername").textContent =
            "Username";

        document.getElementById("labelEmail").textContent =
            "Email";

        document.getElementById("labelPassword").textContent =
            "Password";

        document.getElementById("bottoneRegistrati").textContent =
            "🌱 Crea account";

        document.getElementById("testoGiaAccount").textContent =
            "Hai già un account?";

        document.getElementById("bottoneLogin").textContent =
            "Accedi";

        document.getElementById("titoloLogin").textContent =
            "🔐 Accedi";

        document.getElementById("bottoneAccedi").textContent =
            "🔐 Accedi";

        document.getElementById("testoNoAccount").textContent =
            "Non hai ancora un account?";

        document.getElementById("bottoneRegistratiLogin").textContent =
            "Registrati";

        document.getElementById("titoloProfilo").textContent =
            "👤 Il mio profilo";

        document.getElementById("bottoneLogout").textContent =
            "🚪 Esci";

        document.getElementById("tornaHome").textContent =
            "🏠 Torna a EcoGame";
    }


    if (lingua === "en") {

        document.documentElement.lang = "en";

        document.getElementById("titolo").textContent =
            "👤 Create your account";

        document.getElementById("labelUsername").textContent =
            "Username";

        document.getElementById("labelEmail").textContent =
            "Email";

        document.getElementById("labelPassword").textContent =
            "Password";

        document.getElementById("bottoneRegistrati").textContent =
            "🌱 Create account";

        document.getElementById("testoGiaAccount").textContent =
            "Already have an account?";

        document.getElementById("bottoneLogin").textContent =
            "Login";

        document.getElementById("titoloLogin").textContent =
            "🔐 Login";

        document.getElementById("bottoneAccedi").textContent =
            "🔐 Login";

        document.getElementById("testoNoAccount").textContent =
            "Don't have an account yet?";

        document.getElementById("bottoneRegistratiLogin").textContent =
            "Sign up";

        document.getElementById("titoloProfilo").textContent =
            "👤 My profile";

        document.getElementById("bottoneLogout").textContent =
            "🚪 Logout";

        document.getElementById("tornaHome").textContent =
            "🏠 Back to EcoGame";
    }


    if (lingua === "fi") {

        document.documentElement.lang = "fi";

        document.getElementById("titolo").textContent =
            "👤 Luo käyttäjätili";

        document.getElementById("labelUsername").textContent =
            "Käyttäjänimi";

        document.getElementById("labelEmail").textContent =
            "Sähköposti";

        document.getElementById("labelPassword").textContent =
            "Salasana";

        document.getElementById("bottoneRegistrati").textContent =
            "🌱 Luo tili";

        document.getElementById("testoGiaAccount").textContent =
            "Onko sinulla jo tili?";

        document.getElementById("bottoneLogin").textContent =
            "Kirjaudu";

        document.getElementById("titoloLogin").textContent =
            "🔐 Kirjaudu";

        document.getElementById("bottoneAccedi").textContent =
            "🔐 Kirjaudu";

        document.getElementById("testoNoAccount").textContent =
            "Eikö sinulla ole vielä tiliä?";

        document.getElementById("bottoneRegistratiLogin").textContent =
            "Rekisteröidy";

        document.getElementById("titoloProfilo").textContent =
            "👤 Oma profiili";

        document.getElementById("bottoneLogout").textContent =
            "🚪 Kirjaudu ulos";

        document.getElementById("tornaHome").textContent =
            "🏠 Takaisin EcoGameen";
    }

}


/* =====================================================
   REGISTRAZIONE
   ===================================================== */

async function registrati() {

    const username =
        document.getElementById("username").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!username || !email || !password) {

        mostraMessaggio(
            "Compila tutti i campi."
        );

        return;
    }


    if (password.length < 6) {

        mostraMessaggio(
            "La password deve contenere almeno 6 caratteri."
        );

        return;
    }


    mostraMessaggio(
        "Creazione account..."
    );


    const { data, error } =
        await client.auth.signUp({

            email: email,

            password: password,

            options: {

                data: {

                    username: username

                }

            }

        });


    if (error) {

        mostraMessaggio(
            error.message
        );

        return;
    }


    if (data.user) {

        mostraMessaggio(
            "Account creato! Controlla la tua email se viene richiesta la conferma."
        );

    }

}


/* =====================================================
   LOGIN
   ===================================================== */

async function accedi() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!email || !password) {

        mostraMessaggio(
            "Inserisci email e password."
        );

        return;
    }


    const { data, error } =
        await client.auth.signInWithPassword({

            email: email,

            password: password

        });


    if (error) {

        mostraMessaggio(
            error.message
        );

        return;
    }


    mostraMessaggio(
        "Accesso effettuato!"
    );


    mostraProfilo();

}


/* =====================================================
   PROFILO
   ===================================================== */

async function mostraProfilo() {

    const {
        data: {
            user
        }
    } = await client.auth.getUser();


    if (!user) {

        return;
    }


    const {
        data: profile,
        error
    } = await client
        .from("profiles")
        .select("username, green_points, level")
        .eq("id", user.id)
        .single();


    if (error) {

        console.error(error);

        return;
    }


    document.getElementById("registrazione").style.display =
        "none";

    document.getElementById("login").style.display =
        "none";

    document.getElementById("profilo").style.display =
        "block";


    document.getElementById("testoBenvenuto").textContent =
        "Benvenuto, @" + profile.username + "!";


    document.getElementById("greenPoints").textContent =
        profile.green_points;


    document.getElementById("level").textContent =
        profile.level;

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout() {

    await client.auth.signOut();

    document.getElementById("profilo").style.display =
        "none";

    document.getElementById("registrazione").style.display =
        "block";

    mostraMessaggio(
        "Hai effettuato il logout."
    );

}


/* =====================================================
   CAMBIO FORM
   ===================================================== */

function mostraLogin() {

    document.getElementById("registrazione").style.display =
        "none";

    document.getElementById("login").style.display =
        "block";

    document.getElementById("messaggio").textContent =
        "";

}


function mostraRegistrazione() {

    document.getElementById("login").style.display =
        "none";

    document.getElementById("registrazione").style.display =
        "block";

    document.getElementById("messaggio").textContent =
        "";

}


/* =====================================================
   MESSAGGI
   ===================================================== */

function mostraMessaggio(testo) {

    document.getElementById("messaggio").textContent =
        testo;

}


/* =====================================================
   AVVIO
   ===================================================== */

window.onload = async function() {

    const lingua =
        localStorage.getItem("ecoGameLingua") || "it";

    cambiaLingua(lingua);


    const {
        data: {
            session
        }
    } = await client.auth.getSession();


    if (session) {

        mostraProfilo();

    }

};

</script>

</body>

</html>
