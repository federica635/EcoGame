<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EcoGame - Account 🌱</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dcedc8, #e8f5e9);
    color: #173b22;
    min-height: 100vh;
}

header {
    background: #2e7d32;
    color: white;
    text-align: center;
    padding: 25px 20px;
}

header h1 {
    margin: 0;
    font-size: 45px;
}

.lingue {
    margin-bottom: 20px;
}

.lingue button {
    background: white;
    color: #173b22;
    border: 2px solid #43a047;
    margin: 5px;
    padding: 9px 14px;
    border-radius: 10px;
    cursor: pointer;
}

.contenitore {
    width: 90%;
    max-width: 500px;
    margin: 40px auto;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
}

h2 {
    text-align: center;
    color: #2e7d32;
}

label {
    display: block;
    text-align: left;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #bbb;
    border-radius: 10px;
    font-size: 16px;
}

.azione {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    background: #43a047;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.azione:hover {
    background: #1b5e20;
}

.cambio {
    text-align: center;
    margin-top: 20px;
}

.cambio button {
    border: none;
    background: none;
    color: #2e7d32;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
}

#messaggio {
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
}

.home {
    display: block;
    text-align: center;
    margin-top: 25px;
    color: #1b5e20;
    font-weight: bold;
    text-decoration: none;
}

footer {
    margin-top: 50px;
    background: #1b5e20;
    color: white;
    text-align: center;
    padding: 20px;
}

</style>

</head>

<body>

<header>

<div class="lingue">

<button onclick="cambiaLingua('it')">
🇮🇹 Italiano
</button>

<button onclick="cambiaLingua('en')">
🇬🇧 English
</button>

<button onclick="cambiaLingua('fi')">
🇫🇮 Suomi
</button>

</div>

<h1>🌍 EcoGame</h1>

</header>


<div class="contenitore">

<div class="box">

<div id="registrazione">

<h2 id="titolo">
👤 Crea il tuo account
</h2>

<label id="labelUsername">
Username
</label>

<input
type="text"
id="username"
placeholder="Il tuo username"
>

<label id="labelEmail">
Email
</label>

<input
type="email"
id="email"
placeholder="La tua email"
>

<label id="labelPassword">
Password
</label>

<input
type="password"
id="password"
placeholder="La tua password"
>

<button
class="azione"
onclick="registrati()"
id="bottoneRegistrati"
>
🌱 Crea account
</button>

<div class="cambio">

<span id="giaAccount">
Hai già un account?
</span>

<button
onclick="mostraLogin()"
id="vaiLogin"
>
Accedi
</button>

</div>

</div>


<div
id="login"
style="display:none;"
>

<h2 id="titoloLogin">
🔐 Accedi
</h2>

<label>
Email
</label>

<input
type="email"
id="loginEmail"
placeholder="La tua email"
>

<label>
Password
</label>

<input
type="password"
id="loginPassword"
placeholder="La tua password"
>

<button
class="azione"
onclick="accedi()"
>
🔐 Accedi
</button>

<div class="cambio">

<span id="nonAccount">
Non hai ancora un account?
</span>

<button
onclick="mostraRegistrazione()"
id="vaiRegistrazione"
>
Registrati
</button>

</div>

</div>


<div id="messaggio"></div>

<a
href="index.html"
class="home"
id="home"
>
🏠 Torna a EcoGame
</a>

</div>

</div>


<footer>

🌱 EcoGame — Imparare l'ecologia giocando

</footer>


<script>

function mostraLogin() {

    document.getElementById("registrazione").style.display =
        "none";

    document.getElementById("login").style.display =
        "block";

    document.getElementById("messaggio").textContent =
        "";

}


function mostraRegistrazione() {

    document.getElementById("login").style.display =
        "none";

    document.getElementById("registrazione").style.display =
        "block";

    document.getElementById("messaggio").textContent =
        "";

}


function registrati() {

    const username =
        document.getElementById("username").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    if (
        username === "" ||
        email === "" ||
        password === ""
    ) {

        document.getElementById("messaggio").textContent =
            "⚠️ Compila tutti i campi.";

        return;

    }


    document.getElementById("messaggio").textContent =
        "🌱 Account pronto! Ora collegheremo Supabase.";

}


function accedi() {

    const email =
        document.getElementById("loginEmail").value;

    const password =
        document.getElementById("loginPassword").value;


    if (
        email === "" ||
        password === ""
    ) {

        document.getElementById("messaggio").textContent =
            "⚠️ Inserisci email e password.";

        return;

    }


    document.getElementById("messaggio").textContent =
        "🔐 Login pronto! Ora collegheremo Supabase.";

}


function cambiaLingua(lingua) {

    localStorage.setItem(
        "ecoGameLingua",
        lingua
    );


    if (lingua === "it") {

        document.documentElement.lang = "it";

        document.getElementById("titolo").textContent =
            "👤 Crea il tuo account";

        document.getElementById("labelUsername").textContent =
            "Username";

        document.getElementById("labelEmail").textContent =
            "Email";

        document.getElementById("labelPassword").textContent =
            "Password";

        document.getElementById("bottoneRegistrati").textContent =
            "🌱 Crea account";

        document.getElementById("giaAccount").textContent =
            "Hai già un account?";

        document.getElementById("vaiLogin").textContent =
            "Accedi";

        document.getElementById("titoloLogin").textContent =
            "🔐 Accedi";

        document.getElementById("nonAccount").textContent =
            "Non hai ancora un account?";

        document.getElementById("vaiRegistrazione").textContent =
            "Registrati";

        document.getElementById("home").textContent =
            "🏠 Torna a EcoGame";
    }


    if (lingua === "en") {

        document.documentElement.lang = "en";

        document.getElementById("titolo").textContent =
            "👤 Create your account";

        document.getElementById("labelUsername").textContent =
            "Username";

        document.getElementById("labelEmail").textContent =
            "Email";

        document.getElementById("labelPassword").textContent =
            "Password";

        document.getElementById("bottoneRegistrati").textContent =
            "🌱 Create account";

        document.getElementById("giaAccount").textContent =
            "Already have an account?";

        document.getElementById("vaiLogin").textContent =
            "Login";

        document.getElementById("titoloLogin").textContent =
            "🔐 Login";

        document.getElementById("nonAccount").textContent =
            "Don't have an account yet?";

        document.getElementById("vaiRegistrazione").textContent =
            "Sign up";

        document.getElementById("home").textContent =
            "🏠 Back to EcoGame";
    }


    if (lingua === "fi") {

        document.documentElement.lang = "fi";

        document.getElementById("titolo").textContent =
            "👤 Luo käyttäjätili";

        document.getElementById("labelUsername").textContent =
            "Käyttäjänimi";

        document.getElementById("labelEmail").textContent =
            "Sähköposti";

        document.getElementById("labelPassword").textContent =
            "Salasana";

        document.getElementById("bottoneRegistrati").textContent =
            "🌱 Luo tili";

        document.getElementById("giaAccount").textContent =
            "Onko sinulla jo tili?";

        document.getElementById("vaiLogin").textContent =
            "Kirjaudu";

        document.getElementById("titoloLogin").textContent =
            "🔐 Kirjaudu";

        document.getElementById("nonAccount").textContent =
            "Eikö sinulla ole vielä tiliä?";

        document.getElementById("vaiRegistrazione").textContent =
            "Rekisteröidy";

        document.getElementById("home").textContent =
            "🏠 Takaisin EcoGameen";
    }

}


window.onload = function() {

    const lingua =
        localStorage.getItem("ecoGameLingua") || "it";

    cambiaLingua(lingua);

};

</script>

</body>

</html>
