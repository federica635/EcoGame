<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101820;
    color: #eef7f0;
}

header {
    background: #17251d;
    border-bottom: 1px solid #395342;
    padding: 20px 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    color: #81c784;
    font-size: 24px;
    font-weight: bold;
}

.destra {
    display: flex;
    align-items: center;
    gap: 12px;
}

.info {
    color: #b8c8bc;
}

.lingua {
    padding: 9px 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
    cursor: pointer;
}

.container {
    width: 92%;
    max-width: 1000px;
    margin: 30px auto;
}

.intro {
    text-align: center;
    margin-bottom: 25px;
}

.intro h1 {
    color: #81c784;
    font-size: 38px;
    margin-bottom: 10px;
}

.intro p {
    color: #b9c9bd;
    line-height: 1.6;
    font-size: 16px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: #17251d;
    border: 1px solid #395342;
    border-radius: 14px;
    padding: 15px;
    text-align: center;
}

.stat-title {
    color: #aabaae;
    font-size: 14px;
}

.stat-number {
    color: #81c784;
    font-size: 27px;
    font-weight: bold;
    margin-top: 6px;
}

.memory {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    max-width: 760px;
    margin: auto;
}

.card {
    height: 150px;
    perspective: 1000px;
    cursor: pointer;
}

.card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s;
    transform-style: preserve-3d;
}

.card.flipped .card-inner,
.card.matched .card-inner {
    transform: rotateY(180deg);
}

.face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 15px;
}

.front {
    background: #1c3324;
    border: 2px solid #42614a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
    color: #81c784;
}

.front:hover {
    background: #274832;
    border-color: #81c784;
}

.back {
    background: #e8f5e9;
    color: #17251d;
    transform: rotateY(180deg);
    border: 2px solid #81c784;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 10px;
    text-align: center;
}

.emoji {
    font-size: 38px;
    margin-bottom: 7px;
}

.text {
    font-size: 15px;
    font-weight: bold;
}

.back small {
    margin-top: 5px;
    font-size: 12px;
}

.card.matched .back {
    background: #c8e6c9;
}

.feedback {
    max-width: 760px;
    margin: 25px auto 0;
    padding: 18px;
    background: #17251d;
    border: 1px solid #395342;
    border-radius: 13px;
    text-align: center;
    line-height: 1.6;
    display: none;
}

.reset {
    display: block;
    margin: 25px auto;
    background: #43a047;
    border: none;
    color: white;
    padding: 13px 23px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

.reset:hover {
    background: #66bb6a;
}

#finale {
    display: none;
    text-align: center;
    background: #17251d;
    border: 1px solid #395342;
    border-radius: 20px;
    padding: 35px;
    margin-top: 25px;
}

.final-score {
    font-size: 55px;
    color: #81c784;
    font-weight: bold;
    margin: 15px;
}

.final-text {
    color: #c5d2c8;
    line-height: 1.7;
    font-size: 18px;
}

@media(max-width: 700px) {

    .memory {
        grid-template-columns: repeat(2, 1fr);
    }

    .stats {
        grid-template-columns: 1fr;
    }

    header {
        flex-direction: column;
        gap: 10px;
    }

}

</style>

let carte = [];

/* =====================================================
   OTTIENI TESTO CORRETTO DELLA CARTA
   ===================================================== */

function ottieniCartaTradotta(carta) {

    const lingua =
        document.getElementById("lingua").value;

    const testi =
        traduzioni[lingua];

    const dati =
        testi.carte[carta.numero];

    return {

        titolo: dati[0],

        descrizione: dati[1]

    };

}


/* =====================================================
   CAMBIO LINGUA
   ===================================================== */

function cambiaLingua() {

    const selettore =
        document.getElementById("lingua");

    const lingua =
        selettore.value;

    const testi =
        traduzioni[lingua];

    if (!testi) {
        return;
    }


    document
        .querySelectorAll("[data-testo]")
        .forEach(function(elemento) {

            const chiave =
                elemento.getAttribute("data-testo");

            if (
                Object.prototype.hasOwnProperty.call(
                    testi,
                    chiave
                )
            ) {

                elemento.textContent =
                    testi[chiave];

            }

        });


    document.getElementById("secondi").textContent =
        testi.secondi;


    document.documentElement.lang =
        lingua;


    localStorage.setItem(
        "linguaEcoGame",
        lingua
    );


    aggiornaCarteVisibili();

}


/* =====================================================
   AGGIORNA TESTI DELLE CARTE
   ===================================================== */

function aggiornaCarteVisibili() {

    const elementi =
        document.querySelectorAll(".card");


    elementi.forEach(function(elemento) {

        const numero =
            Number(
                elemento.dataset.numero
            );


        const carta =
            carte.find(function(c) {

                return c.numero === numero;

            });


        if (!carta) {
            return;
        }


        const dati =
            ottieniCartaTradotta(carta);


        const testo =
            elemento.querySelector(".text");


        const descrizione =
            elemento.querySelector("small");


        if (testo) {

            testo.textContent =
                dati.titolo;

        }


        if (descrizione) {

            descrizione.textContent =
                dati.descrizione;

        }

    });

}


/* =====================================================
   MESCOLA
   ===================================================== */

function mescola(array) {

    const copia =
        [...array];


    for (
        let i = copia.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            copia[i],
            copia[j]
        ] =
        [
            copia[j],
            copia[i]
        ];

    }


    return copia;

}


/* =====================================================
   NUOVA PARTITA
   ===================================================== */

function nuovaPartita() {

    clearInterval(timer);


    primaCarta = null;

    secondaCarta = null;

    blocco = false;

    tentativi = 0;

    coppieTrovate = 0;

    tempo = 0;


    document.getElementById("tempo").textContent =
        "0";

    document.getElementById("tentativi").textContent =
        "0";

    document.getElementById("coppie").textContent =
        "0";


    document.getElementById("finale").style.display =
        "none";


    document.getElementById("feedback").style.display =
        "none";


    carte =
        mescola(coppie);


    const memory =
        document.getElementById("memory");


    memory.innerHTML = "";


    carte.forEach(function(carta) {

        const elemento =
            document.createElement("div");


        elemento.className =
            "card";


        /*
         * Salviamo il numero reale della carta
         * direttamente nell'elemento HTML.
         */

        elemento.dataset.numero =
            carta.numero;


        const dati =
            ottieniCartaTradotta(carta);


        elemento.innerHTML = `

            <div class="card-inner">

                <div class="face front">
                    ?
                </div>

                <div class="face back">

                    <div class="emoji">
                        ${carta.emoji}
                    </div>

                    <div class="text">
                        ${dati.titolo}
                    </div>

                    <small>
                        ${dati.descrizione}
                    </small>

                </div>

            </div>

        `;


        elemento.onclick =
            function() {

                giraCarta(
                    elemento,
                    carta
                );

            };


        memory.appendChild(elemento);

    });


    timer =
        setInterval(function() {

            tempo++;


            document.getElementById("tempo").textContent =
                tempo;


        }, 1000);

}


/* =====================================================
   GIRA CARTA
   ===================================================== */

function giraCarta(elemento, carta) {

    if (blocco) {
        return;
    }


    if (
        elemento.classList.contains("flipped")
    ) {
        return;
    }


    if (
        elemento.classList.contains("matched")
    ) {
        return;
    }


    elemento.classList.add("flipped");


    if (!primaCarta) {

        primaCarta = {

            elemento: elemento,

            carta: carta

        };

        return;

    }


    secondaCarta = {

        elemento: elemento,

        carta: carta

    };


    tentativi++;


    document.getElementById("tentativi").textContent =
        tentativi;


    controllaCoppia();

}


/* =====================================================
   CONTROLLA COPPIA
   ===================================================== */

    blocco = true;


    /*
     * Le carte appartengono alla stessa coppia
     * se hanno lo stesso ID.
     */

    if (
        primaCarta.carta.id ===
        secondaCarta.carta.id
    ) {


        setTimeout(function() {

            primaCarta.elemento.classList.add(
                "matched"
            );


            secondaCarta.elemento.classList.add(
                "matched"
            );


            coppieTrovate++;


            document.getElementById("coppie").textContent =
                coppieTrovate;


            mostraSpiegazione(
                primaCarta.carta
            );


            primaReset();


            if (
                coppieTrovate === 8
            ) {

                termina();

            }


        }, 500);


    } else {


        setTimeout(function() {

            primaCarta.elemento.classList.remove(
                "flipped"
            );


            secondaCarta.elemento.classList.remove(
                "flipped"
            );


            primaReset();


        }, 1000);

    }

}


/* =====================================================
   RESET CARTE
   ===================================================== */

function primaReset() {

    primaCarta = null;

    secondaCarta = null;

    blocco = false;

}


/* =====================================================
   MOSTRA SPIEGAZIONE
   ===================================================== */

function mostraSpiegazione(carta) {

    const feedback =
        document.getElementById("feedback");


    const lingua =
        document.getElementById("lingua").value;


    const testi =
        traduzioni[lingua];


    const dati =
        ottieniCartaTradotta(carta);


    feedback.innerHTML =
        testi.feedbackPrefix +
        " <strong>" +
        dati.titolo +
        ":</strong> " +
        dati.descrizione;


    feedback.style.display =
        "block";

}


/* =====================================================
   FINE PARTITA
   ===================================================== */

function termina() {

    clearInterval(timer);


    let base = 1000;


    let penalitaTempo =
        tempo * 3;


    let penalitaTentativi =
        Math.max(
            0,
            tentativi - 8
        ) * 30;


    let punteggioFinale =
        Math.max(
            100,
            base -
            penalitaTempo -
            penalitaTentativi
        );


    const lingua =
        document.getElementById("lingua").value;


    const testi =
        traduzioni[lingua];


    document.getElementById("punteggio").textContent =
        punteggioFinale +
        " " +
        testi.punti;


    let messaggio;


    if (
        punteggioFinale >= 800
    ) {

        messaggio =
            testi.messaggio800;

    } else if (
        punteggioFinale >= 600
    ) {

        messaggio =
            testi.messaggio600;

    } else if (
        punteggioFinale >= 400
    ) {

        messaggio =
            testi.messaggio400;

    } else {

        messaggio =
            testi.messaggioBasso;

    }


    document.getElementById("finalText").textContent =
        messaggio;


    document.getElementById("finale").style.display =
        "block";


    /* =================================================
       GREEN POINTS
       50 GP una sola volta per questo gioco.
       
       "memory-biodiversita" è l'identificativo univoco
       del gioco. Anche riavviando la partita,
       i GP non vengono accreditati nuovamente.
    ================================================= */

    if (
        typeof accreditaGreenPointsUnaVolta ===
        "function"
    ) {

        accreditaGreenPointsUnaVolta(
            "memory-biodiversita",
            50
        )
        .then(function(risultato) {

            if (
                risultato &&
                risultato.success
            ) {

                console.log(
                    "🌱 Memory Biodiversità: 50 Green Points accreditati."
                );

            } else if (
                risultato &&
                risultato.alreadyAdded
            ) {

                console.log(
                    "🌱 Memory Biodiversità: Green Points già accreditati."
                );

            } else {

                console.warn(
                    "EcoGame: Green Points non accreditati.",
                    risultato
                );

            }

        })
        .catch(function(errore) {

            console.error(
                "EcoGame: errore accredito Green Points:",
                errore
            );

        });

    } else {

        console.error(
            "EcoGame: accreditaGreenPointsUnaVolta non disponibile."
        );

    }

}


/* =====================================================
   CARICA LINGUA SALVATA
   ===================================================== */

const linguaSalvata =
    localStorage.getItem("linguaEcoGame") || "it";


const selettoreLingua =
    document.getElementById("lingua");


if (
    Object.prototype.hasOwnProperty.call(
        traduzioni,
        linguaSalvata
    )
) {

    selettoreLingua.value =
        linguaSalvata;

} else {

    selettoreLingua.value =
        "it";

}


cambiaLingua();


/* =====================================================
   AVVIA PARTITA
   ===================================================== */

nuovaPartita();

</script>
