     SUPABASE
     ===================================================== -->

     SISTEMA COMUNE ECOGAME

<script src="ecogame.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101820;
    color: white;
    overflow-x: hidden;
}

header {
    background: #17251d;
    border-bottom: 1px solid #3d5544;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    color: #ffd54f;
    font-size: 24px;
    font-weight: bold;
}

.info {
    color: #c7d3c9;
}

.container {
    width: 94%;
    max-width: 1000px;
    margin: 30px auto;
}

.intro {
    text-align: center;
}

.intro h1 {
    color: #ffd54f;
    font-size: 38px;
    margin-bottom: 8px;
}

.intro p {
    color: #b9c9bd;
    line-height: 1.6;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
    flex-wrap: wrap;
}

.stat {
    background: #17251d;
    border: 1px solid #4d604b;
    padding: 12px 25px;
    border-radius: 12px;
}

.stat span {
    color: #ffd54f;
    font-weight: bold;
    font-size: 22px;
}

.green-points {
    background: #17251d;
    border: 1px solid #4d604b;
    padding: 12px 25px;
    border-radius: 12px;
}

.green-points span {
    color: #81c784;
    font-weight: bold;
    font-size: 22px;
}

.game {
    position: relative;
    width: 100%;
    height: 380px;

    background:
        linear-gradient(
            #86c5d8 0%,
            #b9e0df 55%,
            #789c55 56%,
            #456638 100%
        );

    border: 2px solid #526d56;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
}

.sun {
    position: absolute;
    top: 25px;
    right: 65px;
    font-size: 58px;
}

.cloud {
    position: absolute;
    top: 55px;
    left: 18%;
    font-size: 45px;
    opacity: 0.8;
}

.cloud2 {
    position: absolute;
    top: 110px;
    left: 65%;
    font-size: 35px;
    opacity: 0.7;
}

.flower {
    position: absolute;
    bottom: 55px;
    font-size: 30px;
}

.flower1 {
    left: 20%;
}

.flower2 {
    left: 55%;
}

.flower3 {
    left: 80%;
}

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 60px;
    background: #456638;
    border-top: 4px solid #77965d;
}


/* =====================================================
   APE
===================================================== */

.player {
    position: absolute;
    left: 90px;
    bottom: 60px;
    width: 70px;
    height: 65px;
    font-size: 55px;
    z-index: 5;
    user-select: none;
    transform: scaleX(-1);

    filter:
        drop-shadow(
            2px 3px 2px
            rgba(0,0,0,0.25)
        );
}


/* =====================================================
   OSTACOLI
===================================================== */

.obstacles {
    position: absolute;
    bottom: 60px;
    right: 0;
    width: 100%;
    height: 75px;
    pointer-events: none;
}

.obstacle,
.obstacle2 {
    position: absolute;
    bottom: 0;

    width: 65px;
    height: 65px;

    font-size: 50px;

    display: flex;
    align-items: center;
    justify-content: center;

    user-select: none;

    filter:
        drop-shadow(
            2px 3px 2px
            rgba(0,0,0,0.3)
        );
}

.obstacle {
    right: -100px;
}

.obstacle2 {
    right: -220px;
}


/* =====================================================
   GAME OVER
===================================================== */

.gameover {
    position: absolute;
    inset: 0;

    background:
        rgba(10,20,15,0.84);

    display: none;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    z-index: 20;

    text-align: center;
}

.gameover h2 {
    color: #ff8a80;
    font-size: 42px;
    margin: 5px;
}

.gameover p {
    color: #e0ebe2;
    font-size: 18px;
}

.gp-result {
    color: #81c784 !important;
    font-size: 24px !important;
    font-weight: bold;
    margin-top: 10px;
}

.gp-total {
    color: #c8e6c9 !important;
    font-size: 16px !important;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px 22px;

    background: #f9a825;
    color: #17251d;

    font-weight: bold;
    font-size: 16px;

    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #ffd54f;
}

.help {
    text-align: center;
    margin-top: 20px;
    color: #aebdb1;
}

kbd {
    background: #26382b;
    border: 1px solid #526653;
    padding: 4px 9px;
    border-radius: 5px;
    color: white;
}

@media(max-width:650px) {

    .game {
        height: 320px;
    }

    .player {
        left: 50px;
    }

    header {
        padding: 16px 18px;
    }

    .logo {
        font-size: 20px;
    }

    .intro h1 {
        font-size: 32px;
    }

}

</style>

</head>

<script>


/* =====================================================
   TRADUZIONI
===================================================== */

const traduzioni = {


    it: {

        nomeGioco:
            "🐝 Eco Bee Runner",

        titolo:
            "🐝 Eco Bee Runner",

        intro:
            "Aiuta l'ape a ripulire il suo ambiente!<br>Salta i rifiuti e non farti colpire.",

        distanza:
            "Distanza:",

        record:
            "Record:",

        gp:
            "Green Points:",

        gameoverTitolo:
            "💥 Ops!",

        gameoverTesto:
            "L'ape ha incontrato della sporcizia!",

        distanzaFinale:
            "Distanza:",

        riprova:
            "🔄 Riprova",

        menu:
            "🎮 Menu",

        premi:
            "Premi",

        oppure:
            "o",

        saltare:
            "per saltare.",

        gpOttenuti:
            "🌱 +{punti} Green Points",

        gpTotali:
            "🌱 Green Points totali: {punti}"

    },


    en: {

        nomeGioco:
            "🐝 Eco Bee Runner",

        titolo:
            "🐝 Eco Bee Runner",

        intro:
            "Help the bee clean up its environment!<br>Jump over the waste and don't get hit.",

        distanza:
            "Distance:",

        record:
            "Record:",

        gp:
            "Green Points:",

        gameoverTitolo:
            "💥 Oops!",

        gameoverTesto:
            "The bee hit some waste!",

        distanzaFinale:
            "Distance:",

        riprova:
            "🔄 Try Again",

        menu:
            "🎮 Menu",

        premi:
            "Press",

        oppure:
            "or",

        saltare:
            "to jump.",

        gpOttenuti:
            "🌱 +{punti} Green Points",

        gpTotali:
            "🌱 Total Green Points: {punti}"

    },


    fi: {

        nomeGioco:
            "🐝 Eco Bee Runner",

        titolo:
            "🐝 Eco Bee Runner",

        intro:
            "Auta mehiläistä siivoamaan ympäristöään!<br>Hyppää jätteiden yli ja vältä osumia.",

        distanza:
            "Matka:",

        record:
            "Ennätys:",

        gp:
            "Green Points:",

        gameoverTitolo:
            "💥 Hups!",

        gameoverTesto:
            "Mehiläinen osui jätteeseen!",

        distanzaFinale:
            "Matka:",

        riprova:
            "🔄 Yritä uudelleen",

        menu:
            "🎮 Valikko",

        premi:
            "Paina",

        oppure:
            "tai",

        saltare:
            "hypätäksesi.",

        gpOttenuti:
            "🌱 +{punti} Green Points",

        gpTotali:
            "🌱 Green Points yhteensä: {punti}"

    }

};


/* =====================================================
   LINGUA
===================================================== */

let lingua =
    localStorage.getItem(
        "ecoGameLingua"
    ) || "it";


if (
    !Object.prototype.hasOwnProperty.call(
        traduzioni,
        lingua
    )
) {

    lingua = "it";

}


document.documentElement.lang =
    lingua;


/* =====================================================
   APPLICA LINGUA
===================================================== */

function applicaLingua() {

    const testi =
        traduzioni[lingua];


    document.documentElement.lang =
        lingua;


    document
        .querySelectorAll("[data-testo]")
        .forEach(function(elemento) {

            const chiave =
                elemento.getAttribute(
                    "data-testo"
                );


            if (
                Object.prototype.hasOwnProperty.call(
                    testi,
                    chiave
                )
            ) {

                elemento.innerHTML =
                    testi[chiave];

            }

        });


    aggiornaTestoGreenPoints();

}


/* =====================================================
   AGGIORNA TESTI GREEN POINTS
===================================================== */

function aggiornaTestoGreenPoints() {

    const gpResult =
        document.getElementById(
            "gpResult"
        );


    const gpTotal =
        document.getElementById(
            "gpTotal"
        );


    if (!gpResult || !gpTotal) {
        return;
    }


    const testi =
        traduzioni[lingua];


    const punti =
        gpResult.dataset.punti ||
        "0";


    const totale =
        gpTotal.dataset.totale ||
        "";


    gpResult.innerHTML =
        testi.gpOttenuti.replace(
            "{punti}",
            punti
        );


    if (totale !== "") {

        gpTotal.innerHTML =
            testi.gpTotali.replace(
                "{punti}",
                totale
            );

    }

}


/* =====================================================
   ASCOLTA CAMBIO LINGUA COMUNE
===================================================== */

window.addEventListener(
    "ecoGameLinguaCambiata",
    function(event) {

        const nuovaLingua =
            event.detail &&
            event.detail.lingua
                ? event.detail.lingua
                : "it";


        if (
            Object.prototype.hasOwnProperty.call(
                traduzioni,
                nuovaLingua
            )
        ) {

            lingua =
                nuovaLingua;

            applicaLingua();

        }

    }
);


/* =====================================================
   ELEMENTI DEL GIOCO
===================================================== */

const game =
    document.getElementById(
        "game"
    );


const player =
    document.getElementById(
        "player"
    );


const obstacle =
    document.getElementById(
        "obstacle"
    );


const obstacle2 =
    document.getElementById(
        "obstacle2"
    );


const scoreElement =
    document.getElementById(
        "score"
    );


const recordElement =
    document.getElementById(
        "record"
    );


const gameover =
    document.getElementById(
        "gameover"
    );


const finalScore =
    document.getElementById(
        "finalScore"
    );


const gpResult =
    document.getElementById(
        "gpResult"
    );


const gpTotal =
    document.getElementById(
        "gpTotal"
    );


/* =====================================================
   VARIABILI
===================================================== */

let jumping = false;

let gameRunning = true;

let playerY = 0;

let velocity = 0;

let score = 0;

let speed = 7;

let obstacleX = -100;

let obstacle2X = -220;

let secondActive = false;

let lastTime = 0;

let greenPointsAccreditati =
    false;


let record =
    Number(
        localStorage.getItem(
            "ecoBeeRecord"
        )
    ) || 0;


const rifiuti = [

    "🥫",
    "🧴",
    "🧃",
    "🥤",
    "🍾",
    "🗑️",
    "📄",
    "📰",
    "📦",
    "🧻",
    "🛍️",
    "🧋",
    "🥡",
    "🍴"

];


recordElement.innerText =
    record;


/* =====================================================
   RIFIUTO CASUALE
===================================================== */

function rifiutoCasuale() {

    return rifiuti[
        Math.floor(
            Math.random() *
            rifiuti.length
        )
    ];

}


/* =====================================================
   CALCOLO GREEN POINTS
===================================================== */

/*
 * 10 GP ogni 100 metri.
 *
 * Esempi:
 *
 * 10 metri  = 10 GP
 * 90 metri  = 10 GP
 * 100 metri = 10 GP
 * 200 metri = 20 GP
 * 500 metri = 50 GP
 *
 * Il massimo è 100 GP per una partita.
 */

function calcolaGreenPointsBee(
    distanza
) {

    distanza =
        Math.floor(
            Number(distanza)
        );


    if (
        !Number.isFinite(distanza) ||
        distanza <= 0
    ) {

        return 0;

    }


    const punti =
        Math.floor(
            distanza / 100
        ) * 10;


    return Math.min(
        100,
        Math.max(
            10,
            punti
        )
    );

}


/* =====================================================
   ACCREDITA GREEN POINTS
===================================================== */

async function accreditaGreenPointsBee() {

    if (greenPointsAccreditati) {

        return;

    }


    greenPointsAccreditati =
        true;


    const punti =
        calcolaGreenPointsBee(
            score
        );


    gpResult.dataset.punti =
        punti;


    gpResult.innerHTML =
        traduzioni[lingua]
            .gpOttenuti
            .replace(
                "{punti}",
                punti
            );


    /*
     * Se il giocatore non ha raggiunto
     * nessuna distanza, non accreditiamo nulla.
     */

    if (punti <= 0) {

        return;

    }


    /*
     * ecoGame.addGamePoints usa il sistema
     * comune di ecogame.js.
     *
     * Il gameId "eco-bee-runner"
     * impedisce accrediti multipli
     * nella stessa sessione.
     */

    if (
        !window.ecoGame ||
        typeof window.ecoGame.addGamePoints !==
        "function"
    ) {

        console.error(
            "EcoGame: ecogame.js non disponibile."
        );

        greenPointsAccreditati =
            false;

        return;

    }


    try {

        const risultato =
            await window.ecoGame.addGamePoints(
                "eco-bee-runner",
                punti
            );


        if (
            risultato &&
            risultato.success
        ) {

            console.log(
                "🐝 Eco Bee Runner - GP aggiunti:",
                risultato.pointsAdded
            );


            console.log(
                "🌱 GP totali:",
                risultato.totalPoints
            );


            gpTotal.dataset.totale =
                risultato.totalPoints;


            gpTotal.innerHTML =
                traduzioni[lingua]
                    .gpTotali
                    .replace(
                        "{punti}",
                        risultato.totalPoints
                    );


            aggiornaGreenPointsPaginaLocale(
                risultato.totalPoints
            );


        } else if (
            risultato &&
            risultato.alreadyAdded
        ) {

            /*
             * I punti erano già stati accreditati.
             *
             * Proviamo comunque a leggere
             * il totale aggiornato dall'account.
             */

            console.log(
                "🐝 Eco Bee Runner: GP già accreditati."
            );


            if (
                window.ecoGame &&
                typeof window.ecoGame.getGreenPoints ===
                "function"
            ) {

                const totale =
                    await window.ecoGame.getGreenPoints();


                if (
                    totale &&
                    totale.success
                ) {

                    gpTotal.dataset.totale =
                        totale.points;


                    gpTotal.innerHTML =
                        traduzioni[lingua]
                            .gpTotali
                            .replace(
                                "{punti}",
                                totale.points
                            );


                    aggiornaGreenPointsPaginaLocale(
                        totale.points
                    );

                }

            }

        } else {

            console.error(
                "EcoGame: impossibile accreditare i GP:",
                risultato
            );

            greenPointsAccreditati =
                false;

        }

    } catch (errore) {

        console.error(
            "EcoGame: errore accredito GP:",
            errore
        );

        greenPointsAccreditati =
            false;

    }

}


/* =====================================================
   AGGIORNA GREEN POINTS VISIBILI
===================================================== */

function aggiornaGreenPointsPaginaLocale(
    punti
) {

    punti =
        Number(punti) || 0;


    const ids = [

        "greenPointsTotali",

        "green-points-totali",

        "greenPoints",

        "gpTotali",

        "gp-totali",

        "accountGreenPoints"

    ];


    ids.forEach(
        function(id) {

            const elemento =
                document.getElementById(
                    id
                );


            if (elemento) {

                elemento.innerText =
                    punti;

            }

        }
    );


    document
        .querySelectorAll(
            "[data-green-points]"
        )
        .forEach(
            function(elemento) {

                elemento.innerText =
                    punti;

            }
        );

}


/* =====================================================
   CARICA GREEN POINTS ACCOUNT
===================================================== */

async function caricaGPAccount() {

    if (
        !window.ecoGame ||
        typeof window.ecoGame.loadAccountPoints !==
        "function"
    ) {

        return;

    }


    try {

        const risultato =
            await window.ecoGame.loadAccountPoints();


        if (
            risultato &&
            risultato.success
        ) {

            aggiornaGreenPointsPaginaLocale(
                risultato.points
            );

        }

    } catch (errore) {

        console.error(
            "EcoGame: errore caricamento GP:",
            errore
        );

    }

}


/* =====================================================
   SALTO
===================================================== */

function jump() {

    if (!gameRunning) {
        return;
    }


    if (!jumping) {

        jumping = true;

        velocity = 15;

    }

}


/* =====================================================
   TASTIERA
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();

        }

    }
);


/* =====================================================
   CLICK
===================================================== */

game.addEventListener(
    "mousedown",
    jump
);


/* =====================================================
   TOUCH
===================================================== */

game.addEventListener(
    "touchstart",
    jump
);


/* =====================================================
   COLLISIONE
===================================================== */

function collisione(a, b) {

    const r1 =
        a.getBoundingClientRect();

    const r2 =
        b.getBoundingClientRect();


    return !(
        r1.right - 15 < r2.left + 10 ||

        r1.left + 15 > r2.right - 10 ||

        r1.bottom - 10 < r2.top + 8 ||

        r1.top + 10 > r2.bottom - 8
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(timestamp) {

    if (!lastTime) {
        lastTime = timestamp;
    }


    const delta =
        Math.min(
            2,
            (timestamp - lastTime) /
            16.67
        );


    lastTime = timestamp;


    if (gameRunning) {


        /* =================================================
           SALTO
        ================================================= */

        if (jumping) {

            playerY +=
                velocity * delta;

            velocity -=
                0.8 * delta;


            if (playerY <= 0) {

                playerY = 0;

                velocity = 0;

                jumping = false;

            }

        }


        player.style.bottom =
            (60 + playerY) + "px";


        /* =================================================
           PRIMO RIFIUTO
        ================================================= */

        obstacleX +=
            speed * delta;


        obstacle.style.right =
            obstacleX + "px";


        /* =================================================
           SECONDO RIFIUTO
        ================================================= */

        if (secondActive) {

            obstacle2X +=
                speed * delta;

            obstacle2.style.right =
                obstacle2X + "px";

        }


        /* =================================================
           NUOVO GRUPPO DI RIFIUTI
        ================================================= */

        if (
            obstacleX >
            game.offsetWidth + 100
        ) {

            obstacleX = -100;


            obstacle.innerText =
                rifiutoCasuale();


            score += 10;


            scoreElement.innerText =
                score;


            if (
                score >= 60 &&
                Math.random() < 0.35
            ) {

                secondActive = true;


                obstacle2X =
                    -100 -
                    (
                        90 +
                        Math.random() * 110
                    );


                obstacle2.innerText =
                    rifiutoCasuale();

            } else {

                secondActive = false;

                obstacle2X =
                    -220;

                obstacle2.style.right =
                    "-220px";

            }


            speed +=
                0.13;

        }


        /* =================================================
           COLLISIONE PRIMO OSTACOLO
        ================================================= */

        if (
            collisione(
                player,
                obstacle
            )
        ) {

            fine();

        }


        /* =================================================
           COLLISIONE SECONDO OSTACOLO
        ================================================= */

        if (
            secondActive &&
            collisione(
                player,
                obstacle2
            )
        ) {

            fine();

        }

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   GAME OVER
===================================================== */

async function fine() {

    if (!gameRunning) {

        return;

    }


    gameRunning = false;


    finalScore.innerText =
        score;


    if (score > record) {

        record =
            score;


        localStorage.setItem(
            "ecoBeeRecord",
            record
        );


        recordElement.innerText =
            record;

    }


    gameover.style.display =
        "flex";


    /*
     * Accreditiamo i Green Points dopo
     * aver mostrato il Game Over.
     */

    await accreditaGreenPointsBee();

}


/* =====================================================
   RIAVVIA
===================================================== */

function restart() {

    score = 0;

    speed = 7;

    obstacleX = -100;

    obstacle2X = -220;

    secondActive = false;

    playerY = 0;

    velocity = 0;

    jumping = false;

    gameRunning = true;

    lastTime = 0;

    greenPointsAccreditati =
        false;


    scoreElement.innerText =
        "0";


    player.style.bottom =
        "60px";


    obstacle.style.right =
        "-100px";


    obstacle2.style.right =
        "-220px";


    obstacle.innerText =
        "🥫";


    obstacle2.innerText =
        "📄";


    gpResult.dataset.punti =
        "0";


    gpResult.innerHTML =
        traduzioni[lingua]
            .gpOttenuti
            .replace(
                "{punti}",
                "0"
            );


    gpTotal.dataset.totale =
        "";


    gpTotal.innerHTML =
        "";


    gameover.style.display =
        "none";


    game.focus();

}


/* =====================================================
   AVVIO
===================================================== */

applicaLingua();

caricaGPAccount();

restart();


requestAnimationFrame(
    gameLoop
);

</script>
