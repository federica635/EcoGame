<title>🌍 Climate Challenge - EcoGame</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101820;
    color: #edf7fa;
}

header {
    background: #172630;
    border-bottom: 1px solid #38515c;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #81d4fa;
    font-size: 24px;
    font-weight: bold;
}

.menu {
    color: #b9cbd1;
    cursor: pointer;
}

.container {
    width: 94%;
    max-width: 900px;
    margin: 30px auto;
}

.title {
    text-align: center;
}

.title h1 {
    color: #81d4fa;
    font-size: 38px;
    margin-bottom: 8px;
}

.title p {
    color: #b9cbd1;
    line-height: 1.6;
}

.progress {
    margin: 25px auto 10px;
    max-width: 700px;
    height: 10px;
    background: #263941;
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #29b6f6;
    transition: width 0.3s;
}

.info {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin: 15px;
    color: #b9cbd1;
}

.info span {
    color: #81d4fa;
    font-weight: bold;
}

.card {
    background: #152831;
    border: 1px solid #405b65;
    border-radius: 18px;
    padding: 30px;
    margin-top: 20px;
}

.category {
    color: #81d4fa;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

.question {
    font-size: 23px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.scenario {
    background: #1d343e;
    border-left: 4px solid #29b6f6;
    padding: 15px;
    border-radius: 8px;
    color: #c9d8dd;
    line-height: 1.5;
    margin-bottom: 20px;
}

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    padding: 17px;
    background: #1c3039;
    color: white;
    border: 2px solid #405b65;
    border-radius: 11px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
    transition: 0.15s;
}

.answer:hover {
    border-color: #81d4fa;
    background: #243d47;
}

.answer.correct {
    background: #164d35;
    border-color: #4caf78;
}

.answer.wrong {
    background: #55282b;
    border-color: #ff7078;
}

.feedback {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #1c3039;
    color: #d7e3e7;
    line-height: 1.6;
    display: none;
}

.next {
    display: block;
    margin: 20px auto 0;
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #0288d1;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.next:hover {
    background: #03a9f4;
}

.result {
    text-align: center;
    padding: 35px;
}

.result-icon {
    font-size: 70px;
}

.result h2 {
    color: #81d4fa;
    font-size: 32px;
}

.final-score {
    font-size: 48px;
    color: #ffd54f;
    font-weight: bold;
    margin: 15px;
}

.restart,
.back {
    padding: 13px 22px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.restart {
    background: #0288d1;
    color: white;
}

.back {
    background: #37474f;
    color: white;
}

.hidden {
    display: none;
}

@media(max-width: 650px) {

    .card {
        padding: 20px;
    }

    .question {
        font-size: 20px;
    }

    .info {
        gap: 15px;
    }

    header {
        padding: 16px 18px;
    }

    .logo {
        font-size: 20px;
    }

    .title h1 {
        font-size: 32px;
    }

}

</style>

/* =========================================================
   STATO DEL GIOCO
   ========================================================= */

let current = 0;

let score = 0;

let answered = false;


/* =========================================================
   CARICA DOMANDA
   ========================================================= */

function loadQuestion() {

    answered = false;

    feedback.style.display = "none";

    next.style.display = "none";

    next.innerText =
        testi[lingua].next;


    const q =
        questions[current];


    /*
       Trova l'indice della lingua:

       it = 0
       en = 1
       fi = 2
    */

    const langIndex =
        lingua === "en"
            ? 1
            : lingua === "fi"
                ? 2
                : 0;


    category.innerText =
        q.category[langIndex];


    question.innerText =
        q.question[langIndex];


    scenario.innerText =
        q.scenario[langIndex];


    answers.innerHTML = "";


    /*
       Le risposte sono organizzate così:

       q.answers[lingua][risposta]

       quindi prendiamo la lingua corretta.
    */

    const currentAnswers =
        q.answers[langIndex];


    currentAnswers.forEach(function(answer, index) {

        const button =
            document.createElement("button");


        button.className =
            "answer";


        button.innerText =
            answer;


        button.onclick =
            function() {

                checkAnswer(
                    button,
                    index
                );

            };


        answers.appendChild(button);

    });


    questionNumber.innerText =
        (current + 1) +
        "/" +
        questions.length;


    progressBar.style.width =
        ((current / questions.length) * 100) +
        "%";

}


/* =========================================================
   CONTROLLO RISPOSTA
   ========================================================= */

function checkAnswer(selected, index) {

    if (answered) {
        return;
    }


    answered = true;


    const q =
        questions[current];


    const langIndex =
        lingua === "en"
            ? 1
            : lingua === "fi"
                ? 2
                : 0;


    const allAnswers =
        document.querySelectorAll(".answer");


    if (index === q.correct) {

        selected.classList.add("correct");


        score += 10;


        feedback.innerHTML =
            "✅ <strong>" +
            testi[lingua].correct +
            "</strong><br><br>" +
            q.explanation[langIndex];

    }

    else {

        selected.classList.add("wrong");


        allAnswers[q.correct]
            .classList.add("correct");


        score -= 5;


        feedback.innerHTML =
            "❌ <strong>" +
            testi[lingua].wrong +
            "</strong><br><br>" +

            testi[lingua].correctAnswer +
            " <strong>" +

            q.answers[langIndex][q.correct] +

            "</strong><br><br>" +

            q.explanation[langIndex];

    }


    scoreElement.innerText =
        score;


    feedback.style.display =
        "block";


    next.style.display =
        "block";


    if (
        current ===
        questions.length - 1
    ) {

        next.innerText =
            testi[lingua].final;

    }

}


/* =========================================================
   PROSSIMA DOMANDA
   ========================================================= */

function nextQuestion() {

    current++;


    if (
        current <
        questions.length
    ) {

        loadQuestion();

    }

    else {

        showResult();

    }

}


/* =========================================================
   RISULTATO FINALE
   ========================================================= */

function showResult() {

    document
        .getElementById("quizCard")
        .classList
        .add("hidden");


    document
        .getElementById("resultCard")
        .classList
        .remove("hidden");


    progressBar.style.width =
        "100%";


    document
        .getElementById("finalScore")
        .innerText =
        score +
        " / 200";


    let message;


    if (score >= 170) {

        message =
            testi[lingua].excellent;

    }

    else if (score >= 140) {

        message =
            testi[lingua].veryGood;

    }

    else if (score >= 100) {

        message =
            testi[lingua].good;

    }

    else if (score >= 60) {

        message =
            testi[lingua].enough;

    }

    else {

        message =
            testi[lingua].learn;

    }


    document
        .getElementById("resultMessage")
        .innerText =
        message;

}


/* =========================================================
   RICOMINCIA
   ========================================================= */

function restartGame() {

    current = 0;

    score = 0;

    answered = false;


    scoreElement.innerText =
        "0";


    document
        .getElementById("resultCard")
        .classList
        .add("hidden");


    document
        .getElementById("quizCard")
        .classList
        .remove("hidden");


    loadQuestion();

}


/* =========================================================
   AVVIO
   ========================================================= */

loadQuestion();

</script>
