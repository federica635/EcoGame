<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diario & Recensioni — EcoGame 🌍</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101c14;
    color: white;
    text-align: center;
}

header {
    background: linear-gradient(135deg, #1b5e20, #2e7d32);
    padding: 40px 20px;
}

header h1 {
    font-size: 45px;
    margin: 0 0 10px;
}

header p {
    font-size: 18px;
}

.contenitore {
    width: 90%;
    max-width: 900px;
    margin: 35px auto;
}

.scheda {
    background: #1b2a20;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.icona {
    font-size: 50px;
}

h2 {
    color: #81c784;
    font-size: 30px;
}

input,
textarea,
select {
    width: 90%;
    max-width: 700px;
    padding: 14px;
    margin: 10px auto;
    display: block;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    box-sizing: border-box;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 25px;
    margin-top: 15px;
    font-size: 18px;
    background: #43a047;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1b5e20;
}

.home {
    display: inline-block;
    margin: 20px;
    padding: 12px 20px;
    border-radius: 10px;
    background: #2e7d32;
    color: white;
    cursor: pointer;
}

.home:hover {
    background: #1b5e20;
}

#messaggio {
    margin-top: 20px;
    font-size: 18px;
    color: #81c784;
    font-weight: bold;
}

#noteSalvate {
    text-align: left;
    margin-top: 25px;
}

.nota {
    background: #26382b;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    border-left: 5px solid #43a047;
}

footer {
    margin-top: 50px;
    background: #0b120d;
    padding: 20px;
    color: #bdbdbd;
}

</style>

</head>

<body>

<header>

```
<h1>🌍 EcoGame</h1>

<p>
    Diario personale e recensioni
</p>
```

</header>

<div
    class="home"
    onclick="location.href='index.html'">

```
🏠 Torna al menu
```

</div>

<div class="contenitore">

```
<!-- AGENDA -->

<div class="scheda">

    <div class="icona">
        📖
    </div>

    <h2>
        La mia agenda
    </h2>

    <p>
        Scrivi quello che hai imparato,
        gli argomenti da ripassare
        oppure le tue idee.
    </p>

    <textarea
        id="nota"
        placeholder="Scrivi qui la tua nota...">
    </textarea>

    <button onclick="salvaNota()">

        💾 Salva nota

    </button>

    <div id="noteSalvate"></div>

</div>


<!-- RECENSIONE -->

<div class="scheda">

    <div class="icona">
        ⭐
    </div>

    <h2>
        Lascia una recensione
    </h2>

    <p>
        Dicci cosa ne pensi di EcoGame!
    </p>

    <input
        type="text"
        id="username"
        placeholder="Il tuo nome o username">

    <select id="stelle">

        <option value="5">
            ⭐⭐⭐⭐⭐ — Fantastico
        </option>

        <option value="4">
            ⭐⭐⭐⭐ — Molto bello
        </option>

        <option value="3">
            ⭐⭐⭐ — Bello
        </option>

        <option value="2">
            ⭐⭐ — Da migliorare
        </option>

        <option value="1">
            ⭐ — Non mi è piaciuto
        </option>

    </select>

    <textarea
        id="recensione"
        placeholder="Scrivi la tua recensione...">
    </textarea>

    <button onclick="inviaRecensione()">

        📩 Invia recensione

    </button>

    <div id="messaggio"></div>

</div>
```

</div>

<footer>

```
🌱 EcoGame — Imparare l'ecologia giocando
```

</footer>

<script>


function salvaNota() {

    const testo =
        document.getElementById("nota").value.trim();

    if (testo === "") {

        alert("✏️ Scrivi prima una nota!");

        return;

    }

    let note =
        JSON.parse(
            localStorage.getItem("ecoGameNote") || "[]"
        );

    note.push(testo);

    localStorage.setItem(
        "ecoGameNote",
        JSON.stringify(note)
    );

    document.getElementById("nota").value = "";

    mostraNote();

}


function mostraNote() {

    const contenitore =
        document.getElementById("noteSalvate");

    let note =
        JSON.parse(
            localStorage.getItem("ecoGameNote") || "[]"
        );

    contenitore.innerHTML =
        "<h3>📝 Le tue note</h3>";

    note.forEach(function(nota, indice) {

        const div =
            document.createElement("div");

        div.className = "nota";

        div.innerHTML =
            "📝 " + nota +
            "<br><button onclick=\"eliminaNota(" +
            indice +
            ")\">🗑️ Elimina</button>";

        contenitore.appendChild(div);

    });

}


function eliminaNota(indice) {

    let note =
        JSON.parse(
            localStorage.getItem("ecoGameNote") || "[]"
        );

    note.splice(indice, 1);

    localStorage.setItem(
        "ecoGameNote",
        JSON.stringify(note)
    );

    mostraNote();

}


function inviaRecensione() {

    const username =
        document.getElementById("username").value.trim();

    const stelle =
        document.getElementById("stelle").value;

    const recensione =
        document.getElementById("recensione").value.trim();

    if (recensione === "") {

        alert(
            "✏️ Scrivi una recensione prima di inviarla!"
        );

        return;

    }

    let simboli = "";

    for (
        let i = 0;
        i < Number(stelle);
        i++
    ) {

        simboli += "⭐";

    }

    const testoEmail =

        "Nuova recensione EcoGame%0D%0A%0D%0A" +

        "Username: " +
        encodeURIComponent(
            username || "Anonimo"
        ) +

        "%0D%0A" +

        "Valutazione: " +
        simboli +

        "%0D%0A%0D%0A" +

        "Recensione:%0D%0A" +

        encodeURIComponent(recensione);


    const email =
    "federicapiattipvt@gmail.com";


    window.location.href =
        "mailto:" +
        email +
        "?subject=Recensione%20EcoGame&body=" +
        testoEmail;


    document.getElementById("messaggio").innerText =
        "📩 Si sta aprendo la tua app email. Premi Invia per mandarmi la recensione.";

}


mostraNote();

</script>

</body>

</html>
