<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diario & Recensioni — EcoGame 🌍</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101c14;
    color: white;
    text-align: center;
}

header {
    background: linear-gradient(135deg, #1b5e20, #2e7d32);
    padding: 40px 20px;
}

header h1 {
    font-size: 45px;
    margin: 0 0 10px;
}

header p {
    font-size: 18px;
}

.contenitore {
    width: 90%;
    max-width: 900px;
    margin: 35px auto;
}

.scheda {
    background: #1b2a20;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

.icona {
    font-size: 50px;
}

h2 {
    color: #81c784;
    font-size: 30px;
}

input,
textarea,
select {
    width: 90%;
    max-width: 700px;
    padding: 14px;
    margin: 10px auto;
    display: block;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    box-sizing: border-box;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 25px;
    margin-top: 15px;
    font-size: 18px;
    background: #43a047;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1b5e20;
}

.home {
    display: inline-block;
    margin: 20px;
    padding: 12px 20px;
    border-radius: 10px;
    background: #2e7d32;
    color: white;
    cursor: pointer;
}

.home:hover {
    background: #1b5e20;
}

#messaggio {
    margin-top: 20px;
    font-size: 18px;
    color: #81c784;
    font-weight: bold;
}

#noteSalvate {
    text-align: left;
    margin-top: 25px;
}

.nota {
    background: #26382b;
    padding: 15px;
    margin: 10px 0;
    border-radius: 10px;
    border-left: 5px solid #43a047;
}

footer {
    margin-top: 50px;
    background: #0b120d;
    padding: 20px;
    color: #bdbdbd;
}


/* ============================= */
/* SELETTORE LINGUA - AGGIUNTO */
/* ============================= */

.lingua {
    position: absolute;
    top: 20px;
    right: 20px;
}

.lingua select {
    width: auto;
    margin: 0;
    padding: 10px 14px;
    border-radius: 10px;
    background: #263d32;
    color: white;
    cursor: pointer;
    font-size: 15px;
}


/* MOBILE */

@media (max-width: 700px) {

    .lingua {
        position: static;
        margin-top: 20px;
    }

}

</style>

</head>

<body>

<header>

<h1>🌍 EcoGame</h1>

<p id="sottotitolo">
    Diario personale e recensioni
</p>

<div class="lingua">

```
<select id="lingua" onchange="cambiaLingua()">

</select>
```

<div
    class="home"

```

```

<button onclick="inviaRecensione()" id="bottoneRecensione">

</button>

<div id="messaggio"></div>

</div>

</div>

<footer>

```
<span id="footerTesto">
    🌱 EcoGame — Imparare l'ecologia giocando

/* ============================= */
/* CAMBIO LINGUA */
/* ============================= */

function cambiaLingua() {

    const lingua =
        document.getElementById("lingua").value;

    const t =
        traduzioni[lingua];


    document.documentElement.lang = lingua;


    document.getElementById("sottotitolo").innerText =
        t.sottotitolo;

    document.getElementById("tornaMenu").innerText =
        t.tornaMenu;

    document.getElementById("titoloAgenda").innerText =
        t.titoloAgenda;

    document.getElementById("descrizioneAgenda").innerText =
        t.descrizioneAgenda;

    document.getElementById("nota").placeholder =
        t.notaPlaceholder;

    document.getElementById("bottoneSalva").innerText =
        t.salvaNota;

    document.getElementById("titoloRecensione").innerText =
        t.titoloRecensione;

    document.getElementById("descrizioneRecensione").innerText =
        t.descrizioneRecensione;

    document.getElementById("username").placeholder =
        t.username;

    document.getElementById("recensione").placeholder =
        t.recensionePlaceholder;

    document.getElementById("bottoneRecensione").innerText =
        t.inviaRecensione;


    document.getElementById("stella5").innerText =
        t.stella5;

    document.getElementById("stella4").innerText =
        t.stella4;

    document.getElementById("stella3").innerText =
        t.stella3;

    document.getElementById("stella2").innerText =
        t.stella2;

    document.getElementById("stella1").innerText =
        t.stella1;


    document.getElementById("footerTesto").innerText =
        t.footer;


    mostraNote();

}


/* ============================= */
/* SALVA NOTA */
/* ============================= */

function salvaNota() {

    const testo =
        document.getElementById("nota").value.trim();

    if (testo === "") {

        const lingua =
            document.getElementById("lingua").value;

        alert(
            traduzioni[lingua].scriviNota
        );

        return;

    }

    let note =
        JSON.parse(
            localStorage.getItem("ecoGameNote") || "[]"
        );

    note.push(testo);

    localStorage.setItem(
        "ecoGameNote",
        JSON.stringify(note)
    );

    document.getElementById("nota").value = "";

    mostraNote();

}


/* ============================= */
/* MOSTRA NOTE */
/* ============================= */

function mostraNote() {

    const contenitore =
        document.getElementById("noteSalvate");

    let note =
        JSON.parse(
            localStorage.getItem("ecoGameNote") || "[]"
        );

    const lingua =
        document.getElementById("lingua").value;

    const t =
        traduzioni[lingua];


    contenitore.innerHTML =
        "<h3>" + t.tueNote + "</h3>";


    note.forEach(function(nota, indice) {

        const div =
            document.createElement("div");

        div.className = "nota";

        div.innerHTML =
            "📝 " + nota +
            "<br><button onclick=\"eliminaNota(" +
            indice +
            ")\">" +
            t.elimina +
            "</button>";

        contenitore.appendChild(div);

    });

}


/* ============================= */
/* ELIMINA NOTA */
/* ============================= */

function eliminaNota(indice) {

    let note =
        JSON.parse(
            localStorage.getItem("ecoGameNote") || "[]"
        );

    note.splice(indice, 1);

    localStorage.setItem(
        "ecoGameNote",
        JSON.stringify(note)
    );

    mostraNote();

}


/* ============================= */
/* INVIA RECENSIONE */
/* ============================= */

function inviaRecensione() {

    const username =
        document.getElementById("username").value.trim();

    const stelle =
        document.getElementById("stelle").value;

    const recensione =
        document.getElementById("recensione").value.trim();


    const lingua =
        document.getElementById("lingua").value;


    if (recensione === "") {

        alert(
            traduzioni[lingua].scriviRecensione
        );

        return;

    }


    let simboli = "";

    for (
        let i = 0;
        i < Number(stelle);
        i++
    ) {

        simboli += "⭐";

    }


    const testoEmail =

        "Nuova recensione EcoGame%0D%0A%0D%0A" +

        "Username: " +
        encodeURIComponent(
            username || "Anonimo"
        ) +

        "%0D%0A" +

        "Valutazione: " +
        simboli +

        "%0D%0A%0D%0A" +

        "Recensione:%0D%0A" +

        encodeURIComponent(recensione);


    const email =
        "federicapiattipvt@gmail.com";


    window.location.href =
        "mailto:" +
        email +
        "?subject=Recensione%20EcoGame&body=" +
        testoEmail;


    document.getElementById("messaggio").innerText =
        traduzioni[lingua].email;

}


/* ============================= */
/* CARICAMENTO INIZIALE */
/* ============================= */

mostraNote();
