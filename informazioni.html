/* =====================================================
   SALVIAMO IL TESTO ORIGINALE
   ===================================================== */

const testiOriginali = new Map();

function salvaTestiOriginali() {

    const walker = document.createTreeWalker(
        document.body,
        NodeFilter.SHOW_TEXT
    );

    let nodo;

    while (nodo = walker.nextNode()) {

        if (
            nodo.parentElement &&
            nodo.parentElement.tagName !== "SCRIPT" &&
            nodo.parentElement.tagName !== "STYLE"
        ) {

            testiOriginali.set(
                nodo,
                nodo.nodeValue
            );

        }

    }

}


/* =====================================================
   NORMALIZZAZIONE
   ===================================================== */

function normalizza(testo) {

    return testo
        .replace(/\s+/g, " ")
        .trim();

}


/* =====================================================
   CAMBIO LINGUA
   ===================================================== */

function cambiaLingua(lingua) {

    linguaAttuale = lingua;

    const traduzione = traduzioni[lingua];

    if (!traduzione) {
        return;
    }


    /*
       Ripristiniamo SEMPRE il testo italiano originale
       prima di applicare una nuova lingua.

       Questo permette di passare, ad esempio:

       Italiano → Finlandese → Inglese → Italiano

       senza perdere i testi originali.
    */

    testiOriginali.forEach((testoOriginale, nodo) => {

        if (nodo.parentElement) {

            const testoPulito =
                normalizza(testoOriginale);

            if (traduzione[testoPulito]) {

                /*
                   Manteniamo gli spazi originali
                   quando possibile.
                */

                nodo.nodeValue =
                    testoOriginale.replace(
                        testoPulito,
                        traduzione[testoPulito]
                    );

            } else {

                nodo.nodeValue =
                    testoOriginale;

            }

        }

    });


    document.documentElement.lang = lingua;


    /* =================================================
       PULSANTI LINGUA
       ================================================= */

    const pulsantiLingua = [
        "itBtn",
        "enBtn",
        "esBtn",
        "fiBtn"
    ];

    pulsantiLingua.forEach(id => {

        const pulsante =
            document.getElementById(id);

        if (pulsante) {

            pulsante.classList.remove("attiva");

        }

    });


    const pulsanteAttivo =
        document.getElementById(
            lingua + "Btn"
        );

    if (pulsanteAttivo) {

        pulsanteAttivo.classList.add("attiva");

    }

}


/* =====================================================
   SALVIAMO I TESTI ORIGINALI ALL'AVVIO
   ===================================================== */
