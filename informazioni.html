function toggle(id) {

    const sezione = document.getElementById(id);

    if (!sezione) return;

    const contenuto =
        sezione.querySelector(".contenuto");

    if (contenuto) {
        contenuto.classList.toggle("aperto");

}


function apriSezione(id) {

    const sezione =
        document.getElementById(id);

    if (!sezione) return;

    const contenuto =
        sezione.querySelector(".contenuto");

    if (contenuto) {
        contenuto.classList.add("aperto");
    }

}

/* =====================================================
   SISTEMA DI TRADUZIONE
   ===================================================== */

let linguaAttuale = "it";


/*
   Salviamo il testo originale italiano di ogni
   nodo di testo.

   Questo permette di cambiare lingua infinite volte:

   IT → EN → FI → IT → EN → FI
*/
const testiOriginali = new WeakMap();


function salvaTestiOriginali(elemento) {

    if (
        elemento.nodeType === Node.ELEMENT_NODE &&
        (
            elemento.tagName === "SCRIPT" ||
            elemento.tagName === "STYLE"
        )
    ) {
        return;
    }


    elemento.childNodes.forEach(nodo => {

        if (nodo.nodeType === Node.TEXT_NODE) {

            testiOriginali.set(
                nodo,
                nodo.nodeValue
            );

        }
        else if (
            nodo.nodeType === Node.ELEMENT_NODE
        ) {

            salvaTestiOriginali(nodo);

        }

    });

}


/*
   Normalizza gli spazi per poter confrontare
   correttamente i testi.
*/
function normalizza(testo) {

    return testo
        .replace(/\s+/g, " ")
        .trim();

}


/*
   Ripristina completamente il testo italiano.
*/
function ripristinaItaliano(elemento) {

    if (
        elemento.nodeType === Node.ELEMENT_NODE &&
        (
            elemento.tagName === "SCRIPT" ||
            elemento.tagName === "STYLE"
        )
    ) {
        return;
    }


    elemento.childNodes.forEach(nodo => {

        if (nodo.nodeType === Node.TEXT_NODE) {

            if (testiOriginali.has(nodo)) {

                nodo.nodeValue =
                    testiOriginali.get(nodo);

            }

        }
        else if (
            nodo.nodeType === Node.ELEMENT_NODE
        ) {

            ripristinaItaliano(nodo);

        }

    });

}


/*
   Traduce ricorsivamente ogni nodo di testo.

   In questo modo funzionano anche elementi come:

   <strong>testo</strong>

   <span class="termine">testo</span>

   <p>testo <strong>importante</strong></p>
*/
function traduciNodo(elemento, lingua) {

    if (
        elemento.nodeType === Node.ELEMENT_NODE &&
        (
            elemento.tagName === "SCRIPT" ||
            elemento.tagName === "STYLE"
        )
    ) {
        return;
    }


    elemento.childNodes.forEach(nodo => {

        if (nodo.nodeType === Node.TEXT_NODE) {

            const originale =
                normalizza(
                    testiOriginali.get(nodo) ??
                    nodo.nodeValue
                );


            if (
                traduzioni[lingua] &&
                traduzioni[lingua][originale]
            ) {

                const traduzione =
                    traduzioni[lingua][originale];


                /*
                   Manteniamo eventuali spazi
                   presenti nel nodo originale.
                */
                const valoreOriginale =
                    testiOriginali.get(nodo) ??
                    nodo.nodeValue;


                const spazioInizio =
                    valoreOriginale.match(/^\s*/)?.[0] || "";

                const spazioFine =
                    valoreOriginale.match(/\s*$/)?.[0] || "";


                nodo.nodeValue =
                    spazioInizio +
                    traduzione +
                    spazioFine;

            }

        }
        else if (
            nodo.nodeType === Node.ELEMENT_NODE
        ) {

            traduciNodo(nodo, lingua);

        }

    });

}


/*
   Cambia lingua.
*/
function cambiaLingua(lingua) {

    /*
       Accettiamo esclusivamente:
       it, en, fi
    */
    if (
        lingua !== "it" &&
        lingua !== "en" &&
        lingua !== "fi"
    ) {
        return;
    }


    linguaAttuale = lingua;


    /*
       Prima riportiamo sempre tutto
       alla versione italiana originale.
    */
    ripristinaItaliano(document.body);


    /*
       Se non è italiano, traduciamo.
    */
    if (lingua !== "it") {

        traduciNodo(
            document.body,
            lingua
        );

    }


    /*
       Aggiorna la lingua dichiarata
       nell'HTML.
    */
    document.documentElement.lang =
        lingua;


    /*
       Aggiorna i pulsanti.
    */
    document
        .querySelectorAll(".lingue button")
        .forEach(button => {

            button.classList.remove("attiva");

        });


    const pulsante =
        document.getElementById(
            lingua + "Btn"
        );


    if (pulsante) {

        pulsante.classList.add("attiva");

    }

}


/* =====================================================
   AVVIO
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        /*
           Salviamo TUTTO il testo italiano
           prima di qualsiasi traduzione.
        */
        salvaTestiOriginali(
            document.body
        );


        /*
           Italiano attivo all'avvio.
        */
        linguaAttuale = "it";

        document.documentElement.lang = "it";


        const pulsanteItaliano =
            document.getElementById("itBtn");


        if (pulsanteItaliano) {

            pulsanteItaliano.classList.add(
                "attiva"
            );

        }


        /*
           Apre automaticamente la prima sezione.
        */
        const primaSezione =
            document.querySelector(
                "#uso .contenuto"
            );


        if (primaSezione) {

            primaSezione.classList.add(
                "aperto"
            );

        }

    }
);

</script>
