
<!DOCTYPE html>

<html lang="it">

<head>

<meta charset="UTF-8">

<title>🐝 Eco Bee Runner - EcoGame</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101820;
    color: white;
    overflow-x: hidden;
}

header {
    background: #17251d;
    border-bottom: 1px solid #3d5544;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #ffd54f;
    font-size: 24px;
    font-weight: bold;
}

.info {
    color: #c7d3c9;
}

.container {
    width: 94%;
    max-width: 1000px;
    margin: 30px auto;
}

.intro {
    text-align: center;
}

.intro h1 {
    color: #ffd54f;
    font-size: 38px;
    margin-bottom: 8px;
}

.intro p {
    color: #b9c9bd;
    line-height: 1.6;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 20px 0;
}

.stat {
    background: #17251d;
    border: 1px solid #4d604b;
    padding: 12px 25px;
    border-radius: 12px;
}

.stat span {
    color: #ffd54f;
    font-weight: bold;
    font-size: 22px;
}

.game {
    position: relative;
    width: 100%;
    height: 380px;

    background:
        linear-gradient(
            #86c5d8 0%,
            #b9e0df 55%,
            #789c55 56%,
            #456638 100%
        );

    border: 2px solid #526d56;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
}

.sun {
    position: absolute;
    top: 25px;
    right: 65px;
    font-size: 58px;
}

.cloud {
    position: absolute;
    top: 55px;
    left: 18%;
    font-size: 45px;
    opacity: 0.8;
}

.cloud2 {
    position: absolute;
    top: 110px;
    left: 65%;
    font-size: 35px;
    opacity: 0.7;
}

.flower {
    position: absolute;
    bottom: 55px;
    font-size: 30px;
}

.flower1 {
    left: 20%;
}

.flower2 {
    left: 55%;
}

.flower3 {
    left: 80%;
}

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 60px;
    background: #456638;
    border-top: 4px solid #77965d;
}


/* APE */

.player {
    position: absolute;

    left: 90px;

    bottom: 60px;

    width: 70px;
    height: 65px;

    font-size: 55px;

    z-index: 5;

    user-select: none;

    /*
     * L'ape guarda verso destra,
     * cioè verso i rifiuti.
     */
    transform: scaleX(-1);

    filter:
        drop-shadow(
            2px 3px 2px
            rgba(0,0,0,0.25)
        );
}


/* CONTENITORE OSTACOLI */

.obstacles {
    position: absolute;

    bottom: 60px;

    right: 0;

    width: 100%;
    height: 75px;

    pointer-events: none;
}


/* SINGOLO RIFIUTO */

.obstacle {
    position: absolute;

    bottom: 0;

    right: -100px;

    width: 65px;
    height: 65px;

    font-size: 50px;

    display: flex;

    align-items: center;

    justify-content: center;

    user-select: none;

    filter:
        drop-shadow(
            2px 3px 2px
            rgba(0,0,0,0.3)
        );
}


/* SECONDO OSTACOLO */

.obstacle2 {
    position: absolute;

    bottom: 0;

    right: -220px;

    width: 65px;
    height: 65px;

    font-size: 50px;

    display: flex;

    align-items: center;

    justify-content: center;

    user-select: none;

    filter:
        drop-shadow(
            2px 3px 2px
            rgba(0,0,0,0.3)
        );
}


/* GAME OVER */

.gameover {
    position: absolute;

    inset: 0;

    background:
        rgba(10,20,15,0.84);

    display: none;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    z-index: 20;

    text-align: center;
}

.gameover h2 {
    color: #ff8a80;

    font-size: 42px;

    margin: 5px;
}

.gameover p {
    color: #e0ebe2;

    font-size: 18px;
}

button {
    border: none;

    border-radius: 10px;

    padding: 13px 22px;

    background: #f9a825;

    color: #17251d;

    font-weight: bold;

    font-size: 16px;

    cursor: pointer;

    margin: 5px;
}

button:hover {
    background: #ffd54f;
}

.help {
    text-align: center;

    margin-top: 20px;

    color: #aebdb1;
}

kbd {
    background: #26382b;

    border: 1px solid #526653;

    padding: 4px 9px;

    border-radius: 5px;

    color: white;
}

@media(max-width:650px) {

    .game {
        height: 320px;
    }

    .player {
        left: 50px;
    }

}

</style>

</head>

<body>

<header>

```
<div class="logo">
    🌍 EcoGame
</div>

<div class="info">
    🐝 Eco Bee Runner
</div>
```

</header>

<div class="container">

```
<div class="intro">

    <h1>🐝 Eco Bee Runner</h1>

    <p>
        Aiuta l'ape a ripulire il suo ambiente!
        Salta i rifiuti e non farti colpire.
    </p>

</div>


<div class="stats">

    <div class="stat">
        Distanza:
        <span id="score">0</span> m
    </div>

    <div class="stat">
        Record:
        <span id="record">0</span> m
    </div>

</div>


<div
    class="game"
    id="game"
    tabindex="0">


    <div class="sun">
        ☀️
    </div>


    <div class="cloud">
        ☁️
    </div>


    <div class="cloud2">
        ☁️
    </div>


    <div class="flower flower1">
        🌷
    </div>

    <div class="flower flower2">
        🌼
    </div>

    <div class="flower flower3">
        🌻
    </div>


    <!-- APE -->

    <div
        class="player"
        id="player">

        🐝

    </div>


    <!-- OSTACOLI -->

    <div class="obstacles">

        <div
            class="obstacle"
            id="obstacle">

            🥫

        </div>


        <div
            class="obstacle2"
            id="obstacle2">

        </div>

    <div
        class="gameover"

        </p>

        <div>

            <button

</div>


<div class="help">

    <kbd>SPAZIO</kbd>
    o

```

</div>

<script>


const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const obstacle =
    document.getElementById("obstacle");

const obstacle2 =
    document.getElementById("obstacle2");

const scoreElement =
    document.getElementById("score");

const recordElement =
    document.getElementById("record");

const gameover =
    document.getElementById("gameover");

const finalScore =
    document.getElementById("finalScore");


let jumping = false;

let gameRunning = true;

let playerY = 0;

let velocity = 0;

let score = 0;

let speed = 7;

let obstacleX = -100;

let obstacle2X = -220;

let secondActive = false;

let lastTime = 0;

let record =
    Number(
        localStorage.getItem(
            "ecoBeeRecord"
        )
    ) || 0;


/*
 * TANTI TIPI DI RIFIUTI
 */

const rifiuti = [

    "🥫", // lattina

    "🧴", // bottiglia

    "🧃", // confezione

    "🥤", // bicchiere

    "🍾", // bottiglia

    "🗑️", // cestino

    "📄", // carta

    "📰", // giornale

    "📦", // scatola

    "🧻", // carta

    "🛍️", // sacchetto

    "🧋", // bicchiere

    "🥡", // contenitore

    "🍴"  // posata

];


recordElement.innerText =
    record;


/*
 * PRENDI UN RIFIUTO CASUALE
 */

function rifiutoCasuale() {

    return rifiuti[
        Math.floor(
            Math.random() *
            rifiuti.length
        )
    ];

}


/*
 * SALTO
 */

function jump() {

    if (!gameRunning) {
        return;
    }


    if (!jumping) {

        jumping = true;

        velocity = 15;

    }

}


/*
 * TASTIERA
 */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code === "Space" ||
            event.code === "ArrowUp"
        ) {

            event.preventDefault();

            jump();

        }

    }
);


/*
 * CLICK
 */

game.addEventListener(
    "mousedown",
    jump
);


/*
 * TOUCH
 */

game.addEventListener(
    "touchstart",
    jump
);


/*
 * COLLISIONE
 */

function collisione(a, b) {

    const r1 =
        a.getBoundingClientRect();

    const r2 =
        b.getBoundingClientRect();


    return !(
        r1.right - 15 < r2.left + 10 ||

        r1.left + 15 > r2.right - 10 ||

        r1.bottom - 10 < r2.top + 8 ||

        r1.top + 10 > r2.bottom - 8
    );

}


/*
 * GAME LOOP
 */

function gameLoop(timestamp) {


    if (!lastTime) {
        lastTime = timestamp;
    }


    const delta =
        Math.min(
            2,
            (timestamp - lastTime) /
            16.67
        );


    lastTime = timestamp;


    if (gameRunning) {


        /*
         * SALTO
         */

        if (jumping) {

            playerY +=
                velocity * delta;

            velocity -=
                0.8 * delta;


            if (playerY <= 0) {

                playerY = 0;

                velocity = 0;

                jumping = false;

            }

        }


        player.style.bottom =
            (60 + playerY) + "px";


        /*
         * PRIMO RIFIUTO
         */

        obstacleX +=
            speed * delta;


        obstacle.style.right =
            obstacleX + "px";


        /*
         * SECONDO RIFIUTO
         */

        if (secondActive) {

            obstacle2X +=
                speed * delta;

            obstacle2.style.right =
                obstacle2X + "px";

        }


        /*
         * NUOVO GRUPPO DI RIFIUTI
         */

        if (
            obstacleX >
            game.offsetWidth + 100
        ) {


            obstacleX = -100;


            obstacle.innerText =
                rifiutoCasuale();


            score += 10;


            scoreElement.innerText =
                score;


            /*
             * Possibilità di generare
             * un secondo oggetto.
             */

            if (
                score >= 60 &&
                Math.random() < 0.35
            ) {

                secondActive = true;

                obstacle2X =
                    -100 -
                    (90 +
                    Math.random() * 110);


                obstacle2.innerText =
                    rifiutoCasuale();

            } else {

                secondActive = false;

                obstacle2X = -220;

                obstacle2.style.right =
                    "-220px";

            }


            /*
             * AUMENTA LA VELOCITÀ
             */

            speed += 0.13;

        }


        /*
         * COLLISIONE PRIMO
         */

        if (
            collisione(
                player,
                obstacle
            )
        ) {

            fine();

        }


        /*
         * COLLISIONE SECONDO
         */

        if (
            secondActive &&
            collisione(
                player,
                obstacle2
            )
        ) {

            fine();

        }

    }


    requestAnimationFrame(
        gameLoop
    );

}


/*
 * GAME OVER
 */

function fine() {

    gameRunning = false;


    finalScore.innerText =
        score;


    if (score > record) {

        record = score;


        localStorage.setItem(
            "ecoBeeRecord",
            record
        );


        recordElement.innerText =
            record;

    }


    gameover.style.display =
        "flex";

}


/*
 * RIAVVIA
 */

function restart() {


    score = 0;

    speed = 7;

    obstacleX = -100;

    obstacle2X = -220;

    secondActive = false;

    playerY = 0;

    velocity = 0;

    jumping = false;

    gameRunning = true;

    lastTime = 0;


    scoreElement.innerText =
        "0";


    player.style.bottom =
        "60px";


    obstacle.style.right =
        "-100px";


    obstacle2.style.right =
        "-220px";


    obstacle.innerText =
        "🥫";


    obstacle2.innerText =
        "📄";


    gameover.style.display =
        "none";


    game.focus();

}


restart();


requestAnimationFrame(
    gameLoop
);


</script>

</body>

</html>
