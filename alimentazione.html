<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍽️ Food Impact - EcoGame</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111b16;
    color: #edf7ef;
}

header {
    background: #18271e;
    border-bottom: 1px solid #3b5542;
    padding: 18px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.logo {
    color: #81c784;
    font-size: 24px;
    font-weight: bold;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.language {
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid #3d5945;
    background: #20362a;
    color: white;
    font-size: 14px;
    cursor: pointer;
}

.menu {
    color: #bfd0c3;
    cursor: pointer;
}

.menu:hover {
    color: #81c784;
}

.container {
    width: 94%;
    max-width: 1050px;
    margin: 30px auto;
}

.title {
    text-align: center;
}

.title h1 {
    color: #81c784;
    font-size: 40px;
    margin-bottom: 8px;
}

.title p {
    color: #bfd0c3;
    line-height: 1.6;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 25px 0;
}

.stat {
    background: #18291f;
    border: 1px solid #3d5945;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.stat-icon {
    font-size: 27px;
}

.stat-name {
    color: #b8c8bc;
    font-size: 13px;
    margin-top: 5px;
}

.stat-value {
    font-size: 23px;
    font-weight: bold;
    color: #a5d6a7;
    margin-top: 5px;
}

.card {
    background: #18291f;
    border: 1px solid #3d5945;
    border-radius: 18px;
    padding: 28px;
    margin-top: 20px;
}

.step {
    color: #81c784;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

h2 {
    color: #c8e6c9;
}

.description {
    color: #c1cec4;
    line-height: 1.7;
}

.options {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
    margin-top: 20px;
}

.option {
    background: #20362a;
    color: white;
    border: 2px solid #405b47;
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    text-align: left;
    font-size: 16px;
    transition: .15s;
}

.option:hover {
    border-color: #81c784;
    background: #294532;
}

.option.selected {
    border-color: #66bb6a;
    background: #31553a;
}

.option.disabled {
    opacity: .45;
    cursor: not-allowed;
}

.continue {
    display: block;
    margin: 25px auto 0;
    padding: 13px 25px;
    border: none;
    border-radius: 10px;
    background: #43a047;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.continue:hover {
    background: #4caf50;
}

.summary {
    background: #20362a;
    border-radius: 12px;
    padding: 18px;
    margin-top: 20px;
    line-height: 1.7;
}

.result {
    text-align: center;
    padding: 30px;
}

.result-icon {
    font-size: 75px;
}

.result h2 {
    font-size: 32px;
}

.final-score {
    font-size: 48px;
    color: #ffd54f;
    font-weight: bold;
    margin: 15px;
}

.restart,
.back {
    padding: 13px 22px;
    margin: 8px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.restart {
    background: #43a047;
    color: white;
}

.back {
    background: #455a64;
    color: white;
}

.hidden {
    display: none;
}

@media(max-width: 700px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .options {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 20px;
    }

    header {
        padding: 15px;
    }

    .header-right {
        width: 100%;
        justify-content: flex-end;
    }

}

</style>

    <!-- RISULTATO -->

/* =====================================================

===================================================== */

function updateStaticTexts() {

}


/* =====================================================

===================================================== */

function changeLanguage() {

    const selector =
        document.getElementById("languageSelector");


    lingua =
        selector.value;


    /*
       Salva la lingua.

       Questa è LA STESSA chiave utilizzata
       dalla pagina giochi.html.
    */

    localStorage.setItem(
        "linguaEcoGame",
        lingua
    );


    /*
       Aggiorna tutti i testi statici.
    */

    updateStaticTexts();


    /*
       Se siamo ancora dentro il gioco,
       ricarica la fase nella nuova lingua.
    */

    if (
        !document
            .getElementById("gameCard")
            .classList.contains("hidden")
    ) {

        loadStep();

    }


    /*
       Se il risultato è già visibile,
       aggiorna anche il messaggio finale.
    */

    if (
        !document
            .getElementById("resultCard")
            .classList.contains("hidden")
    ) {

        showResult();

    }

}

/* =====================================================

===================================================== */

let step = 0;

let selected = false;


let stats = {

    cost: 0,

    climate: 0,

    water: 0,

    waste: 0

};


/* =====================================================
   AGGIORNA LE STATISTICHE
===================================================== */

function updateStats() {

    document.getElementById("cost").innerText =
        stats.cost + " €";


    document.getElementById("climate").innerText =
        stats.climate;


    document.getElementById("water").innerText =
        stats.water;


    document.getElementById("waste").innerText =
        Math.max(
            0,
            stats.waste
        );

}


/* =====================================================
   CARICA LA FASE
===================================================== */

function loadStep() {

    selected = false;


    const current =
        steps[step];


    const testi =
        traduzioni[lingua];


    document.getElementById("step").innerText =
        testi.fase +
        " " +
        (step + 1) +
        " / " +
        steps.length;


    document.getElementById("title").innerText =
        current.title[lingua];


    document.getElementById("description").innerText =
        current.description[lingua];


    const options =
        document.getElementById("options");


    options.innerHTML =
        "";


    document.getElementById("continue").style.display =
        "none";


    document.getElementById("summary")
        .classList.add("hidden");


    document.getElementById("summary").innerHTML =
        "";


    current.options.forEach(
        function(option) {

            const button =
                document.createElement("button");


            button.className =
                "option";


            button.innerText =
                option.text[lingua];


            button.onclick =
                function() {

                    chooseOption(
                        option,
                        button
                    );

                };


            options.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   SCELTA
===================================================== */

function chooseOption(
    option,
    button
) {

    if (selected) {
        return;
    }


    selected = true;


    stats.cost +=
        option.cost;


    stats.climate +=
        option.climate;


    stats.water +=
        option.water;


    stats.waste +=
        option.waste;


    button.classList.add(
        "selected"
    );


    const all =
        document.querySelectorAll(
            ".option"
        );


    all.forEach(
        function(item) {

            item.classList.add(
                "disabled"
            );

        }
    );


    updateStats();


    document.getElementById("summary")
        .classList.remove("hidden");


    const wasteText =
        option.waste >= 0
            ? "+" + option.waste
            : option.waste;


    const testi =
        traduzioni[lingua];


    document.getElementById("summary").innerHTML =

        testi.impatto +

        "<br><br>" +

        "🌡️ " +
        testi.climaShort +
        ": +" +
        option.climate +

        " &nbsp;&nbsp; " +

        "💧 " +
        testi.acquaShort +
        ": +" +
        option.water +

        " &nbsp;&nbsp; " +

        "🗑️ " +
        testi.rifiutiShort +
        ": " +
        wasteText;


    document.getElementById("continue")
        .style.display =
        "block";

}


/* =====================================================
   FASE SUCCESSIVA
===================================================== */

function nextStep() {

    step++;


    if (step < steps.length) {

        loadStep();

    }

    else {

        showResult();

    }

}


/* =====================================================
   RISULTATO
===================================================== */

function showResult() {

    document.getElementById("gameCard")
        .classList.add("hidden");


    document.getElementById("resultCard")
        .classList.remove("hidden");


    let score =

        100

        - stats.climate * 3

        - stats.water * 2

        - Math.max(
            0,
            stats.waste
        ) * 3

        - Math.max(
            0,
            stats.cost - 10
        ) * 2;


    score =

        Math.max(

            0,

            Math.min(

                100,

                Math.round(score)

            )

        );


    document.getElementById(
        "finalScore"
    ).innerText =

        score +
        " / 100";


    const testi =
        traduzioni[lingua];


    let message;


    if (score >= 85) {

        message =
            testi.ottimo;

    }

    else if (score >= 70) {

        message =
            testi.buono;

    }

    else if (score >= 50) {

        message =
            testi.discreto;

    }

    else {

        message =
            testi.migliora;

    }


    document.getElementById(
        "message"
    ).innerText =

        message;

}


/* =====================================================
   RICOMINCIA
===================================================== */

function restartGame() {

    step = 0;

    selected = false;


    stats = {

        cost: 0,

        climate: 0,

        water: 0,

        waste: 0

    };


    updateStats();


    document.getElementById(
        "resultCard"
    )
        .classList.add("hidden");


    document.getElementById(
        "gameCard"
    )
        .classList.remove("hidden");


    loadStep();

}


/* =====================================================
   AVVIO
===================================================== */


/*
   Imposta la lingua nel selettore.
*/

document.getElementById(
    "languageSelector"
).value = lingua;


/*
   Traduce i testi statici.
*/

updateStaticTexts();


/*
   Aggiorna le statistiche.
*/

updateStats();


/*
   Avvia il gioco nella lingua
   salvata dal popup.
*/

loadStep();

</script>
