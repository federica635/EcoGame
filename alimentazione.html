function updateStats() {

    document.getElementById("cost").innerText =
        stats.cost + " €";

    document.getElementById("climate").innerText =
        stats.climate;

    document.getElementById("water").innerText =
        stats.water;

    document.getElementById("waste").innerText =
        Math.max(0, stats.waste);

}

function loadStep() {

    selected = false;

    const current = steps[step];

    document.getElementById("step").innerText =
        "FASE " + (step + 1) + " / 4";

    document.getElementById("title").innerText =
        current.title;

    document.getElementById("description").innerText =
        current.description;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    document.getElementById("continue").style.display =
        "none";

    document.getElementById("summary").classList.add(
        "hidden"
    );

    current.options.forEach(
        function(option) {

            const button =
                document.createElement("button");

            button.className = "option";

            button.innerText = option.text;

            button.onclick = function() {

                chooseOption(
                    option,
                    button
                );

            };

            options.appendChild(button);

        }
    );

}

function chooseOption(option, button) {

    if (selected) {
        return;
    }

    selected = true;

    stats.cost += option.cost;

    stats.climate += option.climate;

    stats.water += option.water;

    stats.waste += option.waste;

    button.classList.add("selected");

    const all =
        document.querySelectorAll(".option");

    all.forEach(
        function(item) {

            item.classList.add("disabled");

        }
    );

    updateStats();

    const summary =
        document.getElementById("summary");

    summary.classList.remove("hidden");

    summary.innerHTML =
        "📊 <strong>Impatto della scelta:</strong><br><br>" +
        "🌡️ Clima: +" + option.climate +
        " &nbsp;&nbsp; " +
        "💧 Acqua: +" + option.water +
        " &nbsp;&nbsp; " +
        "🗑️ Rifiuti: " + 
        (option.waste >= 0 ? "+" : "") +
        option.waste;

    document.getElementById("continue").style.display =
        "block";

    if (step === steps.length - 1) {

        document.getElementById("continue").innerText =
            "🏆 Vedi risultato";

    }

}

function nextStep() {

    step++;

    if (step < steps.length) {

        loadStep();

    } else {

        showResult();

    }

}

function showResult() {

    document.getElementById("gameCard")
        .classList.add("hidden");

    document.getElementById("resultCard")
        .classList.remove("hidden");

    /*
        PUNTEGGIO

        Meno impatto = risultato migliore.

        100 punti di base.

        Penalità:
        - impatto climatico
        - uso dell'acqua
        - rifiuti
        - costo oltre una determinata soglia
    */

    let score =
        100
        - stats.climate * 3
        - stats.water * 2
        - Math.max(0, stats.waste) * 3
        - Math.max(0, stats.cost - 10) * 2;

    score =
        Math.max(
            0,
            Math.min(
                100,
                Math.round(score)
            )
        );

    document.getElementById("finalScore").innerText =
        score + " / 100";

    let message;

    if (score >= 85) {

        message =
            "🌱 Ottima scelta! Hai costruito un pasto con un impatto ambientale contenuto e hai gestito bene le risorse.";

    } else if (score >= 70) {

        message =
            "👏 Buon risultato! Il tuo pasto è abbastanza sostenibile, anche se alcune scelte potevano essere migliorate.";

    } else if (score >= 50) {

        message =
            "🍽️ Risultato discreto. Alcune delle tue scelte hanno aumentato notevolmente l'impatto del pasto.";

    } else {

        message =
            "🌍 C'è spazio per migliorare. Prova a confrontare le alternative e a considerare anche acqua e rifiuti, non solo il prezzo.";

    }

    document.getElementById("message").innerText =
        message;

}

function restartGame() {

    step = 0;

    selected = false;

    stats = {
        cost: 0,
        climate: 0,
        water: 0,
        waste: 0
    };

    document.getElementById("gameCard")
        .classList.remove("hidden");

    document.getElementById("resultCard")
        .classList.add("hidden");

    document.getElementById("continue").innerText =
        "Continua →";

    updateStats();

    loadStep();

}

/* AVVIO DEL GIOCO */

updateStats();
loadStep();

</script>
