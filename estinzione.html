let animaleAttuale = 0;

let punteggio = 0;

let rispostaData = false;


/* -----------------------------------
   FUNZIONE PER MESCOLARE LE RISPOSTE
----------------------------------- */

function mescola(array) {

    const copia = [...array];

    for (let i = copia.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copia[i], copia[j]] =
        [copia[j], copia[i]];

    }

    return copia;
}


/* -----------------------------------
   MOSTRA ANIMALE
----------------------------------- */

function mostraAnimale() {

    rispostaData = false;

    const animale = animali[animaleAttuale];

    document.getElementById("numero").innerText =
        "ANIMALE " +
        (animaleAttuale + 1) +
        " DI " +
        animali.length;

    document.getElementById("animale").innerText =
        animale.emoji;

    document.getElementById("nomeAnimale").innerText =
        animale.nome;

    document.getElementById("descrizione").innerText =
        animale.descrizione;

    document.getElementById("informazioni").innerHTML =
        "<strong>💀 Perché si è estinto?</strong><br>" +
        animale.causa +
        "<br><br>" +
        "<strong>🛡️ Cosa si sarebbe potuto fare?</strong><br>" +
        animale.protezione;

    document.getElementById("domanda").innerText =
        animale.domanda;

    document.getElementById("risultato").innerText = "";

    document.getElementById("spiegazione").style.display =
        "none";

    document.getElementById("prossima").style.display =
        "none";


    const contenitore =
        document.getElementById("risposte");

    contenitore.innerHTML = "";


    /* MESCOLA LE RISPOSTE */

    const risposteMescolate =
        mescola(animale.risposte);


    risposteMescolate.forEach(function(risposta) {

        const bottone =
            document.createElement("button");

        bottone.className = "risposta";

        bottone.innerText =
            risposta.testo;

        bottone.onclick = function() {

            controllaRisposta(risposta);

        };

        contenitore.appendChild(bottone);

    });

}


/* -----------------------------------
   CONTROLLA RISPOSTA
----------------------------------- */

function controllaRisposta(risposta) {

    if (rispostaData) {
        return;
    }

    rispostaData = true;


    if (risposta.corretta) {

        punteggio++;

        document.getElementById("risultato").innerText =
            "✅ Risposta corretta!";

    } else {

        document.getElementById("risultato").innerText =
            "❌ Risposta sbagliata!";

    }


    const animale =
        animali[animaleAttuale];


    document.getElementById("spiegazione").innerText =
        "📚 " +
        animale.spiegazione;


    document.getElementById("spiegazione").style.display =
        "block";


    document.getElementById("prossima").style.display =
        "inline-block";

}


/* -----------------------------------
   PROSSIMO ANIMALE
----------------------------------- */

function prossimaDomanda() {

    animaleAttuale++;


    if (animaleAttuale < animali.length) {

        mostraAnimale();

    } else {

        mostraRisultatoFinale();

    }

}


/* -----------------------------------
   RISULTATO FINALE
----------------------------------- */

function mostraRisultatoFinale() {

    document.getElementById("gioco").style.display =
        "none";

    document.getElementById("finale").style.display =
        "block";


    document.getElementById("punteggioFinale").innerText =
        punteggio + " / 6";


    if (punteggio === 6) {

        document.getElementById("messaggioFinale").innerText =
            "🌟 Perfetto! Conosci molto bene la storia delle specie estinte e le principali cause della loro scomparsa.";

    } else if (punteggio >= 4) {

        document.getElementById("messaggioFinale").innerText =
            "🌱 Molto bene! Hai una buona conoscenza delle cause dell'estinzione.";

    } else if (punteggio >= 2) {

        document.getElementById("messaggioFinale").innerText =
            "👍 Buon lavoro! Hai imparato diverse cose, ma puoi approfondire ancora.";

    } else {

        document.getElementById("messaggioFinale").innerText =
            "📚 Continua a esplorare: conoscere le cause delle estinzioni aiuta a capire come proteggere le specie.";

    }

}


/* -----------------------------------
   RICOMINCIA
----------------------------------- */

function ricomincia() {

    animaleAttuale = 0;

    punteggio = 0;

    document.getElementById("finale").style.display =
        "none";

    document.getElementById("gioco").style.display =
        "block";

    mostraAnimale();

}


/* AVVIO DEL GIOCO */

mostraAnimale();
