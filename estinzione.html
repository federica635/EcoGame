let animaleAttuale = 0;

let punteggio = 0;

let rispostaData = false;


/* =====================================================
   FUNZIONE PER MESCOLARE LE RISPOSTE
   ===================================================== */

function mescola(array) {

    const copia = [...array];

    for (
        let i = copia.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            copia[i],
            copia[j]
        ] = [
            copia[j],
            copia[i]
        ];

    }

    return copia;

}

    const contenitore =
        document.getElementById("risposte");

    contenitore.innerHTML = "";


    const risposteMescolate =

                "risposta";


            bottone.innerText =
                risposta.testo;


            bottone.onclick =
                function() {

                    controllaRisposta(
                        risposta
                    );

                };


            contenitore.appendChild(
                bottone
            );

        }
    );

}

function controllaRisposta(risposta) {

    if (rispostaData) {
        return;
    }

    rispostaData = true;

    const t =
        testi[lingua];


    if (risposta.corretta) {

        punteggio++;

        document.getElementById("risultato").innerText =
            t.corretta;

    } else {

        document.getElementById("risultato").innerText =
            t.sbagliata;

    }


    const animale =
        animali[animaleAttuale];


    document.getElementById("spiegazione").innerText =
        t.spiegazione +
        " " +
        animale.spiegazione[lingua];


    document.getElementById("spiegazione").style.display =
        "block";


    document.getElementById("prossima").style.display =
        "inline-block";

}

        mostraAnimale();

        mostraRisultatoFinale();

    }

}

}

}
